
<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>A7 Superintendent V18 · Land & Manufactured Homes</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#082629;color:#edfff5;font:15px -apple-system,BlinkMacSystemFont,Arial;padding-bottom:80px}header{position:sticky;top:0;background:#092c2c;padding:15px;border-bottom:1px solid #39715f;z-index:2}main{max-width:850px;margin:auto;padding:15px}h1{font-size:25px}h2{font-size:21px}.muted,small{color:#b4d0c4}.panel{background:#123b3b;border:1px solid #376d60;border-radius:15px;padding:15px;margin:12px 0}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.tile{min-height:125px;text-align:left;color:white;border:0;border-radius:13px;padding:14px;background:#1b8062}.tile:nth-child(8n+2){background:#345f95}.tile:nth-child(8n+3){background:#b46d44}.tile:nth-child(8n+4){background:#8d5ba6}.tile:nth-child(8n+5){background:#aa4e72}.tile:nth-child(8n+6){background:#247e94}.tile:nth-child(8n+7){background:#9a7c36}.tile:nth-child(8n){background:#476f69}.tile b{display:block;font-size:16px;margin-bottom:13px}.tile small{color:#fff}.btn{background:#24996d;border:0;color:#fff;border-radius:10px;padding:11px 13px;font-weight:700;margin:4px 3px 4px 0}.btn:disabled{opacity:.4}.alt{background:#285d55}.danger{background:#91514d}.field{display:block;width:100%;font:inherit;background:#082a2c;color:white;border:1px solid #6c9b8b;border-radius:9px;padding:11px;margin:6px 0 12px}label{font-weight:650;display:block;margin-top:12px}.line{border-bottom:1px solid #36695c;padding:12px 0}.line:last-child{border:0}.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.pill{font-size:11px;background:#285e51;padding:5px 8px;border-radius:99px}.warn{background:#765328}.tabs{display:flex;overflow-x:auto;gap:5px}.tabs button{white-space:nowrap}.photos{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}.photos img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px}.photo{min-width:0;overflow-wrap:anywhere;font-size:11px}.photo button{font-size:11px}.nav{position:fixed;bottom:0;left:0;right:0;background:#09282a;border-top:1px solid #39715f;display:flex;padding:8px 3px calc(8px + env(safe-area-inset-bottom))}.nav button{flex:1;background:transparent;border:0;color:#d4f7e7;padding:8px 2px;font-size:12px}.chips{display:flex;flex-wrap:wrap;gap:9px}.chips label{font-weight:400;background:#21564b;padding:8px;border-radius:9px;margin:0}@media(min-width:700px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}

:root{color-scheme:dark}body{background:radial-gradient(ellipse at 80% -15%,#1d6653 0,transparent 48%),#071c1d;color:#eefbf5;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}header{background:#071f20ed;backdrop-filter:blur(15px);border-color:#26594b;padding:17px max(16px,calc((100vw - 880px)/2));box-shadow:0 4px 25px #0004}main{max-width:880px;padding:18px 16px 30px}h1{font-size:clamp(29px,7vw,43px);letter-spacing:-1.2px;line-height:1.1}h2{font-size:22px;letter-spacing:-.5px}h3{margin-top:4px}.muted,small{color:#abc8bd}.panel{background:linear-gradient(145deg,#123b3a,#0d302f);border-color:#28594e;border-radius:19px;padding:19px;box-shadow:0 10px 25px #0002}.hero{background:linear-gradient(115deg,#103f38dd,#082b2ddd),radial-gradient(circle at 90% 0,#52b581,transparent 55%);border:1px solid #39785f;border-radius:23px;padding:28px 22px;box-shadow:0 20px 55px #0005}.hero h1{margin:14px 0}.hero em{font-style:normal;color:#83e8b1}.hero p{max-width:500px;line-height:1.55;color:#c4dfd3}.eyebrow{font-size:11px;font-weight:800;letter-spacing:2px;color:#81e3b0}.btn{background:linear-gradient(130deg,#32aa72,#168153);border:1px solid #56c18b;border-radius:12px;padding:12px 14px;box-shadow:0 4px 12px #0002}.btn.alt{background:#184640;border-color:#35695a}.btn:focus-visible,.tile:focus-visible,.step:focus-visible{outline:3px solid #a3f8c7}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:14px 0}.stats>div{background:#103331;border:1px solid #2a554b;border-radius:15px;padding:15px 10px}.stats strong{display:block;font-size:28px;color:#8de5b5}.stats small{display:block;font-size:11px}.sectionhead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:22px 0 12px}.sectionhead h2{margin:0}.project{width:100%;display:flex;align-items:center;gap:14px;background:#113735;color:#effff5;border:1px solid #315c50;border-radius:16px;text-align:left;padding:17px;margin:9px 0;box-shadow:0 8px 20px #0002}.project span:nth-child(2){flex:1}.project small{display:block;margin-top:5px}.project-icon{display:grid;place-items:center;width:44px;height:44px;border-radius:13px;background:#245d4a;color:#93f4bc;font-size:27px}.arrow{margin-left:auto;font-size:28px;color:#7ce3aa}.grid{gap:12px}.tile{background:linear-gradient(145deg,#1b6554,#103d3d)!important;border:1px solid #42826a;min-height:145px;box-shadow:0 10px 20px #0003;display:flex;flex-direction:column;justify-content:space-between}.tile b{margin:8px 0}.tileicon{font-size:27px;color:#a7f6ca}.progress{height:5px;background:#30584f;border-radius:20px;overflow:hidden;margin-top:10px}.progress i{display:block;height:100%;background:#8cecb7}.timeline{border:1px solid #315c50;border-radius:18px;overflow:hidden}.step{width:100%;background:#103431;border:0;border-bottom:1px solid #2a5148;color:#fff;text-align:left;display:flex;align-items:center;gap:13px;padding:15px}.step:last-child{border:0}.step span:nth-child(2){flex:1}.step small{display:block;margin-top:4px}.stepnum{width:35px;height:35px;border-radius:50%;background:#3a5552;display:grid;place-items:center;flex:none}.stepnum.done{background:#288a5a}.stepnum.ready{background:#ad8039}.field{background:#092828;border-color:#467465;border-radius:12px}.chat{background:#103632;border:1px solid #356e59;border-radius:20px;padding:17px}.bubble{background:#194840;border:1px solid #376d5c;padding:17px;border-radius:16px;margin:12px 0;line-height:1.55}.bubble a{color:#a5f4c6}.suggestions{display:flex;gap:7px;flex-wrap:wrap;margin:12px 0}.suggestions button{background:#1d5047;border:1px solid #43816b;border-radius:99px;padding:9px;color:#d8fae8}.nav{background:#071f20f5;backdrop-filter:blur(15px);z-index:4;border-color:#2c6451}.nav button{font-weight:600}.photos img{border:1px solid #43816b}
</style></head><body><header><b style="font-size:23px">A<span style="color:#58e7a6">7</span> SUPERINTENDENT</b><div class="muted" style="font-size:11px">LAND DEVELOPMENT · MANUFACTURED HOMES · AI GUIDE</div></header><main id="app"></main><nav class="nav"><button onclick="go('home')">⌂<br>Home</button><button onclick="go('assistant')">✦<br>AI Guide</button><button onclick="go('parcels')">▦<br>Parcels</button><button onclick="go('people')">♟<br>Trades</button><button onclick="go('settings')">⚙<br>More</button></nav>
<script>
'use strict';
const KEY='a7-superintendent-v16',DB='a7-superintendent-v16-photos',TRADES=[['land','Land Purchase Cost'],['permits','Permits & Easements'],['clearing','Land Clearing'],['culvert','Entrance & Culvert'],['driveway','Rock Driveway'],['pad','Home Pad'],['water','Water Connection'],['electrical','Electrical Connection'],['home','Manufactured Home'],['transport','Home Transportation'],['setup','Home Setup'],['septic','Septic Installation'],['skirting','Home Skirting'],['decks','Decks & Access'],['hvac','HVAC'],['other','Other Parcel Expenses']];
const $=id=>document.getElementById(id),id=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,9),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),money=n=>Number(n||0).toLocaleString('en-US',{style:'currency',currency:'USD',maximumFractionDigits:0});
function newJob(k,name){return {key:k,name,scope:'',bids:[],state:'planning',photos:{before:[],middle:[],after:[]},approvedAt:'',exception:null,history:[]};}
function newParcel(name){return {id:id(),name,jobs:Object.fromEntries(TRADES.map(([k,n])=>[k,newJob(k,n)]))};}
function newDev(name,n){return {id:id(),name,parcels:Array.from({length:n},(_,i)=>newParcel('Parcel '+(i+1)))};}
function fresh(){return {developments:[newDev('My development',2)],contacts:[]};}
function migrate(old){let d=newDev(old.development?.name||'My development',2),out={developments:[d],contacts:[]};for(let i=0;i<2;i++)for(let [k,n] of TRADES){let o=old.jobs?.[(i+1)+'-'+k];if(o){let j=d.parcels[i].jobs[k];j.scope=o.scope||'';j.bids=Array.isArray(o.bids)?o.bids.map(b=>({...b,id:b.id||id()})):[];}}for(let c of old.contacts||old.contractors||[]){out.contacts.push({id:id(),name:c.name||c.company||'Contractor',phone:c.phone||'',email:c.email||'',trades:Array.isArray(c.trades)?c.trades:[],notes:c.notes||''});}return out;}
let data;try{data=JSON.parse(localStorage.getItem(KEY)||'null')||migrate(JSON.parse(localStorage.getItem('a7-superintendent-v15')||'null')||{});}catch(e){data=fresh();}if(!data?.developments?.length)data=fresh();if(!Array.isArray(data.contacts))data.contacts=[];
for(const d of data.developments)for(const p of d.parcels){p.jobs=p.jobs||{};for(const [k,n] of TRADES){let j=p.jobs[k]||newJob(k,n);j.key=k;j.name=n;j.photos=j.photos||{};for(const s of ['before','middle','after'])j.photos[s]=Array.isArray(j.photos[s])?j.photos[s]:[];j.bids=Array.isArray(j.bids)?j.bids:[];j.history=Array.isArray(j.history)?j.history:[];p.jobs[k]=j;}}
let di=0,pi=0,selected='land',view='home',tab='work',urls=[],assistantDraft=null;const dev=()=>data.developments[di],parcel=()=>dev().parcels[pi],job=()=>parcel().jobs[selected],prev=()=>parcel().jobs[TRADES[TRADES.findIndex(t=>t[0]===selected)-1]?.[0]],allowed=()=>!prev()||prev().state==='approved'||!!job().exception;
function save(){try{localStorage.setItem(KEY,JSON.stringify(data));return true;}catch(e){alert('Storage full. Export a backup and free space.');return false;}}
function log(j,text){j.history.push({date:new Date().toISOString(),text});}
function go(v){view=v;render();scrollTo(0,0);}function pickDev(i){di=i;pi=0;go('parcels');}function pickParcel(i){pi=i;go('jobs');}function pickJob(k){selected=k;tab='work';go('detail');}
function state(j){return j.state==='approved'?'✓ Approved':j.state==='review'?'Awaiting your approval':j.state==='working'?'In progress':j.state==='finishing'?'Final photos':allowed()?'Ready · Bidding open':'Work locked · Bidding open';}
function home(){let parcels=data.developments.reduce((n,d)=>n+d.parcels.length,0),reviews=0;for(const d of data.developments)for(const p of d.parcels)for(const [k] of TRADES)if(p.jobs[k].state==='review')reviews++;return '<section class="hero"><span class="eyebrow">YOUR AI LAND DEVELOPMENT DESK</span><h1>From raw land to<br><em>move-in ready.</em></h1><p>Plan parcels, prepare contractors, document work and coordinate manufactured-home placement.</p><button class="btn" onclick="go(\'assistant\')">✦ Ask A7 Superintendent</button><button class="btn alt" onclick="go(\'newdev\')">＋ New development</button></section><div class="stats"><div><strong>'+data.developments.length+'</strong><small>Developments</small></div><div><strong>'+parcels+'</strong><small>Parcels</small></div><div><strong>'+reviews+'</strong><small>Need approval</small></div></div><div class="sectionhead"><h2>Development filing cabinet</h2><span class="muted">Open a project →</span></div>'+data.developments.map((d,i)=>'<button class="project" onclick="pickDev('+i+')"><span class="project-icon">▧</span><span><b>'+esc(d.name)+'</b><small>'+d.parcels.length+' parcels · Manufactured-home development</small></span><span class="arrow">›</span></button>').join('')+'<div class="panel"><b>What can A7 help with?</b><p class="muted">Start a development checklist, find matching trade contacts, draft a scope or locate a parcel needing approval.</p><button class="btn alt" onclick="go(\'assistant\')">Open AI guide →</button></div>'; }
function newdev(){return '<h2>New development</h2><form class="panel" onsubmit="createDev(event)"><label>Name<input class="field" id="dn" required placeholder="Talco Development"></label><label>Number of parcels<input class="field" id="pn" type="number" min="1" max="100" value="2" required></label><button class="btn">Create development</button></form>';}
function createDev(e){e.preventDefault();let n=Number($('pn').value),name=$('dn').value.trim();if(!name||!Number.isInteger(n)||n<1||n>100)return alert('Enter 1–100 parcels.');data.developments.push(newDev(name,n));if(save())pickDev(data.developments.length-1);}
function parcels(){return '<button class="btn alt" onclick="go(\'home\')">← Developments</button><div class="sectionhead"><h2>'+esc(dev().name)+'</h2><button class="btn" onclick="addParcel()">＋ Parcel</button></div><div class="panel"><b>Development checklist</b><p class="muted">Verify survey and legal access; subdivision and permits; drainage and culvert requirements; utility availability; septic feasibility; manufactured-home placement and inspections. These are planning prompts, not verified approvals.</p><button class="btn alt" onclick="go(\'budget\')">View development budget →</button></div><div class="grid">'+dev().parcels.map((p,i)=>'<button class="tile" onclick="pickParcel('+i+')"><span class="tileicon">⌂</span><b>'+esc(p.name)+'</b><small>'+TRADES.filter(([k])=>p.jobs[k].state==='approved').length+' of '+TRADES.length+' jobs approved</small><span class="progress"><i style="width:'+(100*TRADES.filter(([k])=>p.jobs[k].state==='approved').length/TRADES.length)+'%"></i></span></button>').join('')+'</div>'; }
function addParcel(){let name=prompt('Parcel name','Parcel '+(dev().parcels.length+1));if(!name?.trim())return;dev().parcels.push(newParcel(name.trim()));if(save())render();}
function jobs(){return '<button class="btn alt" onclick="go(\'parcels\')">← Parcels</button><h2>'+esc(parcel().name)+'</h2><p class="muted">'+esc(dev().name)+' · Work follows your approved sequence. Planning, contractor calls and bids remain open on every job.</p><div class="panel"><b>Manufactured-home work plan</b><p class="muted">Check local requirements for utilities, foundation, transport, installation, inspections and occupancy before starting work.</p></div><div class="timeline">'+TRADES.map(([k,n],i)=>{let j=parcel().jobs[k],ready=i===0||parcel().jobs[TRADES[i-1][0]].state==='approved'||j.exception;return '<button class="step" onclick="pickJob(\''+k+'\')"><span class="stepnum '+(j.state==='approved'?'done':ready?'ready':'')+'">'+(j.state==='approved'?'✓':i+1)+'</span><span><b>'+esc(n)+'</b><small>'+esc(j.state==='approved'?'Approved':j.state!=='planning'?state(j):ready?'Ready · bids open':'Work locked · bids open')+'</small></span><span class="arrow">›</span></button>';}).join('')+'</div>'; }
function detail(){let j=job(),p=prev();return '<button class="btn alt" onclick="go(\'jobs\')">← Jobs</button><h2>'+esc(j.name)+'</h2><span class="pill '+(!allowed()?'warn':'')+'">'+esc(state(j))+'</span><p class="muted">'+esc(dev().name)+' · '+esc(parcel().name)+'</p><div class="tabs">'+[['work','Workflow'],['contacts','Contractors'],['bids','Bids'],['scope','Scope'],['history','History']].map(([k,n])=>'<button class="btn '+(tab===k?'':'alt')+'" onclick="tab=\''+k+'\';render()">'+n+'</button>').join('')+'</div>'+(tab==='work'?workflow(j,p):tab==='contacts'?contacts(j):tab==='bids'?bids(j):tab==='scope'?scope(j):'<div class="panel">'+(j.history.length?j.history.slice().reverse().map(h=>'<div class="line">'+esc(h.text)+'<small> · '+esc(new Date(h.date).toLocaleString())+'</small></div>').join(''):'No activity yet')+'</div>');}
function workflow(j,p){let out='<div class="panel"><h3>Construction sequence</h3><p class="muted">'+(p?'Previous job: '+esc(p.name)+' — '+esc(p.state):'First job in this parcel')+'</p>';
if(!allowed())out+='<p>Work is locked. Contractor calls, scopes and bids are still open.</p><label>Owner exception reason<textarea class="field" id="reason" placeholder="Why must this job start out of sequence?"></textarea></label><button class="btn alt" onclick="exception()">Approve sequence exception</button>';
out+='</div>';for(const [s,title] of [['before','1. Before work'],['middle','2. During work'],['after','3. After work']]){let open=(s==='before'&&j.state==='planning')||(s==='middle'&&j.state==='working')||(s==='after'&&j.state==='finishing');out+='<div class="panel"><div class="row"><b>'+title+'</b><span class="pill">'+j.photos[s].length+' / 3 minimum</span></div><p class="muted">'+(open?'Upload or take at least three photos.':'This stage is not open for uploads.')+'</p>'+(open?'<input class="field" type="file" accept="image/*" multiple onchange="upload(event,\''+s+'\')">':'')+'<div class="photos">'+j.photos[s].map(m=>'<div class="photo" id="ph-'+esc(m.id)+'"><div class="muted">Loading photo…</div><small>'+esc(m.name)+'</small>'+(open?'<button class="btn danger" onclick="removePhoto(\''+s+'\',\''+m.id+'\')">Remove</button>':'')+'</div>').join('')+'</div></div>';}
if(j.state==='planning')out+='<div class="panel"><button class="btn" '+(!allowed()||j.photos.before.length<3?'disabled':'')+' onclick="advance(\'working\')">Start work →</button><p class="muted">Requires three before photos and previous job approval, or a documented exception.</p></div>';
if(j.state==='working')out+='<div class="panel"><button class="btn" '+(j.photos.middle.length<3?'disabled':'')+' onclick="advance(\'finishing\')">Move to final photos →</button></div>';
if(j.state==='finishing')out+='<div class="panel"><button class="btn" '+(j.photos.after.length<3?'disabled':'')+' onclick="advance(\'review\')">Submit for owner review →</button></div>';
if(j.state==='review')out+='<div class="panel"><h3>Owner approval</h3><p>Review all nine photos and confirm this job is complete. Only your approval unlocks the next job.</p><button class="btn" onclick="approve()">I reviewed it · Approve completion</button><button class="btn alt" onclick="returnPhotos()">Return for more photos</button></div>';
if(j.state==='approved')out+='<div class="panel">✓ Approved '+esc(new Date(j.approvedAt).toLocaleString())+'. The next job is unlocked.</div>';
return out+'<p class="muted">Prototype: approval is not password-protected. Photos are stored in this browser, not in the cloud. Export backups regularly.</p>';}
function contacts(j){let matches=data.contacts.filter(c=>c.trades.includes(j.key));return '<div class="panel"><h3>'+esc(j.name)+' contractors</h3><p class="muted">Only contacts tagged for this trade appear. Calls and bids are allowed even while work is locked.</p>'+(matches.length?matches.map(c=>'<div class="line"><b>'+esc(c.name)+'</b><p class="muted">'+esc(c.notes||'')+'</p>'+(c.phone?'<a class="btn" style="display:inline-block;color:white;text-decoration:none" href="tel:'+encodeURIComponent(c.phone)+'">Call</a><a class="btn alt" style="display:inline-block;color:white;text-decoration:none" href="sms:'+encodeURIComponent(c.phone)+'">Text</a>':'')+(c.email?'<a class="btn alt" style="display:inline-block;color:white;text-decoration:none" href="mailto:'+encodeURIComponent(c.email)+'?subject='+encodeURIComponent('Bid request: '+dev().name+' / '+parcel().name+' / '+j.name)+'">Request bid</a>':'')+'</div>').join(''):'<p>No contractors tagged for this trade yet.</p>')+'<button class="btn" onclick="go(\'contactedit\')">+ Add contractor</button></div>';}
function bids(j){return '<div class="panel"><h3>Bid comparison</h3>'+j.bids.map(b=>'<div class="line"><b>'+esc(b.name)+' — '+money(b.amount)+'</b><p class="muted">'+esc(b.notes||'')+'</p></div>').join('')+'<form onsubmit="addBid(event)"><label>Contractor<select class="field" id="bidContact"><option value="">Enter name below</option>'+data.contacts.filter(c=>c.trades.includes(j.key)).map(c=>'<option value="'+esc(c.id)+'">'+esc(c.name)+'</option>').join('')+'</select></label><label>Name (if not in contacts)<input class="field" id="bidName"></label><label>Bid amount ($)<input class="field" id="bidAmount" type="number" min="0" step=".01" required></label><label>Bid notes<textarea class="field" id="bidNotes"></textarea></label><button class="btn">Save bid</button></form></div>';}
function addBid(e){e.preventDefault();let c=data.contacts.find(c=>c.id===$('bidContact').value),name=c?.name||$('bidName').value.trim(),amount=Number($('bidAmount').value);if(!name||!Number.isFinite(amount)||amount<0)return alert('Enter a contractor and valid amount.');job().bids.push({id:id(),name,amount,notes:$('bidNotes').value});log(job(),'Bid received from '+name);if(save())render();}
function scope(j){return '<div class="panel"><h3>Scope of work</h3><textarea class="field" id="scope" rows="8">'+esc(j.scope||'')+'</textarea><button class="btn" onclick="job().scope=$(\'scope\').value;log(job(),\'Scope updated\');if(save())render()">Save scope</button></div>';}
function people(){return '<h2>Shared contractor directory</h2><p class="muted">One contact can belong to multiple trades and appears in every development.</p><button class="btn" onclick="editContact(\'\')">+ Add contractor</button>'+data.contacts.map(c=>'<div class="panel"><b>'+esc(c.name)+'</b><p class="muted">'+esc(c.trades.map(k=>TRADES.find(t=>t[0]===k)?.[1]||k).join(' · '))+'</p><button class="btn alt" onclick="editContact(\''+c.id+'\')">Edit</button></div>').join('');}
let editing='';function editContact(k){editing=k;go('contactedit');}
function contactedit(){let c=data.contacts.find(c=>c.id===editing)||{name:'',phone:'',email:'',notes:'',trades:[]};return '<h2>Contractor</h2><form class="panel" onsubmit="saveContact(event)"><label>Name / company<input class="field" id="cn" value="'+esc(c.name)+'" required></label><label>Phone<input class="field" id="cp" type="tel" value="'+esc(c.phone)+'"></label><label>Email<input class="field" id="ce" type="email" value="'+esc(c.email)+'"></label><label>Trades (choose all that apply)</label><div class="chips">'+TRADES.map(([k,n])=>'<label><input type="checkbox" name="trade" value="'+k+'" '+(c.trades.includes(k)?'checked':'')+'> '+esc(n)+'</label>').join('')+'</div><label>Notes<textarea class="field" id="ct">'+esc(c.notes)+'</textarea></label><button class="btn">Save contractor</button></form>';}
function saveContact(e){e.preventDefault();let c=data.contacts.find(c=>c.id===editing),v={name:$('cn').value.trim(),phone:$('cp').value.trim(),email:$('ce').value.trim(),notes:$('ct').value,trades:[...document.querySelectorAll('input[name=trade]:checked')].map(x=>x.value)};if(!v.name)return;if(c)Object.assign(c,v);else data.contacts.push({id:id(),...v});if(save())go('people');}
function exception(){let reason=$('reason').value.trim();if(reason.length<10)return alert('Enter at least 10 characters explaining the exception.');if(!confirm('Approve starting this job before the previous job is complete?'))return;job().exception={reason,date:new Date().toISOString()};log(job(),'Owner approved out-of-order work: '+reason);if(save())render();}
function allNine(j){return ['before','middle','after'].every(s=>j.photos[s].length>=3);}
async function verify(j){for(const s of ['before','middle','after'])for(const m of j.photos[s])if(!(await getPhoto(m.id))?.blob)throw Error('A photo is missing from browser storage. Restore a backup.');}
async function advance(next){let j=job();if(next==='working'&&(j.state!=='planning'||!allowed()||j.photos.before.length<3))return;if(next==='finishing'&&(j.state!=='working'||j.photos.middle.length<3))return;if(next==='review'&&(j.state!=='finishing'||!allNine(j)))return;try{await verify(j);}catch(e){return alert(e.message);}j.state=next;log(j,'Moved to '+next);if(save())render();}
async function approve(){let j=job();if(j.state!=='review'||!allNine(j))return;try{await verify(j);}catch(e){return alert(e.message);}if(!confirm('I have reviewed the photos and approve this job as complete. Unlock the next job?'))return;j.state='approved';j.approvedAt=new Date().toISOString();log(j,'Owner approved completion');if(save())render();}
function returnPhotos(){if(job().state!=='review')return;job().state='finishing';log(job(),'Returned for additional photos');if(save())render();}
function db(){return new Promise((resolve,reject)=>{let r=indexedDB.open(DB,1);r.onupgradeneeded=()=>r.result.createObjectStore('photos',{keyPath:'id'});r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error);});}
async function putPhoto(x){let d=await db();try{await new Promise((ok,no)=>{let t=d.transaction('photos','readwrite');t.objectStore('photos').put(x);t.oncomplete=ok;t.onerror=()=>no(t.error);});}finally{d.close();}}
async function getPhoto(k){let d=await db();try{return await new Promise((ok,no)=>{let r=d.transaction('photos').objectStore('photos').get(k);r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error);});}finally{d.close();}}
async function delPhoto(k){let d=await db();try{await new Promise((ok,no)=>{let t=d.transaction('photos','readwrite');t.objectStore('photos').delete(k);t.oncomplete=ok;t.onerror=()=>no(t.error);});}finally{d.close();}}
async function upload(e,s){let j=job();if(!((s==='before'&&j.state==='planning')||(s==='middle'&&j.state==='working')||(s==='after'&&j.state==='finishing')))return;for(const file of e.target.files){if(!file.type.startsWith('image/')||file.size>15e6){alert('Use images smaller than 15 MB.');continue;}let m={id:id(),name:file.name,date:new Date().toISOString()};try{await putPhoto({id:m.id,blob:file});j.photos[s].push(m);if(!save()){j.photos[s].pop();await delPhoto(m.id);break;}}catch(err){alert('Photo storage failed: '+err.message);break;}}render();}
async function removePhoto(s,k){if(!confirm('Remove photo?'))return;let j=job(),a=j.photos[s],i=a.findIndex(x=>x.id===k);if(i<0)return;let [m]=a.splice(i,1);if(!save()){a.splice(i,0,m);return;}await delPhoto(k);render();}
async function showPhotos(){if(view!=='detail'||tab!=='work')return;for(const s of ['before','middle','after'])for(const m of job().photos[s]){let el=$('ph-'+m.id);if(!el)continue;try{let x=await getPhoto(m.id);if(!x?.blob){el.firstElementChild.textContent='Missing photo';continue;}let u=URL.createObjectURL(x.blob);urls.push(u);let img=document.createElement('img');img.src=u;img.alt=m.name;el.firstElementChild.replaceWith(img);}catch(e){el.firstElementChild.textContent='Photo unavailable';}}}
function settings(){return '<h2>Settings & backups</h2><div class="panel"><p class="muted">Photos stay in this browser. Clearing browser data or losing this phone can erase them. Export a full backup and store it safely. Approval is not protected by a login.</p><button class="btn" onclick="backup()">Export full backup with photos</button><label>Restore a V16 backup<input class="field" type="file" accept=".json,application/json" onchange="restore(event)"></label></div>';}
const toBase64=blob=>new Promise((ok,no)=>{let r=new FileReader();r.onload=()=>ok(r.result);r.onerror=()=>no(r.error);r.readAsDataURL(blob);});
async function backup(){try{let photos=[];for(const d of data.developments)for(const p of d.parcels)for(const [k] of TRADES)for(const s of ['before','middle','after'])for(const m of p.jobs[k].photos[s]){let x=await getPhoto(m.id);if(!x?.blob)throw Error('Missing photo '+m.name);photos.push({id:m.id,data:await toBase64(x.blob)});}let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({format:'A7-V16',data,photos})],{type:'application/json'}));a.download='A7-V16-full-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),60000);}catch(e){alert('Backup failed: '+e.message);}}
async function restore(e){let f=e.target.files[0];if(!f)return;try{let x=JSON.parse(await f.text());if(x.format!=='A7-V16'||!Array.isArray(x.data?.developments)||!Array.isArray(x.data?.contacts)||!Array.isArray(x.photos))throw Error('Invalid V16 backup');if(!confirm('Replace current V16 records with this backup?'))return;for(const p of x.photos){let r=await fetch(p.data),blob=await r.blob();await putPhoto({id:p.id,blob});}data=x.data;if(!save())return;di=0;pi=0;go('home');alert('Backup restored.');}catch(err){alert('Restore failed: '+err.message);}}

function budget(){let rows=[];for(const p of dev().parcels)for(const [k,n] of TRADES){let j=p.jobs[k];for(const b of j.bids)rows.push({parcel:p.name,trade:n,b});}let total=rows.reduce((n,x)=>n+Number(x.b.amount||0),0);return '<button class="btn alt" onclick="go(\'parcels\')">← Parcels</button><h2>Bid ledger</h2><p class="muted">All recorded bids for '+esc(dev().name)+'. Total below adds every bid, including competing quotes; it is not your committed project cost.</p><div class="panel"><h2>'+money(total)+'</h2><small>Sum of all entered bids · '+rows.length+' quotes</small></div>'+rows.map(x=>'<div class="project"><span><b>'+esc(x.parcel)+' · '+esc(x.trade)+'</b><small>'+esc(x.b.name)+'</small></span><strong>'+money(x.b.amount)+'</strong></div>').join('');}
function assistant(){return '<div class="eyebrow">✦ A7 SUPERINTENDENT · GUIDED MODE</div><h1>What are we working on?</h1><p class="muted">A7 can organize your existing records and prepare plans for your review. This version does not connect to a live AI model, web search, email sender or cloud account.</p><div class="chat"><div class="bubble">Tell me about a new land development, ask for a trade contact, or request a manufactured-home site checklist.</div><textarea class="field" id="ask" rows="3" placeholder="Example: I bought 20 acres and want 8 parcels"></textarea><button class="btn" onclick="askA7()">✦ Prepare my next step</button><div class="suggestions"><button onclick="example(\'Plan 8 parcels on 20 acres\')">Plan a development</button><button onclick="example(\'Show my septic contractors\')">Septic contacts</button><button onclick="example(\'Manufactured home site checklist\')">Home site checklist</button><button onclick="example(\'Which jobs need approval?\')">Approvals</button></div><div id="answer" aria-live="polite"></div></div>';}
function example(q){$('ask').value=q;askA7();}
function askA7(){let q=$('ask').value.trim(),a=$('answer');assistantDraft=null;if(!q)return;a.innerHTML='';let m=q.match(/(?:plan|divide|create|make).*?(\d+)\s*(?:parcels|lots)/i),ac=q.match(/(\d+(?:\.\d+)?)\s*acres?/i);if(m){let n=Number(m[1]);if(n<1||n>100){a.textContent='Choose between 1 and 100 parcels.';return;}assistantDraft={type:'development',n,acres:ac?.[1]||''};a.innerHTML='<div class="bubble"><b>Draft development plan</b><p>'+n+' proposed parcels'+(ac?' on '+esc(ac[1])+' acres':'')+'. Before drawing lots, confirm survey, legal access, local subdivision rules, utilities, drainage and septic feasibility. Parcel sizes and approvals are not determined by this tool.</p><label>Development name<input class="field" id="draftName" placeholder="New development"></label><button class="btn" onclick="applyDraft()">Review & create '+n+' parcel records</button></div>';return;}
let trade=TRADES.find(([k,n])=>q.toLowerCase().includes(n.toLowerCase())||q.toLowerCase().includes(k));if(trade&&/(contractor|contact|call|bid|who)/i.test(q)){let found=data.contacts.filter(c=>c.trades.includes(trade[0]));a.innerHTML='<div class="bubble"><b>'+esc(trade[1])+' contacts</b>'+(found.length?found.map(c=>'<p>'+esc(c.name)+(c.phone?' · <a href="tel:'+encodeURIComponent(c.phone)+'">Call</a>':'')+'</p>').join(''):'<p>No matching contacts saved yet.</p>')+'<button class="btn alt" onclick="go(\'people\')">Open contractor directory</button></div>';return;}
if(/approv|next job|ready/i.test(q)){let matches=[];data.developments.forEach((d,dx)=>d.parcels.forEach((p,px)=>TRADES.forEach(([k,n])=>{if(p.jobs[k].state==='review')matches.push({dx,px,k,n,p:p.name,d:d.name});})));a.innerHTML='<div class="bubble"><b>'+matches.length+' jobs awaiting approval</b>'+matches.map((x,i)=>'<p><button class="btn alt" onclick="di='+x.dx+';pi='+x.px+';pickJob(\''+x.k+'\')">'+esc(x.d)+' · '+esc(x.p)+' · '+esc(x.n)+'</button></p>').join('')+'</div>';return;}
if(/culvert|supplier|txdot|price/i.test(q)){a.innerHTML='<div class="bubble"><b>Culvert research checklist</b><p>Confirm the road authority, approved pipe material and diameter, driveway permit, drainage design, and delivery location before buying. A7 cannot verify live prices or TXDOT compliance offline.</p><a class="btn" target="_blank" rel="noopener noreferrer" href="https://www.google.com/search?q=culvert+suppliers+near+Mount+Pleasant+Texas">Search suppliers on the web ↗</a></div>';return;}
a.innerHTML='<div class="bubble"><b>Manufactured-home site checklist</b><p>1. Confirm survey, access and parcel approvals.<br>2. Verify zoning, home placement and permitting.<br>3. Confirm driveway and drainage requirements.<br>4. Obtain utility availability and septic design approvals.<br>5. Coordinate pad or foundation with the home manufacturer and installer.<br>6. Schedule transport, installation and required inspections.</p><p class="muted">Requirements vary by location and home. This is a planning checklist, not a permit determination.</p><button class="btn alt" onclick="go(\'home\')">Open development filing cabinet</button></div>';}
function applyDraft(){if(!assistantDraft||assistantDraft.type!=='development')return;let name=$('draftName').value.trim();if(!name)return alert('Enter a development name.');if(!confirm('Create '+assistantDraft.n+' planning parcels for '+name+'? No survey or permit approval is implied.'))return;data.developments.push(newDev(name,assistantDraft.n));if(save()){di=data.developments.length-1;pi=0;assistantDraft=null;go('parcels');}}

function render(){urls.forEach(u=>URL.revokeObjectURL(u));urls=[];if(di>=data.developments.length)di=0;if(pi>=dev().parcels.length)pi=0;const pages={home,newdev,parcels,jobs,detail,people,contactedit,settings,assistant,budget};$('app').innerHTML=(pages[view]||home)();showPhotos();}
save();render();
</script></body></html>
