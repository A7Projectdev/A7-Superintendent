<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>A7 Superintendent — V23</title>
<style>
:root{
 --navy:#17304d;--blue:#1768b5;--pale:#edf5ff;--bg:#f4f7fb;
 --line:#dce5ef;--muted:#68798b;--green:#18734b;--red:#b83e3e
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
 margin:0;background:var(--bg);color:#25364a;
 font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif
}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
button:disabled{opacity:.45;cursor:not-allowed}
header{
 position:sticky;top:0;z-index:10;background:#fff;
 border-bottom:1px solid var(--line);padding:15px 18px;
 display:flex;justify-content:space-between;align-items:center
}
.brand{font-weight:850;color:var(--navy);letter-spacing:-.4px}
.brand small{display:block;color:var(--blue);font-size:10px;letter-spacing:1.2px}
nav{
 display:flex;overflow:auto;gap:5px;background:#fff;padding:8px;
 border-bottom:1px solid var(--line);scrollbar-width:none
}
nav::-webkit-scrollbar{display:none}
nav button{
 border:0;background:transparent;color:var(--muted);padding:10px 12px;
 border-radius:8px;white-space:nowrap;font-weight:700;font-size:13px
}
nav button.active{background:var(--pale);color:var(--blue)}
main{max-width:1100px;margin:auto;padding:20px 14px 100px}
h1,h2,h3{color:var(--navy);letter-spacing:-.35px}
h1{font-size:24px;margin:0 0 5px}
h2{font-size:18px;margin:0 0 12px}
h3{font-size:15px;margin:0 0 9px}
p{margin:0 0 12px}
.sub,.help{color:var(--muted);font-size:13px}
.help{font-size:12px;margin-top:5px}
.head{
 display:flex;justify-content:space-between;align-items:flex-start;
 gap:12px;flex-wrap:wrap;margin-bottom:18px
}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.grid.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.card,.stat{
 background:#fff;border:1px solid var(--line);border-radius:12px;
 padding:17px;min-width:0;margin-bottom:13px
}
.stat .label{font-size:12px;font-weight:700;color:var(--muted)}
.stat .value{
 font-size:23px;font-weight:800;color:var(--navy);
 margin-top:6px;overflow-wrap:anywhere
}
.section{margin-top:22px}
.btn{
 display:inline-flex;align-items:center;justify-content:center;
 text-decoration:none;background:var(--blue);color:#fff;
 border:1px solid var(--blue);border-radius:8px;padding:10px 14px;
 min-height:41px;font-weight:750;font-size:13px
}
.btn.secondary{background:#fff;color:var(--blue);border-color:#c4d8ee}
.btn.danger{background:#fff;color:var(--red);border-color:#eac6c6}
.btn.call{background:var(--green);border-color:var(--green);color:#fff}
.btn.text{background:#fff;border-color:#a9c9eb;color:var(--blue)}
.btn.small{min-height:34px;padding:7px 10px;font-size:12px}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.item{border-top:1px solid var(--line);padding:14px 0}
.item:first-child{border-top:0;padding-top:0}
.item:last-child{padding-bottom:0}
.itemhead{
 display:flex;justify-content:space-between;align-items:flex-start;
 gap:12px;flex-wrap:wrap
}
.itemtitle{font-weight:800;color:var(--navy)}
.meta{font-size:12px;color:var(--muted);margin-top:4px}
.row{
 display:flex;justify-content:space-between;gap:12px;
 border-bottom:1px solid #edf1f6;padding:9px 0
}
.row:last-child{border-bottom:0}
.row>:last-child{text-align:right}
.money{font-weight:800;color:var(--navy);font-variant-numeric:tabular-nums}
label{
 display:block;color:var(--navy);font-size:12px;
 font-weight:800;margin:0 0 6px
}
.field{margin-bottom:14px;min-width:0}
input,select,textarea{
 width:100%;background:#fff;color:#25364a;
 border:1px solid #cbd7e5;border-radius:8px;
 padding:10px 11px;min-height:42px
}
textarea{min-height:100px;resize:vertical}
.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 13px}
.notice{
 background:var(--pale);border:1px solid #c8dcef;
 border-radius:9px;padding:12px 13px;font-size:13px;margin:12px 0
}
.warning{background:#fff8e9;border-color:#ead9ae}
.tabs{display:flex;gap:7px;overflow:auto;margin:16px 0;scrollbar-width:none}
.tabs button{
 background:#fff;border:1px solid var(--line);border-radius:8px;
 padding:9px 12px;white-space:nowrap;color:var(--muted);
 font-weight:700;font-size:12px
}
.tabs button.active{color:var(--blue);background:var(--pale);border-color:var(--blue)}
.badge{
 display:inline-block;border-radius:20px;background:#edf1f6;
 color:#50657d;padding:4px 9px;font-size:11px;font-weight:800
}
.badge.blue{background:var(--pale);color:var(--blue)}
.badge.green{background:#e7f5ed;color:var(--green)}
hr{border:0;border-top:1px solid var(--line);margin:20px 0}
.empty{text-align:center;color:var(--muted);padding:28px 10px}
.empty strong{display:block;color:var(--navy)}
.layout{
 background:#eaf3ff;border:1px solid #b7d3f1;border-radius:10px;
 padding:16px;text-align:center;color:#24517e
}
.layout-inner{
 background:#d2e7ff;border:2px solid var(--blue);
 border-radius:8px;padding:22px 8px;margin:15px auto;
 max-width:70%;color:var(--navy);font-weight:800
}
.file{
 border:1px solid var(--line);border-radius:8px;padding:10px;
 display:flex;justify-content:space-between;gap:10px;
 align-items:center;margin:7px 0;overflow-wrap:anywhere
}
.bubble{
 padding:12px;border-radius:9px;background:#f0f4f9;
 white-space:pre-wrap;margin:8px 0;font-size:13px
}
.bubble.me{background:var(--pale);margin-left:20px}

/* V23: compact measurement controls */
.measure-grid{
 display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px
}
.measure-field{min-width:0}
.measure-control{
 display:flex;align-items:center;gap:5px;
 border:1px solid #cbd7e5;border-radius:11px;
 background:#fff;padding:4px 5px 4px 10px;min-height:47px
}
.measure-control:focus-within{
 border-color:var(--blue);box-shadow:0 0 0 3px #1768b51a
}
.measure-control input{
 border:0;outline:0;box-shadow:none;min-height:35px;
 padding:4px 0;width:100%;min-width:0;
 font-size:18px;font-weight:750;color:var(--navy);
 font-variant-numeric:tabular-nums
}
.measure-control input:focus{outline:0}
.measure-unit{font-size:12px;color:var(--muted);font-weight:700}
.wheel-trigger{
 flex:0 0 36px;width:36px;height:36px;
 border:0;border-radius:8px;background:#eef4fb;
 color:var(--blue);font-size:18px;font-weight:700;
 display:grid;place-items:center
}
.wheel-trigger:active{background:#dcecff}
.measure-section{
 border:1px solid var(--line);border-radius:12px;
 padding:14px;margin:12px 0;background:#fff
}
.measure-section h3{margin-bottom:3px}
.measure-result{
 display:flex;justify-content:space-between;align-items:center;
 gap:10px;background:#f4f8fd;border-radius:9px;
 padding:11px 12px;margin-top:13px
}
.measure-result strong{
 color:var(--green);font-size:19px;
 font-variant-numeric:tabular-nums;white-space:nowrap
}
.measure-result small{display:block;color:var(--muted);font-size:11px}
.total-result{
 background:#edf7f1;border:1px solid #d1e9da;
 border-radius:10px;padding:13px;margin-top:12px
}
.total-result strong{font-size:21px;color:var(--green)}
/* Wheel opens as a small bottom sheet on iPhone. */
.wheel-backdrop{
 position:fixed;inset:0;background:#12263e70;z-index:50;
 display:flex;align-items:flex-end;justify-content:center
}
.wheel-sheet{
 background:#fff;width:100%;max-width:430px;
 border-radius:18px 18px 0 0;
 padding:12px 16px calc(16px + env(safe-area-inset-bottom));
 box-shadow:0 -12px 40px #12263e22
}
.wheel-top{
 display:flex;justify-content:space-between;align-items:center;
 gap:10px;padding-bottom:12px
}
.wheel-top strong{color:var(--navy)}
.wheel-done{
 border:0;background:transparent;color:var(--blue);
 font-size:15px;font-weight:800;padding:8px
}
.wheel-window{
 height:220px;overflow-y:auto;overscroll-behavior:contain;
 scroll-snap-type:y mandatory;scrollbar-width:none;
 -webkit-overflow-scrolling:touch;position:relative;
 border-radius:12px;background:#f7f9fc
}
.wheel-window::-webkit-scrollbar{display:none}
.wheel-window::before{
 content:"";position:sticky;display:block;top:88px;height:44px;
 margin-bottom:-44px;border-top:1px solid #c9d9ea;
 border-bottom:1px solid #c9d9ea;background:#e7f1fd88;
 pointer-events:none;z-index:1
}
.wheel-option{
 height:44px;display:flex;align-items:center;justify-content:center;
 scroll-snap-align:center;font-size:20px;color:#78899b;
 font-variant-numeric:tabular-nums;user-select:none;
 -webkit-user-select:none
}
.wheel-option.selected{
 color:var(--navy);font-size:23px;font-weight:800
}
.wheel-spacer{height:88px}
.wheel-hint{text-align:center;color:var(--muted);font-size:12px;margin-top:10px}
@media(max-width:700px){
 .grid{grid-template-columns:repeat(2,minmax(0,1fr))}
 .grid.two,.fields{grid-template-columns:1fr}
 .stat .value{font-size:19px}
 .card,.stat{padding:14px}
 h1{font-size:22px}
}
@media(min-width:600px){
 .wheel-backdrop{align-items:center;padding:20px}
 .wheel-sheet{border-radius:18px;padding-bottom:16px}
}
</style>
</head>
<body>

<header>
 <div class="brand">A7 SUPERINTENDENT<small>DEVELOPMENT MANAGEMENT</small></div>
 <span class="sub">V23</span>
</header>

<nav id="nav"></nav>
<main id="app"></main>
<div id="wheelRoot"></div>

<script>
"use strict";

/*
 V23 retains the V21/V22 storage names to access existing browser data.
 Export a full backup from V22 before installing this file.
*/
const KEY="a7-superintendent-v21";
const DB="a7-superintendent-v21-files";

const TRADES=[
 "Land Clearing","Entrance & Culvert","Driveway","Home Pad","Water",
 "Electrical","Manufactured Home","Home Transport","Home Setup",
 "Septic","Skirting","Decks & Steps","HVAC","Other"
];

const EMPTY={
 developments:[],contractors:[],bids:[],messages:[],
 activeDevelopment:null,activeParcel:null,activeJob:null
};

const WHEEL_MAX=2500;
const SQFT_PER_ACRE=43560;

let state=load();
let page="dashboard";
let tab="overview";
let jobTab="details";
let editingContractor=null;
let db=null;
let activeWheel=null;
let wheelScrollTimer=null;

/* GENERAL HELPERS */

function clone(x){
 return JSON.parse(JSON.stringify(x));
}

function load(){
 try{
  const x=JSON.parse(localStorage.getItem(KEY));
  return x&&typeof x==="object"
   ?{...clone(EMPTY),...x}
   :clone(EMPTY);
 }catch{
  return clone(EMPTY);
 }
}

function save(){
 try{
  localStorage.setItem(KEY,JSON.stringify(state));
 }catch(err){
  alert("Unable to save browser data. Export a backup and check available storage.");
 }
}

function id(){
 return typeof crypto!=="undefined"&&crypto.randomUUID
  ?crypto.randomUUID()
  :Date.now().toString(36)+Math.random().toString(36).slice(2);
}

function e(x){
 return String(x??"").replace(/[&<>"']/g,c=>({
  "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
 })[c]);
}

function n(x){
 const v=Number(x);
 return Number.isFinite(v)?v:0;
}

function usd(x){
 return new Intl.NumberFormat("en-US",{
  style:"currency",currency:"USD"
 }).format(n(x));
}

function fmt(x){
 return n(x).toLocaleString("en-US",{maximumFractionDigits:2});
}

function acres(sf){
 return (sf/SQFT_PER_ACRE).toFixed(4);
}

function date(){
 return new Date().toISOString().slice(0,10);
}

function dev(){
 return state.developments.find(x=>x.id===state.activeDevelopment);
}

function parcel(){
 return dev()?.parcels.find(x=>x.id===state.activeParcel);
}

function job(){
 return parcel()?.jobs.find(x=>x.id===state.activeJob);
}

function contractor(cid){
 return state.contractors.find(x=>x.id===cid);
}

function jobs(d){
 return d.parcels.flatMap(p=>p.jobs);
}

function land(d){
 return d.parcels.length?n(d.purchasePrice)/d.parcels.length:0;
}

function bidsFor(j){
 return state.bids.filter(b=>b.jobId===j.id);
}

function allFiles(){
 return state.developments.flatMap(d=>[
  ...(d.files||[]),
  ...d.parcels.flatMap(p=>p.jobs.flatMap(j=>j.files||[]))
 ]);
}

function go(p){
 closeWheel();
 page=p;
 scrollTo(0,0);
 render();
}

function openDev(x){
 state.activeDevelopment=x;
 state.activeParcel=null;
 state.activeJob=null;
 tab="overview";
 save();
 go("development");
}

function openParcel(x){
 state.activeParcel=x;
 state.activeJob=null;
 tab="overview";
 save();
 go("parcel");
}

function openJob(x){
 state.activeJob=x;
 jobTab="details";
 save();
 go("job");
}

function head(title,sub="",action=""){
 return `<div class="head"><div><h1>${e(title)}</h1>
 <div class="sub">${e(sub)}</div></div>${action}</div>`;
}

function btn(label,action,kind=""){
 return `<button type="button" class="btn ${kind}"
 onclick="${action}">${e(label)}</button>`;
}

function stat(label,value,note=""){
 return `<div class="stat"><div class="label">${e(label)}</div>
 <div class="value">${e(value)}</div><div class="meta">${e(note)}</div></div>`;
}

function row(label,value){
 return `<div class="row"><span class="sub">${e(label)}</span>
 <strong>${e(value)}</strong></div>`;
}

function inp(name,label,type="text",value="",extra=""){
 return `<div class="field"><label for="${name}">${e(label)}</label>
 <input id="${name}" name="${name}" type="${type}"
 value="${e(value)}" ${extra}></div>`;
}

function area(name,label,value=""){
 return `<div class="field"><label for="${name}">${e(label)}</label>
 <textarea id="${name}" name="${name}">${e(value)}</textarea></div>`;
}

function sel(name,label,options,value="",extra=""){
 return `<div class="field"><label for="${name}">${e(label)}</label>
 <select id="${name}" name="${name}" ${extra}>${
  options.map(o=>{
   let v=Array.isArray(o)?o[0]:o;
   let t=Array.isArray(o)?o[1]:o;
   return `<option value="${e(v)}"
   ${String(v)===String(value)?"selected":""}>${e(t)}</option>`;
  }).join("")
 }</select></div>`;
}

function val(f,k){
 return f.elements.namedItem(k)?.value?.trim()||"";
}

function empty(title,description){
 return `<div class="empty"><strong>${e(title)}</strong>
 ${e(description)}</div>`;
}

function badge(j){
 const t={
  approved:["Approved","green"],
  submitted:["Awaiting approval","blue"],
  in_progress:["In progress","blue"],
  ready:["Ready","blue"],
  locked:["Locked",""]
 }[j.status]||["Ready","blue"];

 return `<span class="badge ${t[1]}">${t[0]}</span>`;
}

/* CALL AND TEXT */

function phoneLinkNumber(phone){
 const raw=String(phone||"").trim();
 const digits=raw.replace(/\D/g,"");
 if(digits.length<7||digits.length>15)return "";
 return (raw.startsWith("+")?"+":"")+digits;
}

function contactButtons(c){
 if(!c)return "";
 const number=phoneLinkNumber(c.phone);
 if(!number)return "";

 return `<div class="actions">
  <a class="btn call small" href="tel:${e(number)}">☎ Call</a>
  <a class="btn text small" href="sms:${e(number)}">✉ Text</a>
 </div>`;
}

function assignedContractorCard(j){
 const c=contractor(j.contractorId);

 if(!c){
  return `<div class="notice">No contractor assigned yet.</div>`;
 }

 return `<div class="notice">
  <strong>Assigned Contractor: ${e(c.name)}</strong>
  ${c.company?`<div class="meta">${e(c.company)}</div>`:""}
  ${c.phone?`<div class="meta">Phone: ${e(c.phone)}</div>`:""}
  ${c.email?`<div class="meta">Email: ${e(c.email)}</div>`:""}
  ${contactButtons(c)}
 </div>`;
}

/* PROJECT STRUCTURE */

function makeJobs(){
 return TRADES.map((trade,i)=>({
  id:id(),trade,status:i?"locked":"ready",
  contractorId:"",contractorName:"",
  scope:"",notes:"",clearingAreas:[],files:[],approvedAt:""
 }));
}

function makeParcel(i){
 return {
  id:id(),name:`Parcel ${i+1}`,acreage:"",
  notes:"",jobs:makeJobs()
 };
}

/* NAVIGATION */

function render(){
 const navs=[
  ["dashboard","Dashboard"],
  ["developments","Developments"],
  ["contractors","Contractors"],
  ["bids","Bids Received"],
  ["assistant","AI Superintendent"],
  ["settings","Settings"]
 ];

 document.getElementById("nav").innerHTML=navs.map(([k,t])=>
  `<button class="${page===k?"active":""}"
   onclick="go('${k}')">${t}</button>`
 ).join("");

 const views={
  dashboard,developments,newDevelopment,development,
  parcel:parcelPage,job:jobPage,contractors,contractorForm,
  bids:bidsPage,assistant,settings
 };

 document.getElementById("app").innerHTML=(views[page]||dashboard)();
}

/* DASHBOARD */

function dashboard(){
 const total=state.developments.reduce((s,d)=>s+n(d.purchasePrice),0);
 const count=state.developments.reduce((s,d)=>s+d.parcels.length,0);

 return `${head(
  "Dashboard","Development portfolio and project activity",
  btn("+ New Development","go('newDevelopment')")
 )}
 <div class="grid">
  ${stat("Developments",state.developments.length)}
  ${stat("Planned Parcels",count)}
  ${stat("Property Purchase Cost",usd(total))}
  ${stat("Bids Received",state.bids.length)}
 </div>

 <div class="section card"><h2>Developments</h2>
 ${state.developments.length?state.developments.map(d=>`
  <div class="item">
   <div class="itemhead"><div>
    <div class="itemtitle">${e(d.name)}</div>
    <div class="meta">${e(d.location||"Location not entered")}
     · ${d.parcels.length} parcels</div>
   </div>${btn("Open",`openDev('${d.id}')`,"secondary small")}</div>
   ${row("Full property purchase price",usd(d.purchasePrice))}
   ${row("Allocated land cost per parcel",usd(land(d)))}
   <div class="meta">
    ${jobs(d).filter(j=>j.status==="approved").length}
    of ${jobs(d).length} stages approved
   </div>
  </div>
 `).join(""):empty("No developments yet","Create a development to get started.")}
 </div>

 <div class="grid two">
  <div class="card"><h2>Contractor Directory</h2>
   <p class="sub">${state.contractors.length} saved contacts</p>
   ${btn("Open Contractors","go('contractors')","secondary")}
  </div>
  <div class="card"><h2>AI Superintendent</h2>
   <p class="sub">Guidance using your saved project records</p>
   ${btn("Open Assistant","go('assistant')","secondary")}
  </div>
 </div>`;
}

/* DEVELOPMENTS */

function developments(){
 return `${head(
  "Developments","Property and parcel records",
  btn("+ New Development","go('newDevelopment')")
 )}
 <div class="card">
 ${state.developments.length?state.developments.map(d=>`
  <div class="item">
   <div class="itemhead"><div>
    <div class="itemtitle">${e(d.name)}</div>
    <div class="meta">${e(d.location)} · ${d.parcels.length} parcels</div>
   </div>${btn("Open",`openDev('${d.id}')`,"secondary small")}</div>
   ${row("Full property purchase price",usd(d.purchasePrice))}
   ${row("Land cost per parcel",usd(land(d)))}
  </div>
 `).join(""):empty("No developments","Enter your first property's details.")}
 </div>`;
}

function newDevelopment(){
 return `${head("Start a Development","Enter the full property purchase price once.")}
 <div class="card"><form onsubmit="createDevelopment(event)">
  <div class="fields">
   ${inp("name","Development Name","text","","required")}
   ${inp("location","Property Location")}
   ${inp("purchasePrice","Full Property Purchase Price ($)","number","",
    "required min='0' step='0.01' oninput='previewLand()'")}
   ${inp("acres","Total Property Acreage","number","",
    "required min='0.01' step='any'")}
   ${inp("parcelCount","Number of Planned Parcels","number","",
    "required min='1' max='100' step='1' oninput='previewLand()'")}
   ${sel("easements","Easements",["No","Yes","Unknown"])}
   ${sel("permits","Permits Needed",["No","Yes","Unknown"])}
  </div>

  <div class="notice">
   Allocated land cost per parcel:
   <strong id="landPreview">$0.00</strong><br>
   <span class="sub">The purchase price is counted once.</span>
  </div>

  ${area("notes","Development Notes (Optional)")}
  <button class="btn">Create Development & Parcels</button>
 </form></div>`;
}

function previewLand(){
 const a=n(document.getElementById("purchasePrice")?.value);
 const b=n(document.getElementById("parcelCount")?.value);
 document.getElementById("landPreview").textContent=b?usd(a/b):"$0.00";
}

function createDevelopment(ev){
 ev.preventDefault();

 const f=ev.target;
 const c=n(val(f,"parcelCount"));
 const price=n(val(f,"purchasePrice"));

 if(!val(f,"name")||!Number.isInteger(c)||c<1||c>100||
    n(val(f,"acres"))<=0||price<0){
  return alert("Enter valid property details and 1–100 parcels.");
 }

 const d={
  id:id(),name:val(f,"name"),location:val(f,"location"),
  purchasePrice:price,acres:n(val(f,"acres")),
  easements:val(f,"easements"),permits:val(f,"permits"),
  notes:val(f,"notes"),files:[],
  parcels:Array.from({length:c},(_,i)=>makeParcel(i)),
  createdAt:date()
 };

 state.developments.push(d);
 save();
 openDev(d.id);
}

function parcelRows(d){
 return d.parcels.map(p=>`
  <div class="item">
   <div class="itemhead"><div>

/* V23 LAND CLEARING CALCULATIONS */

function getLayout(j){
 return j.clearingLayout||null;
}

function layoutValid(x){
 return !!(
  x&&
  x.innerLength>0&&x.innerWidth>0&&
  x.outerLength>0&&x.outerWidth>0&&
  x.innerLength<=WHEEL_MAX&&x.innerWidth<=WHEEL_MAX&&
  x.outerLength<=WHEEL_MAX&&x.outerWidth<=WHEEL_MAX&&
  x.outerLength>=x.innerLength&&
  x.outerWidth>=x.innerWidth&&
  x.outerLength*x.outerWidth>x.innerLength*x.innerWidth
 );
}

function clearingNumbers(x){
 const il=n(x?.innerLength);
 const iw=n(x?.innerWidth);
 const ol=n(x?.outerLength);
 const ow=n(x?.outerWidth);

 const inner=il*iw;
 const outer=ol*ow;

 return {
  il,iw,ol,ow,
  inner,
  outer,
  brush:Math.max(0,outer-inner)
 };
}

function clearingScope(j){
 const x=getLayout(j);
 if(!layoutValid(x))return "";

 const z=clearingNumbers(x);

 const lines=[
  "LAND CLEARING — CONTRACTOR SCOPE OF WORK",
  `Development: ${dev()?.name||""}`,
  `Parcel: ${parcel()?.name||""}`,
  "",
  "1. COMPLETE CLEARING — INNER AREA",
  `Depth: ${fmt(z.il)} feet.`,
  `Width: ${fmt(z.iw)} feet.`,
  `Complete-clearing area: ${fmt(z.inner)} square feet (${acres(z.inner)} acres).`,
  "Remove designated trees and underbrush within this inner boundary.",
  "",
  "2. UNDERBRUSH ONLY — SURROUNDING AREA",
  `Overall depth: ${fmt(z.ol)} feet.`,
  `Overall width: ${fmt(z.ow)} feet.`,
  `Overall footprint: ${fmt(z.outer)} square feet (${acres(z.outer)} acres).`,
  `Less complete-clearing area: ${fmt(z.inner)} square feet.`,
  `Underbrush-only area: ${fmt(z.brush)} square feet (${acres(z.brush)} acres).`,
  "Remove underbrush outside the complete-clearing boundary but inside the overall boundary.",
  "Retain trees in the surrounding area unless separately marked for removal.",
  "",
  "3. TOTAL UNIQUE CLEARING FOOTPRINT",
  `${fmt(z.outer)} square feet (${acres(z.outer)} acres).`,
  "The inner area is already included in the overall footprint. Do not count it twice."
 ];

 if(x.centered){
  lines.push(
   "",
   "4. APPROXIMATE CENTERED OFFSETS",
   `Each end: ${fmt((z.ol-z.il)/2)} feet.`,
   `Each side: ${fmt((z.ow-z.iw)/2)} feet.`
  );
 }else{
  lines.push(
   "",
   "4. INNER AREA POSITION",
   "Position the inner area as marked on site. Equal offsets are not assumed."
  );
 }

 if(x.notes){
  lines.push("","SITE NOTES: "+x.notes);
 }

 lines.push(
  "",
  "Verify boundaries, utilities, access, measurements, debris disposal,",
  "and applicable permits on site before pricing or starting work."
 );

 return lines.join("\n");
}

function clearingPreviewHTML(x){
 const z=clearingNumbers(x);

 if(
  !Number.isInteger(z.il)||!Number.isInteger(z.iw)||
  !Number.isInteger(z.ol)||!Number.isInteger(z.ow)||
  [z.il,z.iw,z.ol,z.ow].some(v=>v<0||v>WHEEL_MAX)
 ){
  return `<div class="notice warning">
   Enter whole-foot measurements from 0 to ${fmt(WHEEL_MAX)}.
  </div>`;
 }

 const hasInner=z.il>0&&z.iw>0;
 const hasOuter=z.ol>0&&z.ow>0;
 const contained=z.ol>=z.il&&z.ow>=z.iw;

 let warning="";

 if(!contained){
  warning=`<div class="notice warning">
   The overall depth and width must each be at least as large
   as the complete-clearing measurements.
  </div>`;
 }else if(hasInner&&hasOuter&&z.outer<=z.inner){
  warning=`<div class="notice warning">
   Make the overall footprint larger than the completely cleared area.
  </div>`;
 }

 return `
  <div class="measure-result">
   <div>
    <strong style="font-size:13px;color:var(--navy)">Complete clearing</strong>
    <small>${fmt(z.inner)} square feet</small>
   </div>
   <strong>${acres(z.inner)} ac</strong>
  </div>

  <div class="measure-result">
   <div>
    <strong style="font-size:13px;color:var(--navy)">Underbrush only</strong>
    <small>${contained?fmt(z.brush):"—"} square feet</small>
   </div>
   <strong>${contained?acres(z.brush):"—"} ac</strong>
  </div>

  <div class="total-result">
   <div class="sub">Total unique clearing footprint</div>
   <strong>${hasOuter?acres(z.outer):"0.0000"} acres</strong>
   <div class="help">${fmt(z.outer)} square feet</div>
  </div>

  ${warning}
 `;
}

/* V23 VERTICAL SCROLL WHEEL */

function openWheel(fieldId,label){
 const input=document.getElementById(fieldId);
 if(!input)return;

 closeWheel();

 activeWheel={
  fieldId,
  label,
  selected:Math.max(0,Math.min(WHEEL_MAX,Math.round(n(input.value))))
 };

 const root=document.getElementById("wheelRoot");

 root.innerHTML=`
  <div class="wheel-backdrop" id="wheelBackdrop">
   <div class="wheel-sheet"
    role="dialog" aria-modal="true"
    aria-label="${e(label)} number picker">

    <div class="wheel-top">
     <strong>${e(label)} · Feet</strong>
     <button type="button" class="wheel-done"
      onclick="closeWheel()">Done</button>
    </div>

    <div class="wheel-window" id="wheelWindow"
     aria-label="Scroll vertically to select feet">

     <div class="wheel-spacer"></div>

     ${Array.from({length:WHEEL_MAX+1},(_,i)=>`
      <div class="wheel-option ${i===activeWheel.selected?"selected":""}"
       data-feet="${i}"
       onclick="chooseWheelNumber(${i})">${i} ft</div>
     `).join("")}

     <div class="wheel-spacer"></div>
    </div>

    <div class="wheel-hint">
     Swipe up or down · 0–2,500 feet
    </div>
   </div>
  </div>
 `;

 const backdrop=document.getElementById("wheelBackdrop");

 backdrop.addEventListener("click",ev=>{
  if(ev.target===backdrop)closeWheel();
 });

 const wheel=document.getElementById("wheelWindow");

 wheel.addEventListener("scroll",()=>{
  if(!activeWheel)return;

  const selected=Math.max(
   0,
   Math.min(WHEEL_MAX,Math.round(wheel.scrollTop/44))
  );

  setWheelSelection(selected);

  clearTimeout(wheelScrollTimer);

  wheelScrollTimer=setTimeout(()=>{
   if(activeWheel){
    wheel.scrollTo({
     top:activeWheel.selected*44,
     behavior:"smooth"
    });
   }
  },130);
 },{passive:true});

 requestAnimationFrame(()=>{
  wheel.scrollTop=activeWheel.selected*44;
 });
}

function setWheelSelection(number){
 if(!activeWheel)return;

 const selected=Math.max(0,Math.min(WHEEL_MAX,Math.round(number)));
 const previous=activeWheel.selected;

 activeWheel.selected=selected;

 const input=document.getElementById(activeWheel.fieldId);

 if(input){
  input.value=String(selected);
  previewClearing();
 }

 const wheel=document.getElementById("wheelWindow");

 if(wheel&&previous!==selected){
  wheel.querySelector(`[data-feet="${previous}"]`)
   ?.classList.remove("selected");

  wheel.querySelector(`[data-feet="${selected}"]`)
   ?.classList.add("selected");
 }
}

function chooseWheelNumber(number){
 if(!activeWheel)return;

 setWheelSelection(number);

 document.getElementById("wheelWindow")?.scrollTo({
  top:activeWheel.selected*44,
  behavior:"smooth"
 });
}

function closeWheel(){
 clearTimeout(wheelScrollTimer);
 activeWheel=null;

 const root=document.getElementById("wheelRoot");
 if(root)root.innerHTML="";
}

/* APPROVAL */

function approval(j,p,i){
 const counts=["before","during","after"].map(
  k=>(j.files||[]).filter(f=>f.category===k).length
 );

 const ready=counts.every(x=>x>=3);

 return `<div class="card"><h2>Owner Approval</h2>
  ${row("Before photos",`${counts[0]} / 3`)}
  ${row("During photos",`${counts[1]} / 3`)}
  ${row("After photos",`${counts[2]} / 3`)}

  ${j.status==="approved"?`
   <div class="notice">
    Approved on ${e(j.approvedAt||"a previous date")}.
   </div>
  `:`
   <div class="notice ${ready?"":"warning"}">
    ${ready?"Photo requirements met.":
     "Upload at least three before, three during, and three after photos before approval."}
   </div>

   <div class="actions">
    <button class="btn secondary"
     ${j.status==="locked"?"disabled":""}
     onclick="changeStatus('in_progress')">Mark In Progress</button>

    <button class="btn secondary"
     ${j.status==="locked"?"disabled":""}
     onclick="changeStatus('submitted')">Submit for Approval</button>

    <button class="btn"
     ${j.status==="locked"||!ready?"disabled":""}
     onclick="approve()">Approve & Unlock Next Stage</button>
   </div>
  `}

  <p class="help">
   This is a local owner approval record,
   not a verified electronic signature.
  </p>
 </div>`;
}

function changeStatus(s){
 const j=job();

 if(j.status==="locked"||j.status==="approved")return;

 j.status=s;
 save();
 render();
}

function approve(){
 const j=job(),p=parcel();

 if(j.status==="locked"||j.status==="approved")return;

 if(["before","during","after"].some(
  k=>(j.files||[]).filter(f=>f.category===k).length<3
 )){
  return alert("Upload all required photos first.");
 }

 if(!confirm(`Approve ${j.trade} and unlock the next stage?`))return;

 j.status="approved";
 j.approvedAt=date();

 const next=p.jobs[p.jobs.findIndex(x=>x.id===j.id)+1];

 if(next&&next.status==="locked"){
  next.status="ready";
 }

 save();
 render();
}

function saveContractor(ev){

 const f=ev.target;
 const c=contractor(editingContractor);
 const name=val(f,"name");

 const x={
  id:c?.id||id(),
  name,
  company:val(f,"company"),
  phone:val(f,"phone"),
  email:val(f,"email"),
  trades:[...f.querySelectorAll('input[name="trade"]:checked')]
   .map(el=>el.value),
  notes:val(f,"notes")
 };

 if(c){

  state.developments.forEach(d=>
   d.parcels.forEach(p=>
    p.jobs.forEach(j=>{
     if(j.contractorId===c.id)j.contractorName=name;
    })
   )
  );
 }else{
  state.contractors.push(x);

function deleteContractor(cid){
 const c=contractor(cid);
 if(!c)return;

 const assigned=state.developments.flatMap(d=>
  d.parcels.flatMap(p=>
   p.jobs.filter(j=>j.contractorId===cid)
  )
 ).length;

 const bc=state.bids.filter(b=>b.contractorId===cid).length;

 if(!confirm(
  `Delete "${c.name}"?\n\n`+
  `${assigned} stage assignment(s) will be cleared.\n`+
  `${bc} recorded bid(s) will remain under this contractor's name.\n\n`+
  "This cannot be undone."
 ))return;

 state.developments.forEach(d=>
  d.parcels.forEach(p=>
   p.jobs.forEach(j=>{
    if(j.contractorId===cid){
     j.contractorId="";
     j.contractorName="";
    }
   })
  )
 );

 state.contractors=state.contractors.filter(x=>x.id!==cid);

 save();
 render();
}

function ask(ev){

 const q=val(ev.target,"question");

 if(s.includes("clear")||s.includes("scope")||s.includes("feet")){
  answer=
   "In V23 Land Clearing, type measurements or tap the small " +
   "wheel button beside each field. Swipe vertically through " +
   "0–2,500 feet. A7 automatically calculates complete-clearing " +
   "acreage and subtracts that area from the overall footprint " +
   "to calculate underbrush-only acreage. Save the measurements " +
   "to generate a contractor scope.";
 }else if(s.includes("call")||s.includes("text")||s.includes("phone")){
  answer=
   "Open Contractors and save a phone number. Call and Text " +
   "buttons will appear in the directory and assigned trade " +
   "stages. You choose whether to place the call or send the message.";
 }else if(s.includes("contractor")){
  answer=state.contractors.length
   ?state.contractors.map(c=>
    `${c.name}: ${(c.trades||[]).join(", ")}`
   ).join("\n")

 }else if(s.includes("bid")){
  answer=
   `You have ${state.bids.length} bids received. Their submitted `+
   `amounts total ${usd(state.bids.reduce((a,b)=>a+n(b.amount),0))}. `+
   "Competing proposals are not committed costs.";
 }else if(s.includes("land")||s.includes("parcel")||
          s.includes("property")){
  answer=state.developments.length
   ?state.developments.map(d=>
    `${d.name}: ${d.parcels.length} parcels, `+
    `${usd(d.purchasePrice)} full purchase price, `+
    `${usd(land(d))} allocated per parcel.`
   ).join("\n")
   :"Create a development to begin.";
 }else{
  answer=
   "I can summarize your developments, contractors, bids received, " +
   "and measured land clearing scopes. Live AI and supplier searches " +
   "require a connected service.";
 }

 state.messages.push(
  {role:"user",text:q},
  {role:"assistant",text:answer}
 );

 save();
 render();
}

/* INDEXEDDB FILE STORAGE */

function openDB(){
 return new Promise((resolve,reject)=>{
  const r=indexedDB.open(DB,1);

  r.onupgradeneeded=()=>{
   if(!r.result.objectStoreNames.contains("files")){
    r.result.createObjectStore("files");
   }
  };

  r.onsuccess=()=>{
   db=r.result;
   resolve(db);
  };

  r.onerror=()=>reject(r.error);
 });
}

async function filePut(k,v){
 const d=db||await openDB();

 return new Promise((ok,no)=>{
  const t=d.transaction("files","readwrite");
  t.objectStore("files").put(v,k);
  t.oncomplete=ok;
  t.onerror=()=>no(t.error);
 });
}

async function fileGet(k){
 const d=db||await openDB();

 return new Promise((ok,no)=>{
  const r=d.transaction("files","readonly")
   .objectStore("files").get(k);

  r.onsuccess=()=>ok(r.result);
  r.onerror=()=>no(r.error);
 });
}

async function fileDelete(k){
 const d=db||await openDB();

 return new Promise((ok,no)=>{
  const t=d.transaction("files","readwrite");
  t.objectStore("files").delete(k);
  t.oncomplete=ok;
  t.onerror=()=>no(t.error);
 });
}

function uploader(type,owner,category){
 return `<div class="field">
  <label>${category==="document"?"Document / PDF":
   category[0].toUpperCase()+category.slice(1)+" Photos"}</label>

   ${category==="document"?"":"multiple"}

}

async function upload(ev,type,ownerId,category){
 const owner=type==="development"
  ?state.developments.find(d=>d.id===ownerId)
  :state.developments.flatMap(d=>
   d.parcels.flatMap(p=>p.jobs)
  ).find(j=>j.id===ownerId);

 if(!owner)return;

 owner.files||=[];

 try{
  for(const f of [...ev.target.files]){
   const k=id();

   await filePut(k,f);

   owner.files.push({
    id:k,
    name:f.name,
    type:f.type,
    size:f.size,
    category,
    date:date()
   });
  }

  save();
  render();
 }catch(err){
  alert("Upload failed: "+err.message);
 }
}

async function viewFile(k){
 try{
  const blob=await fileGet(k);

  if(!blob){
   return alert("File not found in this browser.");
  }

  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");

  a.href=url;
  a.target="_blank";
  a.rel="noopener";

  document.body.appendChild(a);
  a.click();
  a.remove();

  setTimeout(()=>URL.revokeObjectURL(url),60000);
 }catch(err){
  alert("Unable to open file: "+err.message);
 }
}

async function removeFile(k){
 if(!confirm("Delete this uploaded file?"))return;

 try{
  await fileDelete(k);

  state.developments.forEach(d=>{
   d.files=(d.files||[]).filter(f=>f.id!==k);

   d.parcels.forEach(p=>
    p.jobs.forEach(j=>
     j.files=(j.files||[]).filter(f=>f.id!==k)
    )
   );
  });

  save();
  render();
 }catch(err){
  alert("Delete failed: "+err.message);
 }
}

/* FULL JSON BACKUP */

function blobData(blob){
 return new Promise((ok,no)=>{
  const r=new FileReader();

  r.onload=()=>ok(r.result);
  r.onerror=()=>no(r.error);
  r.readAsDataURL(blob);
 });
}

function dataBlob(s){
 const [h,b]=s.split(",");
 const mime=h.match(/data:([^;]+)/)?.[1]||
  "application/octet-stream";

 const raw=atob(b);
 const a=new Uint8Array(raw.length);

 for(let i=0;i<raw.length;i++){
  a[i]=raw.charCodeAt(i);
 }

 return new Blob([a],{type:mime});
}

async function exportBackup(){
 try{
  const files={};

  for(const f of allFiles()){
   const blob=await fileGet(f.id);

   if(blob){
    files[f.id]=await blobData(blob);
   }
  }

  const backup={
   format:"a7-v23",
   exportedAt:new Date().toISOString(),
   state,
   files
  };

  const url=URL.createObjectURL(
   new Blob([JSON.stringify(backup)],{
    type:"application/json"
   })
  );

  const a=document.createElement("a");

  a.href=url;
  a.download=`A7-Superintendent-V23-Backup-${date()}.json`;

  document.body.appendChild(a);
  a.click();
  a.remove();

  setTimeout(()=>URL.revokeObjectURL(url),60000);
 }catch(err){
  alert("Backup failed: "+err.message);
 }
}

async function importBackup(ev){
 const f=ev.target.files?.[0];
 if(!f)return;

 let backup;

 try{
  backup=JSON.parse(await f.text());

  if(
   !["a7-v21","a7-v22","a7-v23"].includes(backup.format)||
   !Array.isArray(backup.state?.developments)||
   !Array.isArray(backup.state?.contractors)||
   !Array.isArray(backup.state?.bids)
  ){
   throw Error("Invalid V21/V22/V23 backup");
  }
 }catch(err){
  return alert("Cannot read backup: "+err.message);
 }

 if(!confirm(
  "Replace ALL current A7 data in this browser with this backup? " +
  "Export your current backup first."
 ))return;

 try{
  const d=db||await openDB();

  await new Promise((ok,no)=>{
   const t=d.transaction("files","readwrite");

   t.objectStore("files").clear();

   t.oncomplete=ok;
   t.onerror=()=>no(t.error);
  });

  for(const [k,v] of Object.entries(backup.files||{})){
   await filePut(k,dataBlob(v));
  }

  state={...clone(EMPTY),...backup.state};

  save();
  go("dashboard");

  alert("Backup imported.");
 }catch(err){
  alert("Import failed: "+err.message);
 }
}
