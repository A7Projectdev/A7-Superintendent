<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
<meta name="theme-color" content="#0f2740" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="A7 Superintendent" />
<title>A7 Superintendent — V28</title>

<style>
:root{
  --navy:#0f2740;
  --navy2:#173a5d;
  --blue:#1873c9;
  --blue2:#eaf4ff;
  --bg:#f3f6f9;
  --card:#fff;
  --line:#dce5ee;
  --text:#23384c;
  --muted:#6c7f91;
  --green:#16744b;
  --greenbg:#eaf7ef;
  --amber:#9a620c;
  --amberbg:#fff6df;
  --red:#b83d3d;
  --redbg:#fff0f0;
  --shadow:0 8px 28px rgba(15,39,64,.08);
  --radius:16px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--bg);color:var(--text);
  font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  overscroll-behavior-y:none;
}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
button:disabled{opacity:.5;cursor:not-allowed}
a{color:inherit}
header{
  position:sticky;top:0;z-index:30;background:rgba(255,255,255,.95);
  backdrop-filter:blur(14px);border-bottom:1px solid var(--line);
  padding:calc(12px + env(safe-area-inset-top)) 15px 12px;
  display:flex;align-items:center;justify-content:space-between;gap:12px;
}
.brand{font-weight:950;color:var(--navy);letter-spacing:-.4px;line-height:1.05}
.brand small{display:block;color:var(--blue);font-size:9px;letter-spacing:1.15px;margin-top:4px}
.version{font-size:11px;font-weight:900;color:var(--blue);background:var(--blue2);padding:6px 9px;border-radius:999px}
main{max-width:1180px;margin:auto;padding:16px 13px 112px}
h1,h2,h3{margin:0;color:var(--navy);letter-spacing:-.3px}
h1{font-size:24px}
h2{font-size:18px}
h3{font-size:15px}
p{margin:0 0 10px}
.sub{font-size:12px;color:var(--muted)}
.card{
  background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  padding:15px;margin-bottom:12px;box-shadow:0 1px 0 rgba(15,39,64,.02)
}
.hero{
  background:linear-gradient(135deg,var(--navy),var(--navy2));color:white;
  border-radius:20px;padding:18px;margin-bottom:13px;box-shadow:var(--shadow)
}
.hero h1,.hero h2,.hero h3{color:white}
.hero .sub{color:#cfe0f1}
.head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:13px}
.row{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid #edf2f6}
.row:last-child{border-bottom:0}
.row strong{text-align:right}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.grid.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.stat{
  background:white;border:1px solid var(--line);border-radius:14px;padding:13px;min-width:0
}
.stat small{display:block;color:var(--muted);font-weight:800;font-size:10px;text-transform:uppercase;letter-spacing:.55px}
.stat strong{display:block;color:var(--navy);font-size:21px;margin-top:4px;overflow-wrap:anywhere}
.pill{
  display:inline-flex;align-items:center;gap:5px;padding:5px 9px;border-radius:999px;
  font-size:10px;font-weight:900;background:#eef3f8;color:#536b80
}
.pill.blue{background:var(--blue2);color:var(--blue)}
.pill.green{background:var(--greenbg);color:var(--green)}
.pill.amber{background:var(--amberbg);color:var(--amber)}
.pill.red{background:var(--redbg);color:var(--red)}
.btn{
  border:0;border-radius:12px;background:var(--blue);color:white;font-weight:900;
  min-height:44px;padding:10px 14px;display:inline-flex;align-items:center;justify-content:center;gap:7px
}
.btn.secondary{background:white;color:var(--blue);border:1px solid #bed5e9}
.btn.soft{background:var(--blue2);color:var(--blue)}
.btn.danger{background:white;color:var(--red);border:1px solid #ecc8c8}
.btn.green{background:var(--green);color:white}
.btn.small{min-height:36px;padding:7px 10px;font-size:12px;border-radius:9px}
.actions{display:flex;gap:8px;flex-wrap:wrap}
label{display:block;font-weight:850;color:var(--navy);font-size:12px;margin-bottom:6px}
.field{margin-bottom:12px}
input,select,textarea{
  width:100%;border:1px solid #c9d7e4;background:#fff;color:var(--text);
  border-radius:12px;padding:11px 12px;min-height:46px;outline:none
}
input:focus,select:focus,textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(24,115,201,.1)}
textarea{min-height:95px;resize:vertical}
.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 11px}
.notice{border:1px solid #cbe0f1;background:#eff7ff;border-radius:12px;padding:12px;font-size:12px;margin:10px 0}
.notice.good{background:var(--greenbg);border-color:#c5e4d1}
.notice.warn{background:var(--amberbg);border-color:#eed9a4}
.notice.bad{background:var(--redbg);border-color:#efcaca}
.list-item{padding:12px 0;border-top:1px solid #edf2f6}
.list-item:first-child{border-top:0;padding-top:0}
.list-item:last-child{padding-bottom:0}
.item-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.item-title{font-weight:900;color:var(--navy)}
.meta{font-size:12px;color:var(--muted);margin-top:3px}
.empty{text-align:center;color:var(--muted);padding:26px 8px}
.empty strong{display:block;color:var(--navy);margin-bottom:4px}
.bottom-nav{
  position:fixed;left:0;right:0;bottom:0;z-index:40;background:rgba(255,255,255,.96);
  backdrop-filter:blur(18px);border-top:1px solid var(--line);
  padding:7px 8px calc(7px + env(safe-area-inset-bottom));
  display:grid;grid-template-columns:repeat(5,1fr);gap:5px
}
.bottom-nav button{
  border:0;background:transparent;border-radius:12px;min-height:52px;color:var(--muted);
  font-size:10px;font-weight:850;padding:5px 2px
}
.bottom-nav button span{display:block;font-size:20px;line-height:1.05;margin-bottom:3px}
.bottom-nav button.active{background:var(--blue2);color:var(--blue)}
.mic-wrap{text-align:center;padding:14px 4px 7px}
.mic{
  width:112px;height:112px;border-radius:50%;border:8px solid #dceeff;
  background:var(--blue);color:white;font-size:38px;box-shadow:0 10px 28px rgba(24,115,201,.25)
}
.mic.listening{animation:pulse 1.1s infinite;background:var(--red)}
@keyframes pulse{
  0%{box-shadow:0 0 0 0 rgba(184,61,61,.35)}
  70%{box-shadow:0 0 0 22px rgba(184,61,61,0)}
  100%{box-shadow:0 0 0 0 rgba(184,61,61,0)}
}
.command-box{display:flex;gap:8px;align-items:flex-end}
.command-box textarea{min-height:54px;max-height:120px;margin:0}
.command-box button{min-width:74px}
.quick-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.quick{
  border:1px solid var(--line);background:#fff;border-radius:13px;min-height:78px;
  padding:9px 5px;color:var(--navy);font-weight:900;font-size:11px
}
.quick span{display:block;font-size:24px;margin-bottom:4px}
.question{
  border:1px solid #bfd9ef;background:#f6fbff;border-radius:15px;padding:14px;margin-bottom:10px
}
.question .q{font-weight:900;color:var(--navy);font-size:16px;margin-bottom:4px}
.fact-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:10px}
.fact{background:#f6f8fb;border:1px solid #e7edf3;border-radius:11px;padding:10px}
.fact small{display:block;color:var(--muted);font-size:10px;font-weight:850;text-transform:uppercase}
.fact strong{display:block;color:var(--navy);margin-top:3px;overflow-wrap:anywhere}
.activity{position:relative;padding-left:18px;margin:12px 0}
.activity:before{
  content:"";position:absolute;left:3px;top:7px;width:8px;height:8px;border-radius:50%;background:var(--blue)
}
.activity:after{
  content:"";position:absolute;left:6px;top:18px;bottom:-13px;width:2px;background:#dbe6ef
}
.activity:last-child:after{display:none}
.activity strong{display:block;color:var(--navy)}
.toast{
  position:fixed;left:12px;right:12px;bottom:90px;z-index:100;max-width:520px;margin:auto;
  background:#0d2033;color:white;padding:12px 14px;border-radius:13px;box-shadow:var(--shadow);
  opacity:0;transform:translateY(12px);pointer-events:none;transition:.22s
}
.toast.show{opacity:1;transform:none}
.sheet{
  position:fixed;inset:0;z-index:80;background:rgba(10,27,44,.4);display:none;align-items:flex-end
}
.sheet.open{display:flex}
.sheet-panel{
  width:100%;max-height:88vh;overflow:auto;background:var(--bg);
  border-radius:24px 24px 0 0;padding:10px 13px calc(20px + env(safe-area-inset-bottom))
}
.sheet-grab{width:46px;height:5px;background:#c8d2db;border-radius:10px;margin:2px auto 14px}
@media(max-width:760px){
  main{padding-top:12px}
  .grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .grid.two,.fields{grid-template-columns:1fr}
  .quick-grid{grid-template-columns:repeat(4,minmax(0,1fr))}
  .card{padding:13px}
  .hero{padding:16px}
  h1{font-size:21px}
  .stat strong{font-size:18px}
  .fact-grid{grid-template-columns:1fr 1fr}
}
@media(min-width:900px){
  body{padding-left:90px}
  .bottom-nav{
    top:0;bottom:0;right:auto;width:90px;border-top:0;border-right:1px solid var(--line);
    grid-template-columns:1fr;grid-template-rows:repeat(5,75px);align-content:center;padding:12px
  }
  header{left:90px}
  main{padding-bottom:30px}
  .toast{bottom:25px}
}
</style>
</head>

<body>
<header>
  <div class="brand">
    A7 SUPERINTENDENT
    <small>FIELD COMMAND CENTER</small>
  </div>
  <div class="version">V28</div>
</header>

<main id="app"></main>
<nav class="bottom-nav" id="bottomNav"></nav>

<div class="toast" id="toast"></div>

<div class="sheet" id="sheet" onclick="sheetBackdrop(event)">
  <div class="sheet-panel" id="sheetPanel"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
"use strict";

const KEY="a7-superintendent-v28";
const OLD_KEY="a7-superintendent-v27";
const FILE_DB="a7-superintendent-v28-files";

const TRADES=[
  "Land Clearing",
  "Entrance & Culvert",
  "Driveway",
  "Home Pad",
  "Water",
  "Electrical",
  "Manufactured Home",
  "Home Transport",
  "Home Setup",
  "Septic",
  "Skirting",
  "Decks & Steps",
  "HVAC",
  "Other"
];

const NAV=[
  ["field","🎙️","Field"],
  ["overview","🏗️","Overview"],
  ["bids","💵","Bids"],
  ["jobs","📋","Jobs"],
  ["settings","⚙️","Settings"]
];

let page="field";
let state=loadState();

let listening=false;
let recognition=null;

let cloudClient=null;
let cloudSession=null;
let syncTimer=null;

let fileDB=null;

/* =========================================================
   HELPERS
   ========================================================= */

function uid(){
  if(window.crypto&&crypto.randomUUID){
    return crypto.randomUUID();
  }

  return Date.now().toString(36)+
    Math.random().toString(36).slice(2);
}

function copy(x){
  return JSON.parse(JSON.stringify(x));
}

function esc(x){
  return String(x??"").replace(
    /[&<>"']/g,
    c=>({
      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#39;"
    }[c])
  );
}

function num(x){
  const n=Number(
    String(x??"").replace(/[$,]/g,"")
  );

  return Number.isFinite(n)?n:0;
}

function money(x){
  return new Intl.NumberFormat(
    "en-US",
    {
      style:"currency",
      currency:"USD",
      maximumFractionDigits:0
    }
  ).format(num(x));
}

function today(){
  const d=new Date();

  return [
    d.getFullYear(),
    String(d.getMonth()+1).padStart(2,"0"),
    String(d.getDate()).padStart(2,"0")
  ].join("-");
}

function nowISO(){
  return new Date().toISOString();
}

function fmtDate(x){
  if(!x){
    return "—";
  }

  try{
    return new Date(x).toLocaleDateString(
      "en-US",
      {
        month:"short",
        day:"numeric",
        year:"numeric"
      }
    );
  }catch(e){
    return x;
  }
}

function toast(msg){
  const t=document.getElementById("toast");

  t.textContent=msg;
  t.classList.add("show");

  clearTimeout(t._timer);

  t._timer=setTimeout(
    ()=>t.classList.remove("show"),
    2400
  );
}

function field(form,name){
  return form.elements.namedItem(name)
    ?.value
    ?.trim()||"";
}

function currentDev(){
  return state.developments.find(
    d=>d.id===state.activeDevelopment
  )||
  state.developments[0]||
  null;
}

function currentParcel(){
  const d=currentDev();

  if(!d){
    return null;
  }

  return d.parcels?.find(
    p=>p.id===state.activeParcel
  )||
  d.parcels?.[0]||
  null;
}

function currentJob(){
  const p=currentParcel();

  if(!p){
    return null;
  }

  return p.jobs?.find(
    j=>j.id===state.activeJob
  )||
  p.jobs?.[0]||
  null;
}

function allJobs(dev=currentDev()){
  if(!dev){
    return [];
  }

  return (dev.parcels||[]).flatMap(
    p=>(p.jobs||[]).map(
      j=>({
        dev,
        p,
        j
      })
    )
  );
}

function findJobById(id){
  for(const x of state.developments){

    for(const p of x.parcels||[]){

      const j=(p.jobs||[]).find(
        j=>j.id===id
      );

      if(j){
        return {
          dev:x,
          p,
          j
        };
      }
    }
  }

  return null;
}

function findParcelByName(dev,text){
  const q=(text||"")
    .toLowerCase()
    .replace(/\s+/g,"")
    .replace(/parcel/g,"lot");

  return (dev?.parcels||[]).find(
    p=>{
      const n=String(
        p.name||
        p.label||
        ""
      )
      .toLowerCase()
      .replace(/\s+/g,"")
      .replace(/parcel/g,"lot");

      return n===q||
        n.includes(q)||
        q.includes(n);
    }
  )||null;
}

function devBids(){
  const d=currentDev();

  return state.bids.filter(
    b=>!d||
    b.developmentId===d.id
  );
}

function devQuestions(){
  const d=currentDev();

  return state.v28.questions.filter(
    q=>
      q.status==="open"&&
      (
        !d||
        q.developmentId===d.id
      )
  );
}

function devActivity(){
  const d=currentDev();

  return state.v28.activity
    .filter(
      a=>
        !d||
        a.developmentId===d.id
    )
    .slice()
    .sort(
      (a,b)=>
        b.at.localeCompare(a.at)
    );
}

function addActivity(
  text,
  type="update",
  refs={}
){
  const d=currentDev();

  state.v28.activity.push({
    id:uid(),
    at:nowISO(),
    date:today(),
    type,
    text,
    developmentId:
      refs.developmentId||
      d?.id||
      null,
    parcelId:
      refs.parcelId||
      null,
    jobId:
      refs.jobId||
      null
  });
}

function saveState(sync=true){
  state.version=28;
  state.v28.updatedAt=nowISO();

  localStorage.setItem(
    KEY,
    JSON.stringify(state)
  );

  if(sync){
    scheduleCloudSave();
  }
}

function normalize(s){
  s=s||{};

  s.version=28;

  s.developments=
    Array.isArray(s.developments)
      ?s.developments
      :[];

  s.contractors=
    Array.isArray(s.contractors)
      ?s.contractors
      :[];

  s.bids=
    Array.isArray(s.bids)
      ?s.bids
      :[];

  s.messages=
    Array.isArray(s.messages)
      ?s.messages
      :[];

  s.activeDevelopment=
    s.activeDevelopment||
    s.developments[0]?.id||
    null;

  s.activeParcel=
    s.activeParcel||
    null;

  s.activeJob=
    s.activeJob||
    null;

  s.v28=s.v28||{};

  s.v28.questions=
    Array.isArray(s.v28.questions)
      ?s.v28.questions
      :[];

  s.v28.activity=
    Array.isArray(s.v28.activity)
      ?s.v28.activity
      :[];

  s.v28.budgetLines=
    Array.isArray(s.v28.budgetLines)
      ?s.v28.budgetLines
      :[];

  s.v28.photos=
    Array.isArray(s.v28.photos)
      ?s.v28.photos
      :[];

  s.v28.updatedAt=
    s.v28.updatedAt||
    nowISO();

  s.settings=s.settings||{};

  s.settings.supabaseUrl=
    s.settings.supabaseUrl||
    "";

  s.settings.supabaseAnonKey=
    s.settings.supabaseAnonKey||
    "";

  s.settings.syncEnabled=
    !!s.settings.syncEnabled;

  s.settings.aiEndpoint=
    s.settings.aiEndpoint||
    "";

  s.settings.email=
    s.settings.email||
    "";

  for(const d of s.developments){

    d.parcels=
      Array.isArray(d.parcels)
        ?d.parcels
        :[];

    for(const p of d.parcels){

      p.jobs=
        Array.isArray(p.jobs)
          ?p.jobs
          :[];

      for(const j of p.jobs){

        j.a7Overview=
          j.a7Overview||
          {};

        j.a7Overview.facts=
          j.a7Overview.facts||
          {};

        j.files=
          Array.isArray(j.files)
            ?j.files
            :[];
      }
    }
  }

  return s;
}

function loadState(){

  try{
    const v28=JSON.parse(
      localStorage.getItem(KEY)
    );

    if(v28?.developments){
      return normalize(v28);
    }

  }catch(e){}

  try{
    const old=JSON.parse(
      localStorage.getItem(
        OLD_KEY
      )
    );

    if(old?.developments){

      const migrated=
        normalize(
          copy(old)
        );

      migrated.v28.migratedFrom=
        "V27";

      localStorage.setItem(
        KEY,
        JSON.stringify(
          migrated
        )
      );

      return migrated;
    }

  }catch(e){}

  return normalize({
    developments:[],
    contractors:[],
    bids:[],
    messages:[],
    activeDevelopment:null,
    activeParcel:null,
    activeJob:null
  });
}

/* =========================================================
   NAVIGATION
   ========================================================= */

function go(p){
  page=p;

  window.scrollTo(
    0,
    0
  );

  render();
}

function setDev(id){
  state.activeDevelopment=id;

  const d=currentDev();

  state.activeParcel=
    d?.parcels?.[0]?.id||
    null;

  state.activeJob=
    d?.parcels?.[0]
      ?.jobs?.[0]?.id||
    null;

  saveState(false);
  render();
}

function setParcel(id){
  state.activeParcel=id;

  const p=currentParcel();

  state.activeJob=
    p?.jobs?.[0]?.id||
    null;

  saveState(false);
  render();
}

function setJob(id){
  state.activeJob=id;

  const found=
    findJobById(id);

  if(found){

    state.activeDevelopment=
      found.dev.id;

    state.activeParcel=
      found.p.id;

    seedQuestionsForJob(
      found.dev,
      found.p,
      found.j
    );
  }

  saveState();
  render();
}

/* =========================================================
   RENDER
   ========================================================= */

function render(){

  document.getElementById(
    "bottomNav"
  ).innerHTML=
    NAV.map(
      n=>`
        <button
          class="${
            page===n[0]
              ?"active"
              :""
          }"
          onclick="go('${n[0]}')">

          <span>
            ${n[1]}
          </span>

          ${n[2]}

        </button>
      `
    ).join("");

  const app=
    document.getElementById(
      "app"
    );

  if(
    !state.developments.length&&
    page!=="settings"
  ){
    app.innerHTML=
      emptyStart();

    return;
  }

  if(page==="field"){
    app.innerHTML=
      fieldPage();
  }

  if(page==="overview"){
    app.innerHTML=
      overviewPage();
  }

  if(page==="bids"){
    app.innerHTML=
      bidsPage();
  }

  if(page==="jobs"){
    app.innerHTML=
      jobsPage();
  }

  if(page==="settings"){
    app.innerHTML=
      settingsPage();
  }
}

function projectPicker(){

  if(!state.developments.length){
    return "";
  }

  return `
    <div class="card">

      <div class="fields">

        <div class="field">

          <label>
            Development
          </label>

          <select
            onchange="
              setDev(this.value)
            ">

            ${
              state.developments
                .map(
                  d=>`
                    <option
                      value="${d.id}"
                      ${
                        d.id===
                        currentDev()?.id
                          ?"selected"
                          :""
                      }>

                      ${
                        esc(
                          d.name||
                          "Unnamed Development"
                        )

function setupRecognition(){

  const SR=
    window.SpeechRecognition||
    window.webkitSpeechRecognition;

  if(!SR){
    return null;
  }

  const r=new SR();

  r.lang="en-US";
  r.interimResults=false;
  r.continuous=false;

  r.onstart=()=>{
    listening=true;
    updateMic();
  };

  r.onend=()=>{
    listening=false;
    updateMic();
  };

  r.onerror=()=>{
    listening=false;
    updateMic();

    toast(
      "Voice input was not available. "+
      "You can type the update instead."
    );
  };

  r.onresult=e=>{

    const text=
      e.results[0][0]
        .transcript;

    const box=
      document.getElementById(
        "commandInput"
      );

    if(box){
      box.value=text;
    }

    processCommand(text);
  };

  return r;
}

function updateMic(){

  const b=
    document.getElementById(
      "micBtn"
    );

  if(!b){
    return;
  }

  b.classList.toggle(
    "listening",
    listening
  );

  b.textContent=
    listening
      ?"■"
      :"🎙️";
}

function toggleVoice(){

  if(!recognition){
    recognition=
      setupRecognition();
  }

  if(!recognition){

    toast(
      "Voice recognition is not "+
      "available in this browser. "+
      "Type the update below."
    );

    document
      .getElementById(
        "commandInput"
      )
      ?.focus();

    return;
  }

  if(listening){
    recognition.stop();
    return;
  }

  try{
    recognition.start();
  }catch(e){}
}

function submitCommand(e){

  e.preventDefault();

  const text=
    field(
      e.target,
      "command"
    );

  if(!text){
    return;
  }

  e.target.reset();

  processCommand(text);
}

/* =========================================================
   COMMAND BRAIN
   ========================================================= */

function processCommand(text){

  const raw=text.trim();

  const lower=
    raw.toLowerCase();

  if(!raw){
    return;
  }

  state.messages.push({
    role:"user",
    text:raw,
    at:nowISO()
  });

  if(
    /\b(bid|quote|estimate)\b/
      .test(lower)
  ){

    const parsed=
      parseBid(raw);

    createBidFromCommand(
      parsed,
      raw
    );

    return;
  }

  if(
    /\b(complete|completed|finished|done)\b/
      .test(lower)
  ){

    const j=currentJob();

    if(j){

      j.status="complete";
      j.completedDate=today();

      addActivity(
        `${
          j.name||
          j.trade||
          "Job"
        } marked complete.`,
        "progress",
        {
          parcelId:
            currentParcel()?.id,
          jobId:j.id
        }
      );

      state.messages.push({
        role:"assistant",
        text:
          "Marked the current "+
          "job complete.",
        at:nowISO()
      });

      saveState();
      render();

      toast(
        "Job marked complete"
      );

      return;
    }
  }

  if(
    /\b(problem|issue|delay|broke|failed|stuck)\b/
      .test(lower)
  ){

    const j=currentJob();

    const note=
      raw.replace(
        /^.*?\b(problem|issue|delay)\b[:\s-]*/i,
        ""
      );

    addActivity(
      note||raw,
      "problem",
      {
        parcelId:
          currentParcel()?.id,
        jobId:
          j?.id
      }
    );

    if(j){

      j.a7Overview=
        j.a7Overview||
        {facts:{}};

      j.a7Overview.facts=
        j.a7Overview.facts||
        {};

      j.a7Overview.facts[
        "Latest issue"
      ]=
        note||raw;
    }

    state.messages.push({
      role:"assistant",
      text:
        "I logged that issue "+
        "in the project record.",
      at:nowISO()
    });

    saveState();
    render();

    toast(
      "Issue logged"
    );

    return;
  }

  if(
    /\b(progress|today|installed|graded|cleared|delivered|started)\b/
      .test(lower)
  ){

    const j=currentJob();

    addActivity(
      raw,
      "progress",
      {
        parcelId:
          currentParcel()?.id,
        jobId:
          j?.id
      }
    );

    if(j){

      j.a7Overview=
        j.a7Overview||
        {facts:{}};

      j.a7Overview.facts=
        j.a7Overview.facts||
        {};

      j.a7Overview.facts[
        "Latest progress"
      ]=
        raw;
    }

    state.messages.push({
      role:"assistant",
      text:
        "Saved as a field "+
        "progress update.",
      at:nowISO()
    });

    saveState();
    render();

    toast(
      "Progress saved"
    );

    return;
  }

  callExternalAI(raw);
}

/* =========================================================
   EXTERNAL AI CONNECTION
   ========================================================= */

async function callExternalAI(text){

  const endpoint=
    state.settings.aiEndpoint;

  if(!endpoint){

    addActivity(
      text,
      "note",
      {
        parcelId:
          currentParcel()?.id,
        jobId:
          currentJob()?.id
      }
    );

    state.messages.push({
      role:"assistant",
      text:
        "I saved that as a field note. "+
        "Connect the A7 AI endpoint "+
        "in Settings for full "+
        "natural-language reasoning.",
      at:nowISO()
    });

    saveState();
    render();

    toast(
      "Field note saved"
    );

    return;
  }

  toast(
    "A7 is thinking…"
  );

  try{

    const res=
      await fetch(
        endpoint,
        {
          method:"POST",

          headers:{
            "Content-Type":
              "application/json"
          },

          body:JSON.stringify({
            message:text,

            context:
              buildAIContext(),

            allowedActions:[
              "create_bid",
              "add_activity",
              "update_job_fact",
              "add_question"
            ]
          })
        }
      );

    if(!res.ok){
      throw new Error(
        "AI endpoint returned "+
        res.status
      );
    }

    const data=
      await res.json();

    if(
      Array.isArray(
        data.actions
      )
    ){
      data.actions.forEach(
        applyAIAction
      );
    }

    state.messages.push({
      role:"assistant",
      text:
        data.reply||
        "Update processed.",
      at:nowISO()
    });

    saveState();
    render();

    toast(
      data.reply||
      "A7 update processed"
    );

  }catch(err){

    addActivity(
      text,
      "note",
      {
        parcelId:
          currentParcel()?.id,
        jobId:
          currentJob()?.id
      }
    );

    saveState();
    render();

    toast(
      "AI connection failed. "+
      "I saved the update locally."
    );
  }
}

/* =========================================================
   BID PARSING
   ========================================================= */

function wordsToNumber(text){

  const small={
    zero:0,
    one:1,
    two:2,
    three:3,
    four:4,
    five:5,
    six:6,
    seven:7,
    eight:8,
    nine:9,
    ten:10,
    eleven:11,
    twelve:12,
    thirteen:13,
    fourteen:14,
    fifteen:15,
    sixteen:16,
    seventeen:17,
    eighteen:18,
    nineteen:19,
    twenty:20,
    thirty:30,
    forty:40,
    fifty:50,
    sixty:60,
    seventy:70,
    eighty:80,
    ninety:90
  };

  const scale={
    hundred:100,
    thousand:1000,
    million:1000000
  };

  let total=0;
  let current=0;
  let found=false;

  const words=
    String(text)
      .toLowerCase()
      .replace(/-/g," ")
      .split(/\s+/);

  for(const w of words){

    if(w in small){

      current+=small[w];
      found=true;

      continue;
    }

    if(w==="hundred"){

      current=
        Math.max(
          1,
          current
        )*100;

      found=true;
      continue;
    }

    if(
      w==="thousand"||
      w==="million"
    ){

      total+=
        Math.max(
          1,
          current
        )*
        scale[w];

      current=0;
      found=true;

      continue;
    }
  }

  return found
    ?total+current
    :0;
}

function extractAmount(raw){

  let m=
    raw.match(
      /\$\s*([\d,]+(?:\.\d{1,2})?)/
    );

  if(m){
    return num(m[1]);
  }

  m=
    raw.match(
      /\b([\d,]+(?:\.\d{1,2})?)\s*(k|thousand)?\b/i
    );

  if(m){

    let n=
      num(m[1]);

    if(
      (m[2]||"")
        .toLowerCase()===
      "k"
    ){
      n*=1000;
    }

    if(n>=100){
      return n;
    }
  }

  const beforeDollars=
    raw.split(
      /\bdollars?\b/i
    )[0];

  return wordsToNumber(
    beforeDollars
  );
}

function detectScope(raw){

  const s=
    raw.toLowerCase();

  const map=[
    [
      "land clearing",
      /land\s*clear|clearing|clear the lot|underbrush/
    ],
    [
      "entrance & culvert",
      /culvert|entrance/
    ],
    [
      "driveway",
      /driveway|rock drive|gravel/
    ],
    [
      "home pad",
      /home pad|house pad|building pad|pad work/
    ],
    [
      "water",
      /water line|water meter|water/
    ],
    [
      "electrical",
      /electric|power|electrical/
    ],
    [
      "septic",
      /septic/
    ],
    [
      "decks & steps",
      /deck|steps|stairs|porch/
    ],
    [
      "manufactured home",
      /manufactured home|mobile home|double wide|double-wide/
    ],
    [
      "home setup",
      /home setup|set the home|blocking|tie.?down/
    ],
    [
      "hvac",
      /hvac|air conditioning|a\/c/
    ]
  ];

  for(const [name,re] of map){

    if(re.test(s)){
      return name;
    }
  }

  return "other";
}

function parseBid(raw){

  const amount=
    extractAmount(raw);

  let contractor="";

  const from=
    raw.match(
      /\bfrom\s+(.+?)\s+for\s+(?=\$|[\d]|[a-z])/i
    );

  if(from){

    contractor=
      from[1]
        .trim()
        .replace(/[,.]$/,"");
  }

  if(!contractor){

    const by=
      raw.match(
        /\b(?:contractor|bidder)\s+([A-Za-z][A-Za-z' -]{1,40}?)(?:\s+for|\s+at|,|$)/i
      );

    if(by){
      contractor=
        by[1].trim();
    }
  }

  let parcelText="";

  const pm=
    raw.match(
      /\b(?:lot|parcel)\s*([A-Za-z0-9-]+)/i
    );

  if(pm){
    parcelText=
      "Lot "+
      pm[1];
  }

  return {
    contractor,
    amount,
    scope:
      detectScope(raw),
    parcelText
  };
}

function createBidFromCommand(
  parsed,
  raw,
  silent=false
){

  const d=currentDev();

  if(!d){

    toast(
      "Create a development first."
    );

    return;
  }

  const p=
    parsed.parcelText
      ?findParcelByName(
        d,
        parsed.parcelText
      )
      :currentParcel();

  const scope=
    parsed.scope||
    "other";

  const jobHit=
    (p?.jobs||[])
      .find(
        j=>
          String(
            j.name||
            j.trade||
            j.title||
            ""
          )
          .toLowerCase()
          .includes(
            scope.toLowerCase()
          )
          ||
          scope
            .toLowerCase()
            .includes(
              String(
                j.name||
                j.trade||
                j.title||
                ""
              )
              .toLowerCase()
            )
      );

  const bid={
    id:uid(),

    developmentId:
      d.id,

    parcelId:
      p?.id||
      null,

    jobId:
      jobHit?.id||
      null,

    contractorName:
      parsed.contractor||
      "",

    scope,

    amount:
      num(parsed.amount),

    status:"received",

    date:today(),

    createdAt:nowISO(),

    sourceText:raw
  };

  state.bids.push(
    bid
  );

  if(jobHit){

    jobHit.a7Overview=
      jobHit.a7Overview||
      {facts:{}};

    jobHit.a7Overview.facts=
      jobHit.a7Overview.facts||
      {};

    if(bid.contractorName){

      jobHit.a7Overview.facts[
        "Latest bidder"
      ]=
        bid.contractorName;
    }

    if(bid.amount){

      jobHit.a7Overview.facts[
        "Latest bid"
      ]=
        money(
          bid.amount
        );
    }
  }

  addActivity(
    `Bid received${
      bid.contractorName
        ?" from "+
          bid.contractorName
        :""
    }${
      bid.amount
        ?" for "+
          money(bid.amount)
        :""
    } — ${scope}.`,
    "bid",
    {
      parcelId:
        bid.parcelId,
      jobId:
        bid.jobId
    }
  );

  if(!bid.contractorName){

    addBidQuestion(
      bid,
      "contractor",
      "Who is this bid from?",
      "Contractor / company name"
    );
  }

  if(!bid.amount){

    addBidQuestion(
      bid,
      "amount",
      "What is the bid amount?",
      "Example: 5000"
    );
  }

  if(scope==="other"){

    addBidQuestion(
      bid,
      "scope",
      "What work is this bid for?",
      "Example: Land clearing"
    );
  }

  if(
    !bid.parcelId&&
    (d.parcels||[]).length>1
  ){

    addBidQuestion(
      bid,
      "parcel",
      "Which lot or parcel is this for?",
      "Example: Lot 2"
    );
  }

  state.messages.push({
    role:"assistant",

    text:
      `Bid logged${
        bid.amount
          ?" at "+
            money(bid.amount)
          :""
      }.`,

    at:nowISO()
  });

  saveState();
  render();

  if(!silent){
    toast(
      "Bid saved"
    );
  }
}

function seedQuestionsForJob(
  dev,
  parcel,
  job
){

  if(!job){
    return;
  }

  const existing=
    state.v28.questions
      .filter(
        q=>q.jobId===job.id
      );

  const answered=
    job.a7Overview?.facts||
    {};

  const name=
    String(
      job.name||
      job.trade||
      job.title||
      ""
    )
    .toLowerCase();

  const defs=
    /land\s*clear/.test(name)

      ?[
        [
          "contractor",
          "Who is doing the land clearing?",
          "Contractor name"
        ],
        [
          "price",
          "What is the agreed land-clearing price?",
          "Example: 5000"
        ],
        [
          "clear_acres",
          "How many acres are being completely cleared?",
          "Example: 1.5 acres"
        ],
        [
          "underbrush_acres",
          "How many additional acres are underbrush-only?",
          "Example: 2 acres"
        ],
        [
          "start_date",
          "When is land clearing scheduled to start?",
          "Example: October 1"
        ],
        [
          "completion",
          "What is the expected completion date?",
          "Example: October 3"
        ]
      ]

      :[
        [
          "contractor",
          "Who is the contractor for this job?",
          "Contractor name"
        ],
        [
          "price",
          "What is the current price or budget for this job?",
          "Example: 5000"
        ],
        [
          "status",
          "What is the current status?",
          "Not started / In progress / Complete"
        ],
        [
          "start_date",
          "When is this job scheduled to start?",
          "Date"
        ],
        [
          "completion",
          "What is the expected completion date?",
          "Date"
        ]
      ];

  for(
    const [
      key,
      q,
      ph
    ]
    of defs
  ){

    const label=
      factLabel(key);

    if(answered[label]){
      continue;
    }

    if(
      existing.some(
        x=>x.field===key
      )
    ){
      continue;
    }

    state.v28.questions.push({

      id:uid(),

      status:"open",

      developmentId:
        dev.id,

      parcelId:
        parcel.id,

      jobId:
        job.id,

      entityType:"job",

      entityId:
        job.id,

      field:key,

      question:q,

      placeholder:ph,

      context:
        `${
          parcel.name||
          "Parcel"
        } · ${
          job.name||
          job.trade||
          job.title||
          "Job"
        }`
    });
  }
}

function factLabel(key){

  const labels={

    contractor:
      "Contractor",

    price:
      "Price",

    clear_acres:
      "Completely cleared",

    underbrush_acres:
      "Underbrush only",

    start_date:
      "Start date",

    completion:
      "Expected completion",

    status:
      "Status",

    parcel:
      "Lot / Parcel",

    amount:
      "Bid amount",

    scope:
      "Scope",

    note:
      "Note"
  };

  return labels[key]||
    key
      .replace(/_/g," ")
      .replace(
        /\b\w/g,
        m=>m.toUpperCase()
      );
}

function answerQuestion(
  e,
  id
){

  e.preventDefault();

  const answer=
    field(
      e.target,
      "answer"
    );

  const q=
    state.v28.questions
      .find(
        x=>x.id===id
      );

  if(!q||!answer){
    return;
  }

  if(
    q.entityType===
    "job"
  ){

    const found=
      findJobById(
        q.entityId||
        q.jobId
      );

    if(found){

      found.j.a7Overview=
        found.j.a7Overview||
        {facts:{}};

      found.j.a7Overview.facts=
        found.j.a7Overview.facts||
        {};

      found.j.a7Overview.facts[
        factLabel(q.field)
      ]=
        answer;

      if(
        q.field===
        "status"
      ){
        found.j.status=
          answer;
      }

      if(
        q.field===
        "contractor"
      ){
        found.j.contractorName=
          answer;
      }
    }
  }

  if(
    q.entityType===
    "bid"
  ){

    const bid=
      state.bids.find(
        b=>b.id===q.entityId
      );

    if(bid){

      if(
        q.field===
        "contractor"
      ){
        bid.contractorName=
          answer;
      }

      if(
        q.field===
        "amount"
      ){
        bid.amount=
          extractAmount(answer)||
          num(answer);
      }

      if(
        q.field===
        "scope"
      ){
        bid.scope=
          answer;
      }

      if(
        q.field===
        "parcel"
      ){

        const p=
          findParcelByName(
            currentDev(),
            answer
          );

        bid.parcelId=
          p?.id||
          null;

        if(p){
          q.parcelId=
            p.id;
        }
      }

      const found=
        bid.jobId
          ?findJobById(
            bid.jobId
          )
          :null;

      if(found){

        found.j.a7Overview=
          found.j.a7Overview||
          {facts:{}};

        found.j.a7Overview.facts=
          found.j.a7Overview.facts||
          {};

        if(
          q.field===
          "contractor"
        ){
          found.j.a7Overview.facts[
            "Latest bidder"
          ]=
            answer;
        }

        if(
          q.field===
          "amount"
        ){
          found.j.a7Overview.facts[
            "Latest bid"
          ]=
            money(
              bid.amount
            );
        }
      }
    }
  }

  q.status="answered";
  q.answer=answer;
  q.answeredAt=nowISO();

  addActivity(
    `${
      factLabel(
        q.field
      )
    } updated: ${answer}`,
    "answer",
    {
      parcelId:
        q.parcelId,
      jobId:
        q.jobId
    }
  );

  saveState();
  render();

  toast(
    "Saved to the overview"
  );
}

function budgetSnapshot(){

  const d=currentDev();

  const lines=
    state.v28.budgetLines
      .filter(
        x=>
          !d||
          x.developmentId===
          d.id
      );

  let committed=
    lines.reduce(
      (s,x)=>
        s+
        num(x.committed),
      0
    );

  let paid=
    lines.reduce(
      (s,x)=>
        s+
        num(x.paid),
      0
    );

  const v27=
    d?.dealV26
      ?.costItems;

  if(
    Array.isArray(v27)
  ){

    for(const x of v27){

      const amt=
        num(
          x.committedAmount??
          x.amount??
          x.forecast??
          x.estimate??
          0
        );

      if(amt){
        committed+=amt;
      }

      paid+=
        num(
          x.paidAmount??
          x.paid??
          0
        );
    }
  }

  return {
    committed,
    paid
  };
}

/* =========================================================

   ========================================================= */

function openFileDB(){

  if(fileDB){
    return Promise.resolve(
      fileDB
    );
  }

  return new Promise(
    (ok,no)=>{

      const req=
        indexedDB.open(
          FILE_DB,
          1
        );

      req.onupgradeneeded=
        ()=>{

          if(
            !req.result
              .objectStoreNames
              .contains(
                "files"
              )
          ){
            req.result
              .createObjectStore(
                "files"
              );
          }
        };

      req.onsuccess=
        ()=>{

          fileDB=
            req.result;

          ok(fileDB);
        };

      req.onerror=
        ()=>no(
          req.error
        );
    }
  );
}

async function putFile(
  id,
  blob
){

  const db=
    await openFileDB();

  return new Promise(
    (ok,no)=>{

      const tx=
        db.transaction(
          "files",
          "readwrite"
        );

      tx.objectStore(
        "files"
      ).put(
        blob,
        id
      );

      tx.oncomplete=
        ()=>ok();

      tx.onerror=
        ()=>no(
          tx.error
        );
    }
  );
}

async function capturePhoto(e){

  const file=
    e.target.files?.[0];

  if(!file){
    return;
  }

  try{

    const id=uid();

    await putFile(
      id,
      file
    );

    state.v28.photos.push({

      id,

      name:
        file.name||
        "Field photo",

      type:
        file.type,

      size:
        file.size,

      date:
        today(),

      at:
        nowISO(),

      developmentId:
        currentDev()?.id||
        null,

      parcelId:
        currentParcel()?.id||
        null,

      jobId:
        currentJob()?.id||
        null
    });

    addActivity(
      `Field photo added: ${
        file.name||
        "Photo"
      }`,
      "photo",
      {
        parcelId:
          currentParcel()?.id,
        jobId:
          currentJob()?.id
      }
    );

    saveState();
    render();

    toast(
      "Photo saved on this device"
    );

  }catch(err){

    toast(
      "Could not save the photo"
    );
  }

  e.target.value="";
}

/* =========================================================
   CLOUD SYNC
   ========================================================= */

async function initCloud(
  showMessages=false
){

  const s=
    state.settings;

  if(
    !s.syncEnabled||
    !s.supabaseUrl||
    !s.supabaseAnonKey||
    !window.supabase
  ){

    cloudClient=null;
    cloudSession=null;

    return false;
  }

  try{

    cloudClient=
      window.supabase
        .createClient(
          s.supabaseUrl,
          s.supabaseAnonKey
        );

    const {data}=
      await cloudClient
        .auth
        .getSession();

    cloudSession=
      data.session||
      null;

    cloudClient.auth
      .onAuthStateChange(
        (
          _event,
          session
        )=>{

          cloudSession=
            session||
            null;

          if(cloudSession){
            cloudLoad();
          }

          render();
        }
      );

    if(cloudSession){

      await cloudLoad(
        false
      );
    }

    return true;

  }catch(err){

    if(showMessages){

      toast(
        "Cloud setup error"
      );
    }

    return false;
  }
}

async function sendMagicLink(){

  const s=
    state.settings;

  if(
    !s.supabaseUrl||
    !s.supabaseAnonKey||
    !s.email
  ){

    toast(
      "Enter Supabase URL, "+
      "anon key, and your "+
      "email first."
    );

    return;
  }

  await initCloud();

  if(!cloudClient){

    toast(
      "Could not start "+
      "cloud login."
    );

    return;
  }

  const {error}=
    await cloudClient
      .auth
      .signInWithOtp({

        email:s.email,

        options:{
          emailRedirectTo:
            location.origin+
            location.pathname
        }
      });

  if(error){

    toast(
      error.message
    );

    return;
  }

  toast(
    "Login link sent "+
    "to your email"
  );
}

function scheduleCloudSave(){

  if(
    !state.settings.syncEnabled||
    !cloudSession||
    !cloudClient
  ){
    return;
  }

  clearTimeout(
    syncTimer
  );

  syncTimer=
    setTimeout(
      ()=>cloudSave(),
      700
    );
}

async function cloudSave(){

  if(
    !cloudSession||
    !cloudClient
  ){
    return;
  }

  try{

    const payload=
      copy(state);

    payload.settings={
      ...payload.settings,
      supabaseAnonKey:""
    };

    const {error}=
      await cloudClient
        .from(
          "a7_state"
        )
        .upsert(
          {
            user_id:
              cloudSession
                .user
                .id,

            state:
              payload,

            updated_at:
              nowISO()
          },

          {
            onConflict:
              "user_id"
          }
        );

    if(error){
      throw error;
    }

  }catch(err){

    console.warn(
      "A7 cloud save failed",
      err
    );
  }
}

async function cloudLoad(
  showToast=true
){

  if(
    !cloudSession||
    !cloudClient
  ){
    return;
  }

  try{

    const {
      data,
      error
    }=
      await cloudClient
        .from(
          "a7_state"
        )
        .select(
          "state,updated_at"
        )
        .eq(
          "user_id",
          cloudSession.user.id
        )
        .maybeSingle();

    if(error){
      throw error;
    }

    if(data?.state){

      const localSettings=
        copy(
          state.settings
        );

      const incoming=
        normalize(
          data.state
        );

      incoming.settings={
        ...incoming.settings,
        ...localSettings
      };

      state=
        incoming;

      saveState(
        false
      );

      if(showToast){

        toast(
          "Cloud project loaded"
        );
      }

      render();

    }else{

      await cloudSave();
    }

  }catch(err){

    if(showToast){

      toast(
        "Cloud sync could not load. "+
        "Local data is still safe."
      );
    }
  }
}

/* =========================================================

   ========================================================= */

function exportBackup(){

  const data={
    format:"a7-v28",
    exportedAt:nowISO(),
    state
  };

  const blob=
    new Blob(
      [
        JSON.stringify(
          data,
          null,
          2
        )
      ],
      {
        type:"application/json"
      }
    );

  const url=
    URL.createObjectURL(
      blob
    );

  const a=
    document.createElement(
      "a"
    );

  a.href=url;

  a.download=
    "A7-V28-Backup-"+
    today()+
    ".json";

  document.body.appendChild(
    a
  );

  a.click();
  a.remove();

  setTimeout(
    ()=>URL.revokeObjectURL(url),
    2000
  );
}

async function importBackup(e){

  const f=
    e.target.files?.[0];

  if(!f){
    return;
  }

  try{

    const data=
      JSON.parse(
        await f.text()
      );

    if(
      data.format!=="a7-v28"||
      !data.state
    ){
      throw new Error(
        "Not an A7 V28 backup"
      );
    }

    if(
      !confirm(
        "Replace the current V28 "+
        "browser data with this backup?"
      )
    ){
      return;
    }

    const settings=
      copy(
        state.settings
      );

    state=
      normalize(
        data.state
      );

    state.settings={
      ...state.settings,
      ...settings
    };

    saveState();
    render();

    toast(
      "Backup imported"
    );

  }catch(err){

    toast(
      "Could not import that backup"
    );
  }

  e.target.value="";
}
