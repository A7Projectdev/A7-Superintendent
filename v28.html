<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>A7 Superintendent — V28</title>

<style>
:root{
  --navy:#122b45;
  --navy2:#193d60;
  --blue:#1768b5;
  --blue2:#eaf3fc;
  --bg:#f4f7fa;
  --white:#fff;
  --line:#dde6ef;
  --muted:#6b7d90;
  --green:#15734b;
  --red:#b64040;
  --amber:#99620d;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;
  background:var(--bg);
  color:#26394d;
  font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
header{
  position:sticky;
  top:0;
  z-index:20;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:15px 16px;
  background:rgba(255,255,255,.97);
  border-bottom:1px solid var(--line);
}
.brand{
  color:var(--navy);
  font-weight:900;
  letter-spacing:-.3px;
}
.brand small{
  display:block;
  color:var(--blue);
  font-size:9px;
  letter-spacing:1px;
}
.version{
  background:var(--blue2);
  color:var(--blue);
  padding:5px 9px;
  border-radius:20px;
  font-size:10px;
  font-weight:900;
}
main{
  max-width:1000px;
  margin:auto;
  padding:18px 14px 105px;
}
h1,h2,h3{
  color:var(--navy);
  letter-spacing:-.3px;
}
h1{margin:0 0 5px;font-size:25px}
h2{margin:0 0 10px;font-size:18px}
h3{margin:0 0 8px;font-size:15px}
p{margin:0 0 12px}
.sub,.meta{color:var(--muted);font-size:12px}
.hero{
  padding:21px;
  margin-bottom:13px;
  border-radius:18px;
  color:white;
  background:linear-gradient(135deg,var(--navy),#225984);
  box-shadow:0 8px 25px rgba(18,43,69,.12);
}
.hero h1,.hero h2{color:white}
.hero .sub{color:#d7e5f2}
.hero-grid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:9px;
  margin-top:18px;
}
.hero-stat{
  padding:12px;
  border:1px solid rgba(255,255,255,.15);
  border-radius:12px;
  background:rgba(255,255,255,.09);
}
.hero-stat small{
  display:block;
  color:#cee0f1;
  font-size:9px;
  font-weight:900;
  letter-spacing:.5px;
}
.hero-stat strong{
  display:block;
  margin-top:5px;
  font-size:18px;
}
.card{
  margin-bottom:12px;
  padding:16px;
  background:white;
  border:1px solid var(--line);
  border-radius:15px;
}
.grid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:10px;
  margin-bottom:12px;
}
.stat{
  min-width:0;
  padding:14px;
  background:white;
  border:1px solid var(--line);
  border-radius:13px;
}
.stat small{
  display:block;
  color:var(--muted);
  font-size:10px;
  font-weight:900;
}
.stat strong{
  display:block;
  margin-top:4px;
  color:var(--navy);
  font-size:20px;
  overflow-wrap:anywhere;
}
.stat.good strong{color:var(--green)}
.stat.bad strong{color:var(--red)}
.btn{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  min-height:41px;
  padding:10px 14px;
  border:1px solid var(--blue);
  border-radius:10px;
  background:var(--blue);
  color:white;
  text-decoration:none;
  font-size:12px;
  font-weight:850;
}
.btn.secondary{
  background:white;
  color:var(--blue);
  border-color:#c7d9ea;
}
.btn.danger{
  background:white;
  color:var(--red);
  border-color:#e8c4c4;
}
.btn.small{
  min-height:34px;
  padding:7px 10px;
  font-size:11px;
}
.actions{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-top:12px;
}
.item{
  padding:14px 0;
  border-top:1px solid #edf1f5;
}
.item:first-child{border-top:0;padding-top:0}
.item:last-child{padding-bottom:0}
.itemhead{
  display:flex;
  justify-content:space-between;
  gap:12px;
  align-items:flex-start;
}
.itemtitle{
  color:var(--navy);
  font-weight:900;
}
.row{
  display:flex;
  justify-content:space-between;
  gap:14px;
  padding:9px 0;
  border-bottom:1px solid #eef2f6;
}
.row:last-child{border-bottom:0}
.row>:last-child{
  text-align:right;
  font-variant-numeric:tabular-nums;
}
.money{color:var(--navy);font-weight:900}
.badge{
  display:inline-block;
  padding:4px 8px;
  border-radius:20px;
  background:#edf2f7;
  color:#53677d;
  font-size:10px;
  font-weight:900;
}
.badge.blue{color:var(--blue);background:var(--blue2)}
.badge.green{color:var(--green);background:#e7f5ed}
.badge.amber{color:var(--amber);background:#fff2d9}
.notice{
  margin:12px 0;
  padding:12px;
  border:1px solid #c9dff3;
  border-radius:10px;
  background:#edf6ff;
  font-size:12px;
}
.notice.warn{
  border-color:#ecd7a4;
  background:#fff8e9;
}
.notice.good{
  border-color:#c9e5d2;
  background:#ebf7ef;
}
label{
  display:block;
  margin-bottom:6px;
  color:var(--navy);
  font-size:12px;
  font-weight:850;
}
.field{margin-bottom:13px}
input,select,textarea{
  width:100%;
  min-height:43px;
  padding:10px 11px;
  border:1px solid #c9d6e3;
  border-radius:10px;
  background:white;
  color:#27394d;
}
textarea{min-height:95px;resize:vertical}
.fields{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:0 12px;
}
.ask{display:flex;gap:8px}
.ask input{flex:1}
.progress{
  height:8px;
  overflow:hidden;
  margin-top:8px;
  border-radius:20px;
  background:#e5ecf3;
}
.progress span{
  display:block;
  height:100%;
  border-radius:20px;
  background:var(--blue);
}
.bottom-nav{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  z-index:30;
  display:grid;
  grid-template-columns:repeat(4,1fr);
  padding:7px 8px calc(7px + env(safe-area-inset-bottom));
  background:rgba(255,255,255,.98);
  border-top:1px solid var(--line);
}
.bottom-nav button{
  border:0;
  background:transparent;
  color:var(--muted);
  padding:7px 2px;
  font-size:10px;
  font-weight:850;
}
.bottom-nav button.active{color:var(--blue)}
.navicon{
  display:block;
  margin-bottom:2px;
  font-size:20px;
  line-height:22px;
}
.sheet{
  position:fixed;
  inset:0;
  z-index:50;
  display:flex;
  align-items:flex-end;
  background:rgba(8,24,40,.42);
}
.sheet.hidden{display:none}
.sheet-inner{
  width:100%;
  max-height:90vh;
  overflow:auto;
  padding:18px 15px calc(28px + env(safe-area-inset-bottom));
  background:white;
  border-radius:22px 22px 0 0;
}
.sheet-head{
  position:sticky;
  top:-18px;
  z-index:2;
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin:-18px -15px 15px;
  padding:14px 15px;
  background:white;
  border-bottom:1px solid var(--line);
}
.quick{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:9px;
}
.quick button{
  min-height:72px;
  padding:12px;
  text-align:left;
  border:1px solid var(--line);
  border-radius:13px;
  background:white;
  color:var(--navy);
  font-weight:850;
}
.quick small{
  display:block;
  margin-top:3px;
  color:var(--muted);
  font-weight:500;
}
.empty{
  padding:25px 5px;
  text-align:center;
  color:var(--muted);
}
.empty strong{
  display:block;
  color:var(--navy);
}
hr{
  margin:18px 0;
  border:0;
  border-top:1px solid var(--line);
}
@media(min-width:720px){
  .grid{grid-template-columns:repeat(4,minmax(0,1fr))}
  .hero-grid{grid-template-columns:repeat(4,minmax(0,1fr))}
  .quick{grid-template-columns:repeat(4,1fr)}
  .bottom-nav{
    left:50%;
    max-width:700px;
    transform:translateX(-50%);
    border:1px solid var(--line);
    border-bottom:0;
    border-radius:16px 16px 0 0;
  }
}
@media(max-width:650px){
  .fields{grid-template-columns:1fr}
}
</style>
</head>

<body>

<header>
  <div class="brand">
    A7 SUPERINTENDENT
    <small>AI PROPERTY DEVELOPMENT</small>
  </div>
  <span class="version">V28</span>
</header>

<main id="app"></main>

<nav class="bottom-nav" id="bottomNav"></nav>

<div id="sheet" class="sheet hidden"></div>

<script>
"use strict";

const KEY="a7-superintendent-v27";
const SQFT=43560;

const TRADES=[
  "Land Clearing",
  "Entrance & Culvert",
  "Driveway",
  "Home Pad",
  "Water",
  "Electrical",
  "Manufactured Home",
  "Home Transport",
  "Home Setup",
  "Septic",
  "Skirting",
  "Decks & Steps",
  "HVAC",
  "Other"
];

let state=load();
let page="home";
let activeProject=null;

function uid(){
  if(window.crypto && crypto.randomUUID){
    return crypto.randomUUID();
  }
  return Date.now().toString(36)+Math.random().toString(36).slice(2);
}

function copy(x){
  return JSON.parse(JSON.stringify(x));
}

function esc(x){
  return String(x??"").replace(/[&<>"']/g,function(c){
    return {
      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#39;"
    }[c];
  });
}

function num(x){
  const n=Number(x);
  return Number.isFinite(n)?n:0;
}

function pos(x){
  return Math.max(0,num(x));
}

function money(x){
  return new Intl.NumberFormat("en-US",{
    style:"currency",
    currency:"USD",
    maximumFractionDigits:0
  }).format(num(x));
}

function fmt(x,d=1){
  return num(x).toLocaleString("en-US",{
    maximumFractionDigits:d
  });
}

function today(){
  const d=new Date();
  return [
    d.getFullYear(),
    String(d.getMonth()+1).padStart(2,"0"),
    String(d.getDate()).padStart(2,"0")
  ].join("-");
}

function sum(a,fn){
  return (a||[]).reduce(function(s,x){
    return s+fn(x);
  },0);
}

function load(){
  try{
    const x=JSON.parse(localStorage.getItem(KEY));
    if(x && Array.isArray(x.developments)){
      x.contractors=Array.isArray(x.contractors)?x.contractors:[];
      x.bids=Array.isArray(x.bids)?x.bids:[];
      x.messages=Array.isArray(x.messages)?x.messages:[];
      x.developments.forEach(normalizeDevelopment);
      return x;
    }
  }catch(err){}

  return {
    developments:[],
    contractors:[],
    bids:[],
    messages:[],
    version:28
  };
}

function save(){
  state.version=28;
  try{
    localStorage.setItem(KEY,JSON.stringify(state));
  }catch(err){
    alert("Safari storage is full. Export a backup before continuing.");
  }
}

function normalizeDevelopment(d){
  d.files=Array.isArray(d.files)?d.files:[];
  d.parcels=Array.isArray(d.parcels)?d.parcels:[];

  d.parcels.forEach(function(p){
    p.jobs=Array.isArray(p.jobs)?p.jobs:[];
    p.jobs.forEach(function(j){
      j.files=Array.isArray(j.files)?j.files:[];
    });
  });

  ensureBudget(d);
}

function ensureBudget(d){
  if(!d.dealV26){
    d.dealV26={
      strategy:"land",
      targetMargin:20,
      contingencyRate:10,
      sellingCostRate:6,
      financingLimit:0,
      startingCash:0,
      costItems:[],
      payments:[],
      salePrices:{},
      saleStatuses:{},
      saleDates:{}
    };
  }

  const b=d.dealV26;
  b.costItems=Array.isArray(b.costItems)?b.costItems:[];
  b.payments=Array.isArray(b.payments)?b.payments:[];
  b.salePrices=b.salePrices||{};
  b.saleStatuses=b.saleStatuses||{};
  b.saleDates=b.saleDates||{};

  if(b.contingencyRate===undefined)b.contingencyRate=10;
  if(b.sellingCostRate===undefined)b.sellingCostRate=6;
  if(b.targetMargin===undefined)b.targetMargin=20;
  if(b.startingCash===undefined)b.startingCash=0;
  if(b.financingLimit===undefined)b.financingLimit=0;

  return b;
}

function budget(d){return ensureBudget(d)}
function landCost(d){return pos(d.purchasePrice)}
function items(d){return budget(d).costItems}
function itemEstimate(i){return pos(i.quantity)*pos(i.unitCost)}

function itemForecast(i){
  if(
    i.forecastOverride!=="" &&
    i.forecastOverride!==undefined &&
    i.forecastOverride!==null
  ){
    return pos(i.forecastOverride);
  }
  return itemEstimate(i);
}

function itemCommitted(i){
  return ["committed","complete"].includes(i.status)
    ?pos(i.committedAmount)
    :0;
}

function projectCost(d){
  return landCost(d)+sum(items(d),itemForecast);
}

function committed(d){
  return sum(items(d),itemCommitted);
}

function paid(d){
  return sum(budget(d).payments,function(p){
    return pos(p.amount);
  });
}

function revenue(d){
  return sum(d.parcels,function(p){
    return pos(budget(d).salePrices[p.id]);
  });
}

function missingSales(d){
  return d.parcels.filter(function(p){
    const x=budget(d).salePrices[p.id];
    return x===undefined || x===null || x==="";
  }).length;
}

function contingency(d){
  return projectCost(d)*pos(budget(d).contingencyRate)/100;
}

function sellingCosts(d){
  return revenue(d)*pos(budget(d).sellingCostRate)/100;
}

function totalForecast(d){
  return projectCost(d)+contingency(d)+sellingCosts(d);
}

function profit(d){
  return revenue(d)-totalForecast(d);
}

function margin(d){
  const r=revenue(d);
  return r>0?profit(d)/r:NaN;
}

function cashToFinish(d){
  return Math.max(0,totalForecast(d)-paid(d));
}

function fundingGap(d){
  const b=budget(d);
  return Math.max(
    0,
    cashToFinish(d)-pos(b.startingCash)-pos(b.financingLimit)
  );
}

function approvedJobs(d){
  let approved=0;
  let total=0;

  d.parcels.forEach(function(p){
    p.jobs.forEach(function(j){
      total++;
      if(j.status==="approved")approved++;
    });
  });

  return {
    approved:approved,
    total:total,
    percent:total?approved/total*100:0
  };
}

function stat(label,value,note="",tone=""){
  return `
    <div class="stat ${tone}">
      <small>${esc(label)}</small>
      <strong>${esc(value)}</strong>
      <div class="meta">${esc(note)}</div>
    </div>
  `;
}

function row(label,value){
  return `
    <div class="row">
      <span class="meta">${esc(label)}</span>
      <strong>${esc(value)}</strong>
    </div>
  `;
}

function button(label,action,kind=""){
  return `
    <button
      type="button"
      class="btn ${kind}"
      onclick="${action}">
      ${esc(label)}
    </button>
  `;
}

function field(name,label,type="text",value="",extra=""){
  return `
    <div class="field">
      <label>${esc(label)}</label>
      <input
        name="${esc(name)}"
        type="${type}"
        value="${esc(value)}"
        ${extra}>
    </div>
  `;
}

function textarea(name,label,value=""){
  return `
    <div class="field">
      <label>${esc(label)}</label>
      <textarea name="${esc(name)}">${esc(value)}</textarea>
    </div>
  `;
}

function empty(title,text){
  return `
    <div class="empty">
      <strong>${esc(title)}</strong>
      ${esc(text)}
    </div>
  `;
}

function go(p){
  page=p;
  if(p!=="project")activeProject=null;
  render();
  window.scrollTo(0,0);
}

function openProject(id){
  activeProject=id;
  page="project";
  render();
  window.scrollTo(0,0);
}

function activeDev(){
  return state.developments.find(function(d){
    return d.id===activeProject;
  });
}

function navHTML(){
  const nav=[
    ["home","⌂","Home"],
    ["projects","▣","Projects"],
    ["money","$","Money"],
    ["files","▤","Files"]
  ];

  return nav.map(function(x){
    const active=
      page===x[0] ||
      (page==="project" && x[0]==="projects");

    return `
      <button
        class="${active?"active":""}"
        onclick="go('${x[0]}')">
        <span class="navicon">${x[1]}</span>
        ${x[2]}
      </button>
    `;
  }).join("");
}

function home(){
  const ds=state.developments;

  const lots=sum(ds,function(d){
    return d.parcels.length;
  });

  const forecast=sum(ds,totalForecast);
  const totalPaid=sum(ds,paid);

  return `
    <div class="hero">
      <h1>A7 Command Center</h1>

      <div class="sub">
        Your developments, field work and money in one place.
      </div>

      <div class="hero-grid">
        <div class="hero-stat">
          <small>DEVELOPMENTS</small>
          <strong>${ds.length}</strong>
        </div>

        <div class="hero-stat">
          <small>PLANNED LOTS</small>
          <strong>${lots}</strong>
        </div>

        <div class="hero-stat">
          <small>FORECAST</small>
          <strong>${money(forecast)}</strong>
        </div>

        <div class="hero-stat">
          <small>PAID</small>
          <strong>${money(totalPaid)}</strong>
        </div>
      </div>
    </div>

    ${askA7()}

    <div class="card">
      <div class="itemhead">
        <div>
          <h2>Projects</h2>
          <div class="sub">Current development portfolio</div>
        </div>

        ${button("+ New","newDevelopment()","secondary small")}
      </div>

      <hr>

      ${ds.length
        ?ds.map(projectCard).join("")
        :empty(
          "No developments yet",
          "Create your first development to begin."
        )
      }
    </div>

    <div class="card">
      <h2>Quick Actions</h2>

      <div class="quick">
        <button onclick="go('projects')">
          Projects
          <small>Parcels and field work</small>
        </button>

        <button onclick="go('money')">
          Money
          <small>Costs, payments and profit</small>
        </button>

        <button onclick="go('files')">
          Files
          <small>Documents and photos</small>
        </button>

        <button onclick="showMore()">
          More
          <small>Contractors, bids and backups</small>
        </button>
      </div>
    </div>
  `;
}

function projectCard(d){
  const progress=approvedJobs(d);

  return `
    <div class="item">
      <div class="itemhead">
        <div>
          <div class="itemtitle">${esc(d.name)}</div>

          <div class="meta">
            ${esc(d.location||"Location not entered")}
            · ${d.parcels.length} lots
          </div>
        </div>

        ${button(
          "Open",
          `openProject('${d.id}')`,
          "secondary small"
        )}
      </div>

      <div class="progress">
        <span style="width:${Math.min(100,progress.percent)}%"></span>
      </div>

      <div class="meta">
        ${progress.approved} of ${progress.total}
        construction stages approved
      </div>
    </div>
  `;
}

function askA7(){
  return `
    <div class="card">
      <h2>Ask A7</h2>

      <p class="sub">
        Ask about the project budget, cash needed,
        profit, bids or construction progress.
      </p>

      <form class="ask" onsubmit="ask(event)">
        <input
          name="question"
          placeholder="What do I need to know today?"
          autocomplete="off">

        <button class="btn">Ask</button>
      </form>

      <div id="a7Answer"></div>
    </div>
  `;
}

function ask(ev){
  ev.preventDefault();

  const q=ev.target.question.value.trim();
  if(!q)return;

  const d=activeDev()||state.developments[0];
  let answer="";

  if(!d){
    answer=
      "Create a development first so I have project records to work with.";
  }else if(/cash|finish|need/i.test(q)){
    answer=
      d.name+" currently shows "+
      money(cashToFinish(d))+
      " of forecast cost remaining after recorded payments.";
  }else if(/profit|margin/i.test(q)){
    if(missingSales(d)){
      answer=
        d.name+" is missing "+
        missingSales(d)+
        " lot sale price(s), so projected profit is incomplete.";
    }else{
      answer=
        d.name+" currently projects "+
        money(profit(d))+
        " profit on "+
        money(revenue(d))+
        " of expected sales.";
    }
  }else if(/budget|cost/i.test(q)){
    answer=
      d.name+" has an all-in forecast of "+
      money(totalForecast(d))+
      ". Land acquisition is "+
      money(landCost(d))+".";
  }else if(/paid|payment/i.test(q)){
    answer=
      "Recorded payments for "+
      d.name+
      " total "+
      money(paid(d))+".";
  }else if(/progress|stage|construction/i.test(q)){
    const p=approvedJobs(d);

    answer=
      d.name+" has "+
      p.approved+" of "+
      p.total+

  }else if(/bid/i.test(q)){
    const bids=state.bids.filter(function(b){
      return b.developmentId===d.id;

    answer=
      d.name+" currently has "+
      bids.length+
      " recorded contractor bid(s). "+
      "Bids remain proposals until accepted.";
  }else{
    answer=
      "I can summarize "+
      d.name+
      "'s budget, payments, cash to finish, "+
      "profit, bids and construction progress.";
  }

  const box=document.getElementById("a7Answer");

  if(box){
    box.innerHTML=`
      <div class="notice">
        <strong>A7 Superintendent</strong><br>
        ${esc(answer)}
      </div>
    `;
  }
}

function createDevelopment(ev){
  ev.preventDefault();

  const f=ev.target;

  const count=Math.max(
    1,
    Math.min(
      100,
      parseInt(f.lots.value)||1
    )
  );

  if(!f.name.value.trim()){
    return;
  }

  const d={
    id:uid(),
    name:f.name.value.trim(),
    location:f.location.value.trim(),
    purchasePrice:pos(f.price.value),
    acres:pos(f.acres.value),
    notes:"",
    easements:"Unknown",
    permits:"Unknown",
    files:[],
    parcels:[],
    createdAt:today()
  };

  for(let i=0;i<count;i++){
    d.parcels.push({
      id:uid(),
      name:"Parcel "+(i+1),
      acreage:"",
      notes:"",
      jobs:makeJobs()
    });
  }

  ensureBudget(d);

  state.developments.push(d);

  save();
  closeSheet();
  openProject(d.id);
}

function downloadBackup(){
  const data={
    format:"a7-v28-data",
    exportedAt:new Date().toISOString(),
    state:state
  };

  const blob=new Blob(
    [
      JSON.stringify(data,null,2)
    ],
    {
      type:"application/json"
    }
  );

  const url=URL.createObjectURL(blob);

  const a=document.createElement("a");

  a.href=url;
  a.download=
    "A7-Superintendent-V28-"+
    today()+
    ".json";

  document.body.appendChild(a);

  a.click();
  a.remove();

  setTimeout(function(){
    URL.revokeObjectURL(url);
  },1000);
}
