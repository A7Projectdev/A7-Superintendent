<!DOCTYPE html>
<html lang="en">
<head>

<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>A7 Superintendent — V27</title>

<style>
:root{
  --navy:#16314f;
  --blue:#1768b5;
  --bg:#f3f6fa;
  --line:#dce5ef;

  --green:#14754c;

}

*{box-sizing:border-box}

html{
  -webkit-text-size-adjust:100%;
}

body{
  margin:0;
  background:var(--bg);
  color:#27394d;
  font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
}

button,input,select,textarea{

}

button{
  cursor:pointer;
}

button:disabled{
  opacity:.5;
  cursor:not-allowed;
}

header{
  position:sticky;
  top:0;
  z-index:10;
  background:white;
  border-bottom:1px solid var(--line);
  padding:14px 16px;
  display:flex;

  align-items:center;
}

.brand{
  font-weight:900;
  color:var(--navy);
  letter-spacing:-.4px;
}

.brand small{
  display:block;
  font-size:10px;
  letter-spacing:1px;
  color:var(--blue);
}

nav{
  display:flex;
  overflow:auto;
  gap:5px;
  padding:8px;
  background:white;
  border-bottom:1px solid var(--line);

}

nav::-webkit-scrollbar{
  display:none;
}

nav button{
  white-space:nowrap;
  border:0;
  background:transparent;
  color:var(--muted);
  font-size:12px;
  font-weight:800;
  padding:10px 12px;
  border-radius:8px;
}

nav button.active{

  color:var(--blue);
}

main{
  max-width:1200px;
  margin:auto;
  padding:19px 13px 100px;
}

h1,h2,h3{
  color:var(--navy);
  letter-spacing:-.3px;
}

h1{
  font-size:24px;
  margin:0 0 4px;
}

h2{
  font-size:18px;
  margin:0 0 12px;
}

h3{
  font-size:15px;
  margin:0 0 9px;
}

p{
  margin:0 0 12px;
}

.sub,.help{
  color:var(--muted);
  font-size:12px;
}

.help{
  margin-top:7px;
}

.head{
  display:flex;
  justify-content:space-between;
  gap:12px;
  align-items:flex-start;
  flex-wrap:wrap;
  margin-bottom:17px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));

}

.grid.two{

}

.card,.stat{

.stat .label{

}

.stat .value{

.stat .note{

.tabs{

.tabs button{

.item:first-child{

}

.itemhead{

}

.itemtitle{

}

.meta{
  color:var(--muted);

  margin-top:3px;
}

.row{
  display:flex;
  justify-content:space-between;

label{

input,select,textarea{

hr{

.empty{

.tablewrap{

table{

th{

th,td{

}

th.num,td.num{

}

tr:last-child td{

}

tr.total td{

}

.bar{

}

.bar span{

}

.file{
  border:1px solid var(--line);
  border-radius:8px;
  padding:10px;
  margin:7px 0;

  justify-content:space-between;
  align-items:center;

}

.bubble{

  border-radius:9px;

  margin:8px 0;

}

.bubble.me{

}

.pill{

}

.kicker{

.layout{

}

.layout-inner{

.dealhero{
  background:linear-gradient(135deg,#16314f,#214e78);

}

.dealhero h2{

}

.dealhero .sub{

}

.dealhero-grid{

}

.dealhero-stat{

}

.dealhero-stat small{

@media(max-width:700px){

  .stat .value{
    font-size:19px;
  }

  .card,.stat{
    padding:13px;
  }

  h1{

</style>
</head>

<body>

<header>
  <div class="brand">
    A7 SUPERINTENDENT
    <small>PROPERTY DEVELOPMENT COMMAND CENTER</small>
  </div>
  <span class="badge blue">V27</span>
</header>

<nav id="nav"></nav>

<main id="app"></main>

<script>
"use strict";

/* =========================================================
   A7 SUPERINTENDENT V27
   Complete standalone browser prototype.
   V27 fixes the V26 nested-script parsing problem.
   ========================================================= */

const KEY="a7-superintendent-v27";

const PREVIOUS_KEYS=[
  "a7-superintendent-v26",
  "a7-superintendent-v21"
];

const DB_NAME="a7-superintendent-v21-files";

const SQFT=43560;

const TRADES=[
  "Land Clearing",
  "Entrance & Culvert",
  "Driveway",
  "Home Pad",
  "Water",
  "Electrical",
  "Manufactured Home",
  "Home Transport",
  "Home Setup",
  "Septic",
  "Skirting",
  "Decks & Steps",
  "HVAC",
  "Other"
];

const CATEGORIES=[
  ["acquisition","Land Acquisition"],
  ["due_diligence","Due Diligence & Closing"],
  ["shared_site","Shared Site Infrastructure"],
  ["parcel_site","Parcel Site Improvements"],
  ["home","Manufactured Home & Setup"],
  ["soft","Engineering, Permits & Soft Costs"],
  ["finance","Financing & Carrying"],
  ["sales","Sales & Closing"],
  ["other","Other"]
];

const CATEGORY_NAMES=Object.fromEntries(CATEGORIES);

const COST_STATUSES=[
  ["estimate","Estimate / Not Awarded"],
  ["quoted","Quoted / Bid Received"],
  ["committed","Committed / Awarded"],
  ["complete","Complete"]
];

const EMPTY={
  developments:[],
  contractors:[],
  bids:[],
  messages:[],
  activeDevelopment:null,
  activeParcel:null,
  activeJob:null,
  version:27
};

let state=load();

let page="dashboard";
let devTab="overview";
let budgetTab="deal";
let jobTab="scope";

let editingContractor=null;
let editingCost=null;
let editingPayment=null;
let db=null;
let draftClearing=null;

/* =========================================================
   BASIC HELPERS
   ========================================================= */

function copy(x){
  return JSON.parse(JSON.stringify(x));
}

function uid(){
  if(typeof crypto!=="undefined" && crypto.randomUUID){
    return crypto.randomUUID();
  }

  return Date.now().toString(36)+Math.random().toString(36).slice(2);
}

function esc(x){
  return String(x??"").replace(/[&<>"']/g,function(c){
    return {
      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#39;"
    }[c];
  });
}

function num(x){
  const v=Number(x);
  return Number.isFinite(v)?v:0;
}

function pos(x){
  return Math.max(0,num(x));
}

function money(x){
  return new Intl.NumberFormat("en-US",{
    style:"currency",
    currency:"USD",
    maximumFractionDigits:0
  }).format(num(x));
}

function money2(x){
  return new Intl.NumberFormat("en-US",{
    style:"currency",
    currency:"USD"
  }).format(num(x));
}

function fmt(x,d=1){
  return num(x).toLocaleString("en-US",{
    maximumFractionDigits:d
  });
}

function pct(x){
  return Number.isFinite(x)
    ?(x*100).toFixed(1)+"%"
    :"—";
}

function today(){
  const d=new Date();

  return [
    d.getFullYear(),
    String(d.getMonth()+1).padStart(2,"0"),
    String(d.getDate()).padStart(2,"0")
  ].join("-");
}

function valid(raw,zero=true){
  return String(raw).trim()!=="" &&
    Number.isFinite(Number(raw)) &&
    (zero?Number(raw)>=0:Number(raw)>0);
}

function v(form,name){
  return form.elements.namedItem(name)?.value?.trim()||"";
}

function sum(a,fn){
  return a.reduce(function(s,x){
    return s+fn(x);
  },0);
}

function findDev(){
  return state.developments.find(function(d){
    return d.id===state.activeDevelopment;
  });
}

function findParcel(){
  const d=findDev();

  return d?.parcels.find(function(p){
    return p.id===state.activeParcel;
  });
}

function findJob(){
  const p=findParcel();

  return p?.jobs.find(function(j){
    return j.id===state.activeJob;
  });
}

function findContractor(id){
  return state.contractors.find(function(c){
    return c.id===id;
  });
}

function jobs(d){
  return d.parcels.flatMap(function(p){
    return p.jobs;
  });
}

function findJobById(d,id){
  for(const p of d.parcels){
    const j=p.jobs.find(function(x){
      return x.id===id;
    });

    if(j){
      return {p:p,j:j};
    }
  }

  return null;
}

/* =========================================================
   STORAGE
   ========================================================= */

function save(){
  state.version=27;

  try{
    localStorage.setItem(KEY,JSON.stringify(state));
    return true;
  }catch(err){
    alert(
      "Browser storage is full. Export a backup before continuing. "+
      err.message
    );

    return false;
  }
}

function load(){
  try{
    const current=JSON.parse(localStorage.getItem(KEY));

    if(current?.developments){
      return normalize(current);
    }
  }catch(err){}

  for(const previousKey of PREVIOUS_KEYS){
    try{
      const previous=JSON.parse(localStorage.getItem(previousKey));

      if(previous?.developments){
        const result=normalize(copy(previous));

        result.importedFromPrevious=true;
        result.importedFromKey=previousKey;
        result.version=27;

        try{
          localStorage.setItem(KEY,JSON.stringify(result));
        }catch(err){}

        return result;
      }
    }catch(err){}
  }

  return copy(EMPTY);
}

function normalize(s){
  s={
    ...copy(EMPTY),
    ...s
  };

  s.developments=Array.isArray(s.developments)
    ?s.developments
    :[];

  s.contractors=Array.isArray(s.contractors)
    ?s.contractors
    :[];

  s.bids=Array.isArray(s.bids)
    ?s.bids
    :[];

  s.messages=Array.isArray(s.messages)
    ?s.messages
    :[];

  for(const d of s.developments){
    d.parcels=Array.isArray(d.parcels)
      ?d.parcels
      :[];

    d.files=Array.isArray(d.files)
      ?d.files
      :[];

    for(const p of d.parcels){
      p.jobs=Array.isArray(p.jobs)
        ?p.jobs
        :[];

      for(const j of p.jobs){
        j.files=Array.isArray(j.files)
          ?j.files
          :[];
      }
    }

    ensureBudget(d);
  }

  return s;
}

function ensureBudget(d){
  if(!d.dealV26){
    d.dealV26={
      strategy:"land",
      targetMargin:20,
      contingencyRate:10,
      sellingCostRate:6,
      financingLimit:0,
      startingCash:0,
      costItems:[],
      payments:[],
      salePrices:{},
      saleStatuses:{},
      saleDates:{},
      legacyReviewed:false
    };
  }

  const b=d.dealV26;

  b.costItems=Array.isArray(b.costItems)
    ?b.costItems
    :[];

  b.payments=Array.isArray(b.payments)
    ?b.payments
    :[];

  b.salePrices=b.salePrices||{};
  b.saleStatuses=b.saleStatuses||{};
  b.saleDates=b.saleDates||{};

  if(b.strategy===undefined)b.strategy="land";
  if(b.targetMargin===undefined)b.targetMargin=20;
  if(b.contingencyRate===undefined)b.contingencyRate=10;
  if(b.sellingCostRate===undefined)b.sellingCostRate=6;
  if(b.financingLimit===undefined)b.financingLimit=0;
  if(b.startingCash===undefined)b.startingCash=0;

  return b;
}

/* =========================================================
   NAVIGATION
   ========================================================= */

function go(p){
  page=p;
  window.scrollTo(0,0);
  render();
}

function openDev(id){
  state.activeDevelopment=id;
  state.activeParcel=null;
  state.activeJob=null;

  devTab="overview";
  budgetTab="deal";

  save();
  go("development");
}

function openParcel(id){
  state.activeParcel=id;
  state.activeJob=null;

  save();
  go("parcel");
}

function openJob(id){
  state.activeJob=id;
  jobTab="scope";
  draftClearing=null;

  save();
  go("job");
}

/* =========================================================
   HTML HELPERS
   ========================================================= */

function btn(label,action,kind=""){
  return `
    <button
      type="button"
      class="btn ${kind}"
      onclick="${action}">
      ${esc(label)}
    </button>
  `;
}

function head(title,sub="",action=""){
  return `
    <div class="head">
      <div>
        <h1>${esc(title)}</h1>
        <div class="sub">${esc(sub)}</div>
      </div>
      ${action}
    </div>
  `;
}

function stat(label,value,note="",tone=""){
  return `
    <div class="stat ${tone}">
      <div class="label">${esc(label)}</div>
      <div class="value">${esc(value)}</div>
      <div class="note">${esc(note)}</div>
    </div>
  `;
}

function row(label,value){
  return `
    <div class="row">
      <span class="sub">${esc(label)}</span>
      <strong>${esc(value)}</strong>
    </div>
  `;
}

function input(name,label,type="text",value="",extra=""){
  return `
    <div class="field">
      <label for="${esc(name)}">${esc(label)}</label>
      <input
        id="${esc(name)}"
        name="${esc(name)}"
        type="${type}"
        value="${esc(value)}"
        ${extra}>
    </div>
  `;
}

function select(name,label,options,value="",extra=""){
  return `
    <div class="field">
      <label for="${esc(name)}">${esc(label)}</label>
      <select
        id="${esc(name)}"
        name="${esc(name)}"
        ${extra}>
        ${options.map(function(o){
          const pair=Array.isArray(o)?o:[o,o];
          const key=pair[0];
          const text=pair[1];

          return `
            <option
              value="${esc(key)}"
              ${String(key)===String(value)?"selected":""}>
              ${esc(text)}
            </option>
          `;
        }).join("")}
      </select>
    </div>
  `;
}

function textarea(name,label,value=""){
  return `
    <div class="field">
      <label for="${esc(name)}">${esc(label)}</label>
      <textarea
        id="${esc(name)}"
        name="${esc(name)}">${esc(value)}</textarea>
    </div>
  `;
}

function empty(title,sub){
  return `
    <div class="empty">
      <strong>${esc(title)}</strong>
      ${esc(sub)}
    </div>
  `;
}

function tabs(items,current,variable){
  return `
    <div class="tabs">
      ${items.map(function(item){
        const key=item[0];
        const title=item[1];

        return `
          <button
            class="${key===current?"active":""}"
            onclick="${variable}='${key}';render()">
            ${esc(title)}
          </button>
        `;

/* =========================================================
   V27 PROPERTY DEVELOPMENT DEAL ENGINE
   ========================================================= */

function budget(d){
  return ensureBudget(d);
}

function landCost(d){
  return pos(d.purchasePrice);
}

function lotCount(d){
  return Math.max(1,d.parcels.length);
}

function share(d){
  return 1/lotCount(d);
}

function itemEstimate(i){
  return pos(i.quantity)*pos(i.unitCost);
}

function itemForecast(i){
  if(
    i.forecastOverride!=="" &&
    i.forecastOverride!==undefined &&
    i.forecastOverride!==null
  ){
    return pos(i.forecastOverride);
  }

  return itemEstimate(i);
}

function itemCommitted(i){
  return ["committed","complete"].includes(i.status)
    ?pos(i.committedAmount)
    :0;
}

function paidFor(d,itemId){
  return sum(
    budget(d).payments.filter(function(p){
      return p.itemId===itemId;
    }),
    function(p){
      return pos(p.amount);
    }
  );
}

function costItems(d){
  return budget(d).costItems;
}

function projectCost(d){
  return landCost(d)+sum(costItems(d),itemForecast);
}

function categoryCost(d,cat){
  const land=cat==="acquisition"
    ?landCost(d)
    :0;

  const items=sum(
    costItems(d).filter(function(i){
      return i.category===cat;
    }),
    itemForecast
  );

  return land+items;
}

function committed(d){
  return sum(costItems(d),itemCommitted);
}

function paid(d){
  return sum(
    budget(d).payments,
    function(p){
      return pos(p.amount);
    }
  );
}

function linkedPaid(d){
  return sum(
    budget(d).payments.filter(function(p){
      return p.itemId &&
        costItems(d).some(function(i){
          return i.id===p.itemId;
        });
    }),
    function(p){
      return pos(p.amount);
    }
  );
}

function committedUnpaid(d){
  return Math.max(
    0,
    committed(d)-linkedPaid(d)
  );
}

function contingency(d){
  const b=budget(d);

  return projectCost(d)*
    pos(b.contingencyRate)/100;
}

function salePrice(d,p){
  const x=budget(d).salePrices[p.id];

  if(
    x==="" ||
    x===undefined ||
    x===null
  ){
    return null;
  }

  return pos(x);
}

function totalRevenue(d){
  return sum(
    d.parcels,
    function(p){
      return salePrice(d,p)??0;
    }
  );
}

function missingSales(d){
  return d.parcels.filter(function(p){
    return salePrice(d,p)===null;
  }).length;
}

function sellingCosts(d){
  return totalRevenue(d)*
    pos(budget(d).sellingCostRate)/100;
}

function totalForecast(d){
  return projectCost(d)+
    contingency(d)+
    sellingCosts(d);
}

function profit(d){
  return totalRevenue(d)-totalForecast(d);
}

function margin(d){
  const revenue=totalRevenue(d);

  return revenue>0
    ?profit(d)/revenue
    :NaN;
}

function cashToFinish(d){
  return Math.max(
    0,
    totalForecast(d)-paid(d)
  );
}

function remainingCashGap(d){
  const b=budget(d);

  return Math.max(
    0,
    cashToFinish(d)-
    pos(b.startingCash)-
    pos(b.financingLimit)
  );
}

function breakEvenRevenue(d){
  const b=budget(d);
  const rate=pos(b.sellingCostRate)/100;

  if(rate>=1){
    return NaN;
  }

  return (
    projectCost(d)+contingency(d)
  )/(1-rate);
}

function requiredRevenue(d){
  const b=budget(d);

  const marginRate=
    pos(b.targetMargin)/100;

  const sellingRate=
    pos(b.sellingCostRate)/100;

  const divisor=
    1-marginRate-sellingRate;

  if(divisor<=0){
    return NaN;
  }

  return (
    projectCost(d)+contingency(d)
  )/divisor;
}

function lotDirect(d,p){
  return sum(
    costItems(d).filter(function(i){
      return i.parcelId===p.id;
    }),
    itemForecast
  );
}

function sharedBase(d){
  return landCost(d)+
    sum(
      costItems(d).filter(function(i){
        return !i.parcelId;
      }),
      itemForecast
    );
}

function lotBase(d,p){
  return sharedBase(d)*share(d)+
    lotDirect(d,p);
}

function lotContingency(d,p){
  return lotBase(d,p)*
    pos(budget(d).contingencyRate)/100;
}

function lotSelling(d,p){
  return (salePrice(d,p)??0)*
    pos(budget(d).sellingCostRate)/100;
}

function lotAllIn(d,p){
  return lotBase(d,p)+
    lotContingency(d,p)+
    lotSelling(d,p);
}

function lotProfit(d,p){
  const sale=salePrice(d,p);

  if(sale===null){
    return null;
  }

  return sale-lotAllIn(d,p);
}

function lotMargin(d,p){
  const sale=salePrice(d,p);

  return sale>0
    ?lotProfit(d,p)/sale
    :NaN;
}

function progress(d){
  const active=jobs(d);

  if(!active.length){
    return 0;
  }

  return active.filter(function(j){
    return j.status==="approved";
  }).length/active.length;
}

function dealReady(d){
  return missingSales(d)===0 &&
    d.parcels.length>0;
}

function scopeLabel(d,i){
  if(i.parcelId){
    return d.parcels.find(function(p){
      return p.id===i.parcelId;
    })?.name||"Missing parcel";
  }

  return "Shared across all parcels";
}

function costVariance(i){
  return itemForecast(i)-itemEstimate(i);
}

function projectVariance(d){
  return sum(costItems(d),costVariance);
}

function saveCost(ev){
  ev.preventDefault();

  const d=findDev();
  const f=ev.target;

  const qty=Number(v(f,"quantity"));
  const unit=Number(v(f,"unitCost"));

  const override=v(
    f,
    "forecastOverride"
  );

  const commitment=Number(
    v(f,"committedAmount")
  );

  if(
    !v(f,"name") ||
    !Number.isFinite(qty) ||
    qty<=0 ||
    !valid(v(f,"unitCost")) ||
    !valid(v(f,"committedAmount")) ||
    (
      override!=="" &&
      !valid(override)
    )
  ){
    alert(
      "Enter a valid scope, quantity, and amounts."
    );

    return;
  }

  const parcelId=v(f,"parcelId");
  const jobId=v(f,"jobId");

  if(
    parcelId &&
    !d.parcels.some(function(p){
      return p.id===parcelId;
    })
  ){
    alert("Choose a valid parcel.");
    return;
  }

  if(jobId){
    const match=findJobById(
      d,
      jobId
    );

    if(
      !match ||
      (
        parcelId &&
        match.p.id!==parcelId
      )
    ){
      alert(
        "The selected trade must match the assigned parcel."
      );

      return;
    }
  }

  const existing=costItems(d).find(function(i){
    return i.id===editingCost;
  });

  const x={
    id:existing?.id||uid(),
    name:v(f,"name"),
    category:v(f,"category"),
    parcelId:parcelId,
    jobId:jobId,
    status:v(f,"status"),
    ownerSupplied:
      v(f,"ownerSupplied")==="yes",
    vendor:v(f,"vendor"),
    quantity:qty,
    unit:v(f,"unit"),
    unitCost:unit,
    forecastOverride:
      override===""
        ?""
        :Number(override),
    committedAmount:commitment,
    expectedDate:v(f,"expectedDate"),
    notes:v(f,"notes")
  };

  if(existing){
    Object.assign(existing,x);
  }else{
    costItems(d).push(x);
  }

  editingCost=null;

  save();
  render();
}

function deleteCost(id){
  const d=findDev();

  const count=budget(d).payments.filter(function(p){
    return p.itemId===id;
  }).length;

  if(
    !confirm(
      "Delete this cost item? "+
      count+
      " linked payment(s) will remain but become unassigned."
    )
  ){
    return;
  }

  const index=costItems(d).findIndex(function(i){
    return i.id===id;
  });

  if(index>=0){
    costItems(d).splice(index,1);
  }

  budget(d).payments.forEach(function(p){
    if(p.itemId===id){
      p.itemId="";
    }
  });

  editingCost=null;

  save();
  render();
}

function acceptBid(id){
  const b=state.bids.find(function(x){
    return x.id===id;
  });

  const d=findDev();

  if(
    !b ||
    !d ||
    b.developmentId!==d.id
  ){
    return;
  }

  if(
    !confirm(
      "Accept "+
      b.contractorName+
      "'s "+
      money(b.amount)+
      " bid?\n\n"+
      "V27 will create or update a linked committed cost item. "+
      "Confirm the contractor's material and labor inclusions first."
    )
  ){
    return;
  }

  const other=state.bids.filter(function(x){
    return x.jobId===b.jobId;
  });

  other.forEach(function(x){
    x.acceptedV27=false;
    x.acceptedV26=false;
  });

  b.acceptedV27=true;

  let item=costItems(d).find(function(i){
    return i.sourceBidId===b.id;
  });

  if(!item){
    const homeTrades=[
      "Manufactured Home",
      "Home Transport",
      "Home Setup",
      "Skirting",
      "Decks & Steps",
      "HVAC"
    ];

    item={
      id:uid(),
      name:b.trade+" — "+b.contractorName,
      category:
        homeTrades.includes(b.trade)
          ?"home"
          :"parcel_site",
      parcelId:b.parcelId,
      jobId:b.jobId,
      status:"committed",
      ownerSupplied:false,
      vendor:b.contractorName,
      quantity:1,
      unit:"contract",
      unitCost:pos(b.amount),
      forecastOverride:pos(b.amount),
      committedAmount:pos(b.amount),
      expectedDate:"",
      notes:b.notes||"",
      sourceBidId:b.id
    };

    costItems(d).push(item);
  }else{
    item.status="committed";
    item.unitCost=pos(b.amount);
    item.forecastOverride=pos(b.amount);
    item.committedAmount=pos(b.amount);
  }

  save();
  render();
}

function savePayment(ev){
  ev.preventDefault();

  const d=findDev();
  const f=ev.target;

  if(
    !v(f,"description") ||
    !valid(v(f,"amount"),false) ||
    !v(f,"date")
  ){
    alert(
      "Enter a description, date, and positive amount."
    );

    return;
  }

  const itemId=v(f,"itemId");

  if(
    itemId &&
    !costItems(d).some(function(i){
      return i.id===itemId;
    })
  ){
    alert(
      "Select a valid cost item."
    );

    return;
  }

  const existing=editingPayment
    ?budget(d).payments.find(function(p){
      return p.id===editingPayment.id;
    })
    :null;

  const p={
    id:existing?.id||uid(),
    description:v(f,"description"),
    amount:num(v(f,"amount")),
    date:v(f,"date"),
    type:v(f,"type"),
    itemId:itemId,
    payee:v(f,"payee"),
    reference:v(f,"reference"),
    notes:v(f,"notes")
  };

  if(existing){
    Object.assign(existing,p);
  }else{
    budget(d).payments.push(p);
  }

  editingPayment=null;

  save();
  render();
}

function editPayment(id){
  const d=findDev();

  editingPayment=
    budget(d).payments.find(function(p){
      return p.id===id;
    })||null;

  render();
  window.scrollTo(0,0);
}

function deletePayment(id){
  if(
    !confirm(
      "Delete this payment? Paid-to-date and cash-to-finish totals will change."
    )
  ){
    return;
  }

  const b=budget(findDev());

  b.payments=b.payments.filter(function(p){
    return p.id!==id;
  });

  editingPayment=null;

  save();
  render();
}

   THIS FIXES THE V26 SAFARI/GITHUB DISPLAY BUG.
   ========================================================= */

function scenarioPage(d){
  return `
    <div class="card">

          step="1"

          Sale Price Change:
          <strong id="saleChangeLabel">
            0%
          </strong>
        </label>

          id="saleChange"
          type="range"
          min="-30"
          max="30"
          value="0"
          step="1"
          oninput="updateScenario()">

      </div>

      <div id="scenarioResult">
        ${scenarioResultHTML(d,0,0)}
      </div>

    </div>

    <div class="card">

      <h2>
        Current Scenario Base
      </h2>

      ${row(
        "Land purchase",
        money(landCost(d))
      )}

      ${row(
        "Entered development costs",
        money(
          sum(
            costItems(d),
            itemForecast
          )
        )
      )}

        fmt(
          budget(d).contingencyRate
        )+"%"
      )}

      ${row(
        "Selling cost assumption",
        fmt(
          budget(d).sellingCostRate
        )+"%"
      )}

      ${row(
        "Entered gross sales",
        money(totalRevenue(d))
      )}

      <p class="help">
        Construction cost changes apply to entered development
        cost items but not to the original land purchase price.
        Selling costs change with the scenario revenue.
      </p>

  `;
}

function scenarioResultHTML(d,cc,sc){
  const b=budget(d);

  const adjustedItems=
    sum(
      costItems(d),
      itemForecast
    )*(1+cc/100);

  const base=
    landCost(d)+
    adjustedItems;

  const adjustedRevenue=
    totalRevenue(d)*
    (1+sc/100);

  const adjustedContingency=
    base*
    pos(b.contingencyRate)/100;

  const adjustedSelling=
    adjustedRevenue*
    pos(b.sellingCostRate)/100;

  const total=
    base+
    adjustedContingency+
    adjustedSelling;

  const scenarioProfit=
    adjustedRevenue-total;

  const currentProfit=
    totalRevenue(d)-
    totalForecast(d);

  const scenarioMargin=
    adjustedRevenue>0
      ?scenarioProfit/adjustedRevenue
      :NaN;

  return `
    <div class="grid two">

      ${stat(
        "Scenario Project Cost",
        money(total)
      )}

      ${stat(
        "Scenario Gross Sales",
        money(adjustedRevenue)
      )}

      ${stat(
        "Scenario Profit",
        dealReady(d)
          ?money(scenarioProfit)
          :"Incomplete",
        dealReady(d)
          ?pct(scenarioMargin)
          :"Sale prices missing",
        dealReady(d)
          ?(scenarioProfit>=0?"good":"bad")
          :""
      )}

      ${stat(
        "Change From Current Profit",
        dealReady(d)
          ?money(
            scenarioProfit-
            currentProfit
          )
          :"Incomplete"
      )}

    </div>
  `;
}

function updateScenario(){
  const d=findDev();

  if(!d){
    return;
  }

  const costInput=
    document.getElementById(
      "costChange"
    );

  const saleInput=
    document.getElementById(
      "saleChange"
    );

  const result=
    document.getElementById(
      "scenarioResult"
    );

  if(
    !costInput ||
    !saleInput ||
    !result
  ){
    return;
  }

  const cc=num(
    costInput.value
  );

  const sc=num(
    saleInput.value
  );

  const costLabel=
    document.getElementById(
      "costChangeLabel"
    );

  const saleLabel=
    document.getElementById(
      "saleChangeLabel"
    );

  if(costLabel){
    costLabel.textContent=
      (cc>0?"+":"")+
      cc+
      "%";
  }

  if(saleLabel){
    saleLabel.textContent=
      (sc>0?"+":"")+
      sc+
      "%";
  }

  result.innerHTML=
    scenarioResultHTML(
      d,
      cc,
      sc
    );
}

function saveDealSetup(ev){

  const fields=[
    "targetMargin",
    "contingencyRate",
    "sellingCostRate",
    "startingCash",
    "financingLimit"
  ];

  for(const k of fields){
    if(!valid(v(f,k))){
      alert(
        "Enter valid nonnegative assumptions."

      return;

  const target=num(
    v(f,"targetMargin")

  if(
    target+selling>=100

  b.targetMargin=target;

  b.contingencyRate=num(

  b.sellingCostRate=selling;

  b.startingCash=num(
    v(f,"startingCash")

  b.financingLimit=num(

/* =========================================================
   CLEARING PLANNER
   ========================================================= */

function clearingDraft(j){
  if(draftClearing){
    return draftClearing;
  }

  const x=j.clearingLayout;

  if(
    x?.mode==="acres"
  ){
    draftClearing={
      clear:String(
        x.clearAcres??0.25
      ),
      brush:String(
        x.brushAcres??0.25
      ),
      notes:x.notes||""
    };
  }else if(x){
    const inner=
      num(x.innerLength)*
      num(x.innerWidth);

    const outer=
      num(x.outerLength)*
      num(x.outerWidth);

    draftClearing={
      clear:String(
        inner/SQFT
      ),
      brush:String(
        Math.max(
          0,
          outer-inner
        )/SQFT
      ),
      notes:x.notes||""
    };
  }else{
    draftClearing={
      clear:"0.25",
      brush:"0.25",
      notes:""
    };
  }

  return draftClearing;
}

function clearingMath(c,b){
  const clearSq=c*SQFT;
  const brushSq=b*SQFT;

  const inner=
    Math.sqrt(clearSq);

  const outer=
    Math.sqrt(
      clearSq+
      brushSq
    );

  return {
    clearSq:clearSq,
    brushSq:brushSq,
    inner:inner,
    outer:outer,
    band:(outer-inner)/2
  };
}

function clearingPlanner(j){
  const x=clearingDraft(j);
  const saved=j.clearingLayout;

  return `

        underbrush acreage separately.

          )}

          )}

        </div>

function clearingResult(c,b){
  const a=Number(c);
  const z=Number(b);

  if(
    c==="" ||
    b==="" ||
    !Number.isFinite(a) ||
    !Number.isFinite(z) ||
    a<=0 ||
    z<=0
  ){
    return `
      <div class="notice warn">
        Enter two positive acreage amounts.
      </div>
    `;
  }

  const m=clearingMath(
    a,
    z
  );

  if(m.outer>2500){
    return `
      <div class="notice warn">
        The calculated square exceeds 2,500 feet per side.
        Use a surveyed site plan for this size.
      </div>
    `;
  }

  return `
    <div class="layout">

      <strong>
        OVERALL:
        ${fmt(m.outer)}
        ×
        ${fmt(m.outer)}
        FT
      </strong>

      <div class="layout-inner">
        COMPLETE CLEARING
        <br>
        ${fmt(m.inner)}
        ×
        ${fmt(m.inner)}
        FT
      </div>

      ADDITIONAL UNDERBRUSH:
      ${fmt(m.band)}
      FT OUTSIDE EACH SIDE

    </div>

    ${row(
      "Completely cleared",
      `${fmt(m.clearSq)} sq ft · ${fmt(a,4)} acres`
    )}

    ${row(
      "Additional underbrush",
      `${fmt(m.brushSq)} sq ft · ${fmt(z,4)} acres`
    )}

    ${row(
      "Total unique footprint",
      `${fmt(m.clearSq+m.brushSq)} sq ft · ${fmt(a+z,4)} acres`
    )}

    <p class="help">
      Dimensions assume a centered square.
      Verify actual property boundaries,
      utilities, access, drainage,
      retained trees, and field layout.
    </p>
  `;
}

function saveClearing(ev){
  ev.preventDefault();

  const f=ev.target;
  const j=findJob();

  const c=Number(
    v(f,"clear")

  const b=Number(
    v(f,"brush")
  );

  if(
    !valid(v(f,"clear"),false) ||
    !valid(v(f,"brush"),false)
  ){
    alert(
      "Enter positive acreage amounts."
    );

    return;
  }

  const m=clearingMath(
    c,
    b
  );

  if(m.outer>2500){
    alert(
      "The calculated square exceeds 2,500 feet per side."
    );

    return;
  }

  if(
    j.scope &&
    !confirm(

  j.clearingLayout={
    mode:"acres",
    clearAcres:c,

    innerLength:m.inner,
    innerWidth:m.inner,
    outerLength:m.outer,
    outerWidth:m.outer,

    notes:v(f,"notes")
  };

  j.scope=[
    "LAND CLEARING — CONTRACTOR SCOPE",
    "Development: "+findDev().name,
    "Parcel: "+findParcel().name,
    "",
    "Complete clearing: "+
      fmt(c,4)+

      fmt(m.inner)+

      fmt(m.inner)+

    "",
    "Additional underbrush ONLY: "+
      fmt(b,4)+
      " acres / "+
      fmt(m.brushSq)+
      " sq ft.",
    "Approximate overall square: "+
      fmt(m.outer)+
      " ft × "+
      fmt(m.outer)+
      " ft.",
    "Approximate surrounding band: "+

function approval(j,p){
  const counts=[

    "during",
    "after"
  ].map(function(k){
    return (j.files||[]).filter(function(f){
      return f.category===k;
    }).length;
  });

  const ready=
    counts.every(function(x){
      return x>=3;
    });

  return `

      </h2>

      ${row(

        counts[0]+" / 3"
      )}

        counts[1]+" / 3"
      )}

      ${row(
        "After photos",
        counts[2]+" / 3"
      )}

      ${j.status==="approved"
        ?`
          <div class="notice good">
            Approved
            ${esc(j.approvedAt||"")}
          </div>
        `
        :`
          <div class="notice ${ready?"good":"warn"}">
            ${ready
              ?"Photo requirements met."
              :"Three photos in each category are required before approval."
            }
          </div>

          <div class="actions">

            ${btn(
              "Mark In Progress",
              "changeJobStatus('in_progress')",
              "secondary"
            )}

            ${btn(
              "Submit for Approval",
              "changeJobStatus('submitted')",
              "secondary"
            )}

            <button
              class="btn"
              ${!ready||j.status==="locked"
                ?"disabled"
                :""
              }
              onclick="approveJob()">
              Approve & Unlock Next Stage
            </button>

          </div>
        `
      }

      <p class="help">
        This is a local owner project approval record.
      </p>

    </div>
  `;
}

function changeJobStatus(status){
  const j=findJob();

  if(
    ["locked","approved"].includes(
      j.status
    )
  ){
    return;
  }

  j.status=status;

  save();
  render();
}

function approveJob(){
  const j=findJob();
  const p=findParcel();

  if(
    j.status==="locked" ||
    j.status==="approved"
  ){
    return;
  }

  const missing=[
    "before",
    "during",
    "after"
  ].some(function(k){
    return (j.files||[]).filter(function(f){
      return f.category===k;
    }).length<3;
  });

  if(missing){
    alert(
      "Upload all required photos first."
    );

    return;
  }

  if(
    !confirm(
      "Approve this stage and unlock the next stage?"
    )
  ){
    return;
  }

  j.status="approved";
  j.approvedAt=today();

  const index=p.jobs.findIndex(function(x){
    return x.id===j.id;
  });

  const next=p.jobs[index+1];

  if(
    next &&
    next.status==="locked"
  ){
    next.status="ready";
  }

  save();
  render();
}

function phoneNumber(phone){
  const raw=String(
    phone||""
  ).trim();

  const digits=raw.replace(
    /\D/g,
    ""
  );

  if(
    digits.length<7 ||
    digits.length>15
  ){
    return "";
  }

  return (
    raw.startsWith("+")
      ?"+"
      :""
  )+digits;
}

    /budget|profit|margin|cash|cost|finance/.test(s)
  ){
    if(state.developments.length){
      answer=state.developments.map(function(d){
        return [
          d.name,

    /clear|acre|underbrush/.test(s)

      "Enter completely cleared acreage and additional underbrush acreage separately. "+
      "The clearing planner calculates square footage, a centered square footprint, "+
      "and the approximate surrounding underbrush band.";
  }else if(
    /contractor|call|text/.test(s)
  ){
    answer=
      "Save contractors in the Contractor Directory and assign them to trade stages. "+
      "The Call and Text buttons open your phone's native apps.";
  }else if(
    /bid/.test(s)
  ){
    answer=
      "You currently have "+
      state.bids.length+
      " recorded bids. "+
      "A bid remains a proposal until you accept it. "+
      "When accepted, A7 creates a linked committed cost item.";
  }else{
    answer=
      "I can help summarize your deal budget, lot costs, contractor bids, "+
      "cash to finish, project stages, and clearing calculations using the records saved in this browser.";
  }

  state.messages.push(
    {
      role:"user",
      text:q
    },
    {
      role:"assistant",
      text:answer
    }
  );

  save();
  render();
}

          "files"
        )

    r.onsuccess=function(){
      db=r.result;
      resolve(db);
    };

    r.onerror=function(){
      reject(r.error);
    };
  });
}

async function filePut(id,blob){
  const d=db||await openDB();

  return new Promise(function(ok,no){
    const t=d.transaction(
      "files",
      "readwrite"
    );

    t.objectStore(
      "files"
    ).put(
      blob,
      id
    );

    t.oncomplete=ok;

    t.onerror=function(){
      no(t.error);
    };
  });
}

async function fileGet(id){
  const d=db||await openDB();

  return new Promise(function(ok,no){
    const r=d.transaction(
      "files",
      "readonly"
    ).objectStore(
      "files"
    ).get(id);

    r.onsuccess=function(){
      ok(r.result);
    };

    r.onerror=function(){
      no(r.error);
    };
  });
}

async function fileDelete(id){
  const d=db||await openDB();

  return new Promise(function(ok,no){
    const t=d.transaction(
      "files",
      "readwrite"
    );

    t.objectStore(
      "files"
    ).delete(id);

    t.oncomplete=ok;

    t.onerror=function(){
      no(t.error);
    };
  });
}

function uploader(type,owner,category){
  const docs=[
    "document",
    "receipt",
    "invoice"
  ].includes(category);

  return `
    <div class="field">

      <label>
        Upload ${esc(category)}
      </label>

      <input
        type="file"
        accept="${
          docs
            ?".pdf,image/*,.doc,.docx"
            :"image/*"
        }"
        ${docs?"":"multiple"}
        onchange="upload(event,'${type}','${owner}','${category}')">

    </div>
  `;
}

async function upload(ev,type,id,category){
  let owner=null;

  if(type==="development"){
    owner=state.developments.find(function(d){
      return d.id===id;
    });
  }else{
    owner=state.developments
      .flatMap(function(d){
        return d.parcels.flatMap(function(p){
          return p.jobs;
        });
      })
      .find(function(j){
        return j.id===id;
      });
  }

  if(!owner){
    return;
  }

  owner.files=owner.files||[];

  try{
    for(const f of [...ev.target.files]){
      const key=uid();

      await filePut(
        key,
        f
      );

      owner.files.push({
        id:key,
        name:f.name,
        type:f.type,
        size:f.size,
        category:category,
        date:today()
      });
    }

    save();
    render();
  }catch(err){
    alert(
      "Upload failed: "+
      err.message
    );
  }
}

function filesHTML(files){
  if(!files.length){
    return `
      <p class="sub">
        No files uploaded.
      </p>
    `;
  }

  return files.map(function(f){
    return `
      <div class="file">

        <div>
          <strong>
            ${esc(f.name)}
          </strong>

          <div class="meta">
            ${esc(f.category)}
            ·
            ${esc(f.date)}
          </div>
        </div>

        <div class="actions">

          ${btn(
            "View",
            `viewFile('${f.id}')`,
            "secondary small"
          )}

          ${btn(
            "Delete",
            `removeFile('${f.id}')`,
            "danger small"
          )}

        </div>

      </div>
    `;
  }).join("");
}

async function viewFile(id){
  try{
    const blob=await fileGet(id);

    if(!blob){
      alert(
        "This file was not found in this browser."
      );

      return;
    }

    const url=URL.createObjectURL(
      blob
    );

    const a=document.createElement(
      "a"
    );

    a.href=url;
    a.target="_blank";
    a.rel="noopener";

    document.body.appendChild(a);

    a.click();
    a.remove();

    setTimeout(function(){
      URL.revokeObjectURL(url);
    },60000);
  }catch(err){
    alert(
      "Cannot open file: "+
      err.message
    );
  }
}

async function removeFile(id){
  if(
    !confirm(
      "Delete this file?"
    )
  ){
    return;
  }

  try{
    await fileDelete(id);

    state.developments.forEach(function(d){
      d.files=(d.files||[]).filter(function(f){
        return f.id!==id;
      });

      d.parcels.forEach(function(p){
        p.jobs.forEach(function(j){
          j.files=(j.files||[]).filter(function(f){
            return f.id!==id;
          });
        });
      });
    });

    save();
    render();
  }catch(err){
    alert(
      "Cannot delete file: "+
      err.message
    );
  }
}

/* =========================================================
   BACKUP SYSTEM
   ========================================================= */

function allFiles(){
  return state.developments.flatMap(function(d){
    return [
      ...(d.files||[]),
      ...d.parcels.flatMap(function(p){
        return p.jobs.flatMap(function(j){
          return j.files||[];
        });
      })
    ];
  });
}

function blobData(blob){
  return new Promise(function(ok,no){
    const r=new FileReader();

    r.onload=function(){
      ok(r.result);
    };

    r.onerror=function(){
      no(r.error);
    };

    r.readAsDataURL(blob);
  });
}

function dataBlob(s){
  const parts=s.split(",");

  const h=parts[0];
  const b=parts[1];

  const match=h.match(
    /data:([^;]+)/
  );

  const mime=
    match?.[1]||
    "application/octet-stream";

  const raw=atob(b);

  const a=new Uint8Array(
    raw.length
  );

  for(
    let i=0;
    i<raw.length;
    i++
  ){
    a[i]=raw.charCodeAt(i);
  }

  return new Blob(
    [a],
    {
      type:mime
    }
  );
}

async function exportBackup(){
  try{
    const files={};

    for(const f of allFiles()){
      const blob=await fileGet(
        f.id
      );

      if(blob){
        files[f.id]=await blobData(
          blob
        );
      }
    }

    const data={
      format:"a7-v27",
      exportedAt:
        new Date().toISOString(),
      state:state,
      files:files
    };

    const backupBlob=
      new Blob(
        [
          JSON.stringify(data)
        ],
        {
          type:"application/json"
        }
      );

    const url=
      URL.createObjectURL(
        backupBlob
      );

    const a=
      document.createElement(
        "a"
      );

    a.href=url;

    a.download=
      "A7-V27-Backup-"+
      today()+
      ".json";

    document.body.appendChild(a);

    a.click();
    a.remove();

    setTimeout(function(){
      URL.revokeObjectURL(url);
    },60000);

  }catch(err){
    alert(
      "Backup failed: "+
      err.message
    );
  }
}

async function importBackup(ev){
  const file=
    ev.target.files?.[0];

  if(!file){
    return;
  }

  let backup;

  try{
    backup=JSON.parse(
      await file.text()
    );

    const allowed=[
      "a7-v21",
      "a7-v22",
      "a7-v23",
      "a7-v24",
      "a7-v25",
      "a7-v26",
      "a7-v27"
    ];

    if(
      !allowed.includes(
        backup.format
      ) ||
      !Array.isArray(
        backup.state?.developments
      )
    ){
      throw new Error(
        "Unsupported backup"
      );
    }
  }catch(err){
    alert(
      "Cannot read backup: "+
      err.message
    );

    return;
  }

  if(
    !confirm(
      "Replace all V27 records and browser files with this backup? "+
      "Export your current V27 backup first."
    )
  ){
    return;
  }

  try{
    const d=db||await openDB();

    await new Promise(function(ok,no){
      const t=d.transaction(
        "files",
        "readwrite"
      );

      t.objectStore(
        "files"
      ).clear();

      t.oncomplete=ok;

      t.onerror=function(){
        no(t.error);
      };
    });

    for(
      const pair of Object.entries(
        backup.files||{}
      )
    ){
      const id=pair[0];
      const data=pair[1];

      await filePut(
        id,
        dataBlob(data)
      );
    }

    state=normalize(
      copy(
        backup.state
      )
    );

    state.version=27;

    state.importedFromPrevious=
      backup.format!=="a7-v27";

    save();
    go("dashboard");

    alert(
      "Backup imported successfully."
    );

  }catch(err){
    alert(
      "Import failed: "+
      err.message
    );
  }
}
