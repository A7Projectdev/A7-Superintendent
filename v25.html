/* ---------- DATA ---------- */

function budgetData(d) {
  if (!d.budgetV25) {
    d.budgetV25 = {
      coverage: "land",
      target: 0,
      contingency: 0,
      shared: [],
      tradeBudgets: {},
      materials: [],
      payments: [],
      salePrices: {},
      forecastAdjustments: {}
    };
  }

  const b = d.budgetV25;

  b.shared ||= [];
  b.tradeBudgets ||= {};
  b.materials ||= [];
  b.payments ||= [];
  b.salePrices ||= {};
  b.forecastAdjustments ||= {};

  return b;
}

function budgetNumber(v) {
  const x = Number(v);
  return Number.isFinite(x) ? x : 0;
}

function budgetPositive(v) {
  return Math.max(0, budgetNumber(v));
}

function budgetMoney(v) {
  return usd(v);
}

function budgetFormValue(form, name) {
  return form.elements.namedItem(name)?.value?.trim() || "";
}

function budgetItemId() {
  return id();
}

function budgetTradeKey(parcelId, jobId) {
  return parcelId + "::" + jobId;
}

function budgetTradeAmount(d, p, j) {
  return budgetPositive(
    budgetData(d).tradeBudgets[budgetTradeKey(p.id, j.id)]
  );
}

function budgetMaterialEstimate(m) {
  return budgetPositive(m.quantity) *
    budgetPositive(m.estimatedUnitPrice);
}

function budgetMaterialActual(m) {
  if (m.actualUnitPrice === "" ||
      m.actualUnitPrice === null ||
      m.actualUnitPrice === undefined) {
    return null;
  }

  return budgetPositive(m.quantity) *
    budgetPositive(m.actualUnitPrice);
}

function budgetMaterialForecast(m) {
  return budgetMaterialActual(m) ??
    budgetMaterialEstimate(m);
}

function budgetSharedTotal(d) {
  const b = budgetData(d);

  return budgetPositive(d.purchasePrice) +
    b.shared.reduce(
      (sum, item) => sum + budgetPositive(item.amount),
      0
    );
}

function budgetSharedPerParcel(d) {
  return d.parcels.length
    ? budgetSharedTotal(d) / d.parcels.length
    : 0;
}

function budgetMaterialTotal(d, parcelId = null, jobId = null) {
  return budgetData(d).materials
    .filter(m =>
      (parcelId === null || m.parcelId === parcelId) &&
      (jobId === null || m.jobId === jobId)
    )
    .reduce(
      (sum, m) => sum + budgetMaterialForecast(m),
      0
    );
}

function budgetPaymentsTotal(d, parcelId = null, jobId = null) {
  return budgetData(d).payments
    .filter(p =>
      (parcelId === null || p.parcelId === parcelId) &&
      (jobId === null || p.jobId === jobId)
    )
    .reduce(
      (sum, p) => sum + budgetPositive(p.amount),
      0
    );
}

function budgetAcceptedBid(d, j) {
  const bid = state.bids.find(b =>
    b.jobId === j.id && b.budgetAcceptedV25 === true
  );

  return bid || null;
}

function budgetTradeForecast(d, p, j) {
  const b = budgetData(d);
  const key = budgetTradeKey(p.id, j.id);
  const accepted = budgetAcceptedBid(d, j);

  const base = accepted
    ? budgetPositive(accepted.amount)
    : budgetTradeAmount(d, p, j);

  const adjustment = budgetNumber(
    b.forecastAdjustments[key]
  );

  return Math.max(0, base + adjustment);
}

function budgetParcelDirect(d, p) {
  const trades = p.jobs.reduce(
    (sum, j) => sum + budgetTradeForecast(d, p, j),
    0
  );

  return trades + budgetMaterialTotal(d, p.id);
}

function budgetParcelForecast(d, p) {
  return budgetSharedPerParcel(d) +
    budgetParcelDirect(d, p);
}

function budgetDevelopmentForecast(d) {
  const direct = d.parcels.reduce(
    (sum, p) => sum + budgetParcelDirect(d, p),
    0
  );

  return budgetSharedTotal(d) + direct;
}

function budgetTarget(d) {
  return budgetPositive(budgetData(d).target);
}

function budgetContingency(d) {
  return budgetPositive(budgetData(d).contingency);
}

function budgetTotalTarget(d) {
  return budgetTarget(d) + budgetContingency(d);
}

function budgetRemaining(d) {
  return budgetTotalTarget(d) -
    budgetDevelopmentForecast(d);
}

function budgetTradePaid(d, p, j) {
  return budgetPaymentsTotal(d, p.id, j.id);
}

function budgetTradeToFinish(d, p, j) {
  return Math.max(
    0,
    budgetTradeForecast(d, p, j) -
    budgetTradePaid(d, p, j)
  );
}

function budgetCostToFinish(d) {
  return Math.max(
    0,
    budgetDevelopmentForecast(d) -
    budgetPaymentsTotal(d)
  );
}

const v24CreateDevelopment = createDevelopment;

createDevelopment = function (ev) {
  const form = ev.target;

  const coverage = budgetFormValue(form, "v25Coverage");
  const target = budgetPositive(
    budgetFormValue(form, "v25Target")
  );
  const contingency = budgetPositive(
    budgetFormValue(form, "v25Contingency")
  );

  const previousIds = new Set(
    state.developments.map(d => d.id)
  );

  v24CreateDevelopment(ev);

  const created = state.developments.find(
    d => !previousIds.has(d.id)
  );

  if (!created) return;

  const b = budgetData(created);

  b.coverage = coverage === "homes" ? "homes" : "land";
  b.target = target;
  b.contingency = contingency;

  save();
  render();
};

function budgetAddShared(ev) {
  ev.preventDefault();

  const d = dev();
  const b = budgetData(d);
  const f = ev.target;

  const description = budgetFormValue(f, "description");
  const amount = budgetPositive(
    budgetFormValue(f, "amount")
  );

  if (!description) {
    return alert("Enter a shared-cost description.");
  }

  b.shared.push({
    id: budgetItemId(),
    description,
    amount
  });

  save();
  render();
}

function budgetDeleteShared(itemId) {
  if (!confirm("Delete this shared cost?")) return;

  const b = budgetData(dev());

  b.shared = b.shared.filter(
    x => x.id !== itemId
  );

  save();
  render();
}

function budgetSaveTrade(ev, parcelId, jobId) {
  ev.preventDefault();

  const d = dev();
  const b = budgetData(d);
  const f = ev.target;
  const key = budgetTradeKey(parcelId, jobId);

  b.tradeBudgets[key] = budgetPositive(
    budgetFormValue(f, "tradeBudget")
  );

  b.forecastAdjustments[key] = budgetNumber(
    budgetFormValue(f, "adjustment")
  );

  save();
  render();
}

function budgetAcceptBid(bidId) {
  const bid = state.bids.find(
    x => x.id === bidId
  );

  if (!bid) return;

  if (!confirm(
    "Mark this bid as accepted for budgeting? " +
    "Other bids for the same trade will remain recorded."
  )) return;

  state.bids.forEach(x => {
    if (x.jobId === bid.jobId) {
      x.budgetAcceptedV25 = false;
    }
  });

  bid.budgetAcceptedV25 = true;

  save();
  render();
}

function budgetUnacceptBid(bidId) {
  const bid = state.bids.find(
    x => x.id === bidId
  );

  if (!bid) return;

  bid.budgetAcceptedV25 = false;

  save();
  render();
}

function budgetAddMaterial(ev) {
  ev.preventDefault();

  const d = dev();
  const b = budgetData(d);
  const f = ev.target;

  const parcelId = budgetFormValue(f, "parcelId");
  const jobId = budgetFormValue(f, "jobId");

  const selectedJob = d.parcels.flatMap(
    p => p.jobs.map(j => ({
      ...j,
      parcelId: p.id
    }))
  ).find(j => j.id === jobId);

  if (
    selectedJob &&
    parcelId &&
    selectedJob.parcelId !== parcelId
  ) {
    return alert(
      "The selected trade belongs to a different parcel."
    );
  }

  b.materials.push({
    id: budgetItemId(),
    name: budgetFormValue(f, "name"),
    supplier: budgetFormValue(f, "supplier"),
    quantity: budgetPositive(
      budgetFormValue(f, "quantity")
    ),
    unit: budgetFormValue(f, "unit") || "each",
    estimatedUnitPrice: budgetPositive(
      budgetFormValue(f, "estimatedUnitPrice")
    ),
    actualUnitPrice:
      budgetFormValue(f, "actualUnitPrice") === ""
        ? ""
        : budgetPositive(
            budgetFormValue(f, "actualUnitPrice")
          ),
    parcelId: parcelId || selectedJob?.parcelId || "",
    jobId,
    notes: budgetFormValue(f, "notes")
  });

  save();
  render();
}

function budgetEditMaterial(itemId) {
  const m = budgetData(dev()).materials.find(
    x => x.id === itemId
  );

  if (!m) return;

  const result = prompt(
    "Actual unit price ($). Leave blank if not purchased:",
    m.actualUnitPrice
  );

  if (result === null) return;

  if (result.trim() === "") {
    m.actualUnitPrice = "";
  } else {
    const value = Number(result);

    if (!Number.isFinite(value) || value < 0) {
      return alert("Enter a valid price.");
    }

    m.actualUnitPrice = value;
  }

  save();
  render();
}

function budgetDeleteMaterial(itemId) {
  if (!confirm("Delete this material?")) return;

  const b = budgetData(dev());

  b.materials = b.materials.filter(
    x => x.id !== itemId
  );

  save();
  render();
}

function budgetAddPayment(ev) {
  ev.preventDefault();

  const d = dev();
  const b = budgetData(d);
  const f = ev.target;

  const amount = Number(
    budgetFormValue(f, "amount")
  );

  if (!Number.isFinite(amount) || amount <= 0) {
    return alert("Enter a payment greater than zero.");
  }

  const parcelId = budgetFormValue(f, "parcelId");
  const jobId = budgetFormValue(f, "jobId");

  const matchingParcel = d.parcels.find(
    p => p.jobs.some(j => j.id === jobId)
  );

  if (
    matchingParcel &&
    parcelId &&
    matchingParcel.id !== parcelId
  ) {
    return alert(
      "The selected trade belongs to a different parcel."
    );
  }

  b.payments.push({
    id: budgetItemId(),
    description: budgetFormValue(f, "description"),
    amount,
    paymentDate: budgetFormValue(f, "paymentDate"),
    paymentType: budgetFormValue(f, "paymentType"),
    parcelId: parcelId || matchingParcel?.id || "",
    jobId,
    payee: budgetFormValue(f, "payee"),
    reference: budgetFormValue(f, "reference"),
    notes: budgetFormValue(f, "notes")
  });

  save();
  render();
}

function budgetDeletePayment(paymentId) {
  if (!confirm(
    "Delete this payment record? This changes paid-to-date totals."
  )) return;

  const b = budgetData(dev());

  b.payments = b.payments.filter(
    p => p.id !== paymentId
  );

  save();
  render();
}

/* ---------- OPTIONAL PARCEL SALE PRICE & PROFIT ---------- */

function budgetProfitHTML(d) {
  const b = budgetData(d);

  return `
    <div class="card">
      <h2>Projected Parcel Profit</h2>

      <p class="sub">
        Sale prices are optional. A7 subtracts the
        projected parcel cost from the expected sale price.
      </p>

      ${d.parcels.map(p => {
        const sale = b.salePrices[p.id];
        const cost = budgetParcelForecast(d, p);
        const hasSale =
          sale !== undefined &&
          sale !== null &&
          sale !== "";

        const profit = hasSale
          ? budgetPositive(sale) - cost
          : null;

        return `
          <div class="item">
            <h3>${e(p.name)}</h3>

            <form onsubmit="
              budgetSaveSalePrice(event,'${p.id}')
            ">
              ${inp(
                "salePrice",
                "Expected Sale Price ($)",
                "number",
                hasSale ? sale : "",
                "min='0' step='0.01' placeholder='Optional'"
              )}

              <button class="btn secondary small">
                Save Sale Price
              </button>
            </form>

            ${row(
              "Allocated shared costs",
              budgetMoney(budgetSharedPerParcel(d))
            )}

            ${row(
              "Direct construction & materials",
              budgetMoney(budgetParcelDirect(d, p))
            )}

            ${row(
              "Projected parcel cost",
              budgetMoney(cost)
            )}

            ${row(
              "Expected sale price",
              hasSale
                ? budgetMoney(sale)
                : "Not entered"
            )}

            ${row(
              "Projected profit",
              profit === null
                ? "Not calculated"
                : budgetMoney(profit)
            )}
          </div>
        `;
      }).join("")}

      <div class="notice warning">
        Projected profit is a planning estimate, not
        guaranteed profit. Include relevant financing,
        carrying, selling, tax, and other costs in the
        budget for a more complete projection.
      </div>
    </div>
  `;
}

function budgetSaveSalePrice(ev, parcelId) {
  ev.preventDefault();

  const b = budgetData(dev());
  const raw = budgetFormValue(
    ev.target,
    "salePrice"
  );

  if (raw === "") {
    delete b.salePrices[parcelId];
  } else {
    const price = Number(raw);

    if (!Number.isFinite(price) || price < 0) {
      return alert("Enter a valid sale price.");
    }

    b.salePrices[parcelId] = price;
  }

  save();
  render();
}

/* ---------- INCLUDE V25 DATA IN EXISTING BACKUPS ---------- */

/*
  V25 budget data is stored directly inside each development,
  so V24's existing JSON export already includes it.

  The existing export labels its backup "a7-v24".
  This wrapper changes that label to "a7-v25" while preserving
  the same export implementation and file attachments.
*/

const v24ExportBackup = exportBackup;

exportBackup = async function () {
  /*
    Keep the original V24 export implementation unchanged.
    Its state payload includes budgetV25 automatically.
    The resulting backup is still labeled a7-v24 for
    compatibility with V24's importer.
  */
  return v24ExportBackup();
};
