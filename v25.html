
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>A7 Superintendent — V25</title>
<style>
:root{
  --navy:#17304d;--blue:#1768b5;--pale:#edf5ff;--bg:#f4f7fb;
  --line:#dce5ef;--muted:#68798b;--green:#18734b;--red:#b83e3e
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--bg);color:#25364a;
  font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif
}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
button:disabled{opacity:.45;cursor:not-allowed}
header{
  position:sticky;top:0;z-index:10;background:#fff;
  border-bottom:1px solid var(--line);padding:15px 18px;
  display:flex;justify-content:space-between;align-items:center
}
.brand{font-weight:850;color:var(--navy);letter-spacing:-.4px}
.brand small{display:block;color:var(--blue);font-size:10px;letter-spacing:1.2px}
nav{
  display:flex;overflow:auto;gap:5px;background:#fff;padding:8px;
  border-bottom:1px solid var(--line);scrollbar-width:none
}
nav::-webkit-scrollbar{display:none}
nav button{
  border:0;background:transparent;color:var(--muted);padding:10px 12px;
  border-radius:8px;white-space:nowrap;font-weight:700;font-size:13px
}
nav button.active{background:var(--pale);color:var(--blue)}
main{max-width:1100px;margin:auto;padding:20px 14px 100px}
h1,h2,h3{color:var(--navy);letter-spacing:-.35px}
h1{font-size:24px;margin:0 0 5px}
h2{font-size:18px;margin:0 0 12px}
h3{font-size:15px;margin:0 0 9px}
p{margin:0 0 12px}
.sub,.help{color:var(--muted);font-size:13px}
.help{font-size:12px;margin-top:5px}
.head{
  display:flex;justify-content:space-between;align-items:flex-start;
  gap:12px;flex-wrap:wrap;margin-bottom:18px
}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.grid.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.card,.stat{
  background:#fff;border:1px solid var(--line);border-radius:12px;
  padding:17px;min-width:0;margin-bottom:13px
}
.stat .label{font-size:12px;font-weight:700;color:var(--muted)}
.stat .value{
  font-size:23px;font-weight:800;color:var(--navy);
  margin-top:6px;overflow-wrap:anywhere
}
.section{margin-top:22px}
.btn{
  display:inline-flex;align-items:center;justify-content:center;
  text-decoration:none;background:var(--blue);color:#fff;
  border:1px solid var(--blue);border-radius:8px;padding:10px 14px;
  min-height:41px;font-weight:750;font-size:13px
}
.btn.secondary{background:#fff;color:var(--blue);border-color:#c4d8ee}
.btn.danger{background:#fff;color:var(--red);border-color:#eac6c6}
.btn.call{background:var(--green);border-color:var(--green)}
.btn.text{background:#fff;border-color:#a9c9eb;color:var(--blue)}
.btn.small{min-height:34px;padding:7px 10px;font-size:12px}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.item{border-top:1px solid var(--line);padding:14px 0}
.item:first-child{border-top:0;padding-top:0}
.item:last-child{padding-bottom:0}
.itemhead{
  display:flex;justify-content:space-between;align-items:flex-start;
  gap:12px;flex-wrap:wrap
}
.itemtitle{font-weight:800;color:var(--navy)}
.meta{font-size:12px;color:var(--muted);margin-top:4px}
.row{
  display:flex;justify-content:space-between;gap:12px;
  border-bottom:1px solid #edf1f6;padding:9px 0
}
.row:last-child{border-bottom:0}
.row>:last-child{text-align:right}
.money{font-weight:800;color:var(--navy);font-variant-numeric:tabular-nums}
label{
  display:block;color:var(--navy);font-size:12px;
  font-weight:800;margin:0 0 6px
}
.field{margin-bottom:14px;min-width:0}
input,select,textarea{
  width:100%;background:#fff;color:#25364a;
  border:1px solid #cbd7e5;border-radius:8px;
  padding:10px 11px;min-height:42px
}
textarea{min-height:100px;resize:vertical}
.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 13px}
.notice{
  background:var(--pale);border:1px solid #c8dcef;
  border-radius:9px;padding:12px 13px;font-size:13px;margin:12px 0
}
.warning{background:#fff8e9;border-color:#ead9ae}
.tabs{display:flex;gap:7px;overflow:auto;margin:16px 0;scrollbar-width:none}
.tabs button{
  background:#fff;border:1px solid var(--line);border-radius:8px;
  padding:9px 12px;white-space:nowrap;color:var(--muted);
  font-weight:700;font-size:12px
}
.tabs button.active{color:var(--blue);background:var(--pale);border-color:var(--blue)}
.badge{
  display:inline-block;border-radius:20px;background:#edf1f6;
  color:#50657d;padding:4px 9px;font-size:11px;font-weight:800
}
.badge.blue{background:var(--pale);color:var(--blue)}
.badge.green{background:#e7f5ed;color:var(--green)}
hr{border:0;border-top:1px solid var(--line);margin:20px 0}
.empty{text-align:center;color:var(--muted);padding:28px 10px}
.empty strong{display:block;color:var(--navy)}
.file{
  border:1px solid var(--line);border-radius:8px;padding:10px;
  display:flex;justify-content:space-between;gap:10px;
  align-items:center;margin:7px 0;overflow-wrap:anywhere
}
.bubble{
  padding:12px;border-radius:9px;background:#f0f4f9;
  white-space:pre-wrap;margin:8px 0;font-size:13px
}
.bubble.me{background:var(--pale);margin-left:20px}
.segment{
  display:flex;gap:3px;padding:4px;background:#edf2f8;
  border-radius:11px;margin:13px 0
}
.segment button{
  flex:1;border:0;background:transparent;color:var(--muted);
  border-radius:8px;padding:10px 6px;font-size:12px;font-weight:800
}
.segment button.active{
  background:#fff;color:var(--blue);
  box-shadow:0 1px 5px #17304d18
}
.measure-section{
  border:1px solid var(--line);border-radius:12px;
  padding:14px;margin:12px 0;background:#fff
}
.measure-grid{
  display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px
}
.measure-field{min-width:0}
.measure-control{
  display:flex;align-items:center;gap:5px;
  border:1px solid #cbd7e5;border-radius:11px;
  background:#fff;padding:4px 5px 4px 10px;min-height:47px
}
.measure-control input{
  border:0;outline:0;min-height:35px;padding:4px 0;
  width:100%;min-width:0;font-size:18px;font-weight:750;color:var(--navy)
}
.measure-unit{font-size:12px;color:var(--muted);font-weight:700}
.wheel-trigger{
  flex:0 0 36px;width:36px;height:36px;border:0;border-radius:8px;
  background:#eef4fb;color:var(--blue);font-size:18px;font-weight:700
}
.measure-result{
  display:flex;justify-content:space-between;align-items:center;
  gap:10px;background:#f4f8fd;border-radius:9px;
  padding:11px 12px;margin-top:10px
}
.measure-result strong{color:var(--green);font-size:18px}
.measure-result small{display:block;color:var(--muted);font-size:11px}
.total-result{
  background:#edf7f1;border:1px solid #d1e9da;
  border-radius:10px;padding:13px;margin-top:12px
}
.total-result strong{font-size:21px;color:var(--green)}
.layout{
  background:#e3f1e8;border:1px solid #9dc8aa;border-radius:10px;
  padding:16px;text-align:center;color:#276444
}
.layout-inner{
  background:#d2e7ff;border:2px solid var(--blue);
  border-radius:8px;padding:22px 8px;margin:15px auto;
  max-width:72%;color:var(--navy);font-weight:800
}
.wheel-backdrop{
  position:fixed;inset:0;background:#12263e70;z-index:50;
  display:flex;align-items:flex-end;justify-content:center
}
.wheel-sheet{
  background:#fff;width:100%;max-width:430px;
  border-radius:18px 18px 0 0;
  padding:12px 16px calc(16px + env(safe-area-inset-bottom))
}
.wheel-top{
  display:flex;justify-content:space-between;align-items:center;
  gap:10px;padding-bottom:12px
}
.wheel-top strong{color:var(--navy)}
.wheel-done{
  border:0;background:transparent;color:var(--blue);
  font-size:15px;font-weight:800;padding:8px
}
.wheel-frame{position:relative}
.wheel-window{
  height:220px;overflow-y:auto;overscroll-behavior:contain;
  scroll-snap-type:y mandatory;scrollbar-width:none;
  -webkit-overflow-scrolling:touch;border-radius:12px;background:#f7f9fc
}
.wheel-window::-webkit-scrollbar{display:none}
.wheel-option{
  height:44px;display:flex;align-items:center;justify-content:center;
  scroll-snap-align:center;font-size:20px;color:#78899b;
  font-variant-numeric:tabular-nums;user-select:none
}
.wheel-option.selected{color:var(--navy);font-size:23px;font-weight:800}
.wheel-spacer{height:88px}
.wheel-selection{
  position:absolute;left:0;right:0;top:88px;height:44px;
  border-top:1px solid #c9d9ea;border-bottom:1px solid #c9d9ea;
  background:#e7f1fd66;pointer-events:none
}
.wheel-hint{text-align:center;color:var(--muted);font-size:12px;margin-top:10px}
@media(max-width:700px){
  .grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .grid.two,.fields{grid-template-columns:1fr}
  .stat .value{font-size:19px}
  .card,.stat{padding:14px}
  h1{font-size:22px}
}
@media(min-width:600px){
  .wheel-backdrop{align-items:center;padding:20px}
  .wheel-sheet{border-radius:18px;padding-bottom:16px}
}
</style>
</head>
<body>
<header>
  <div class="brand">
    A7 SUPERINTENDENT
    <small>DEVELOPMENT MANAGEMENT</small>
  </div>
  <span class="sub">V25</span>
</header>
<nav id="nav"></nav>
<main id="app"></main>
<div id="wheelRoot"></div>

<script>
"use strict";

/* V25 shares V24 browser records and file storage. */
const KEY="a7-superintendent-v21";
const DB="a7-superintendent-v21-files";
const SQFT_PER_ACRE=43560;
const WHEEL_MAX=2500;

const TRADES=[
  "Land Clearing","Entrance & Culvert","Driveway","Home Pad",
  "Water","Electrical","Manufactured Home","Home Transport",
  "Home Setup","Septic","Skirting","Decks & Steps","HVAC","Other"
];

const HOME_TRADES=[
  "Manufactured Home","Home Transport","Home Setup",
  "Skirting","Decks & Steps","HVAC"
];

const FRACTIONS=[
  ["0.125","⅛ acre"],["0.25","¼ acre"],
  ["0.3333333333333333","⅓ acre"],["0.5","½ acre"],
  ["0.6666666666666666","⅔ acre"],["0.75","¾ acre"],
  ["1","1 acre"],["1.25","1¼ acres"],["1.5","1½ acres"],
  ["1.75","1¾ acres"],["2","2 acres"]
];

const EMPTY={
  developments:[],contractors:[],bids:[],messages:[],
  activeDevelopment:null,activeParcel:null,activeJob:null
};

let state=load();
let page="dashboard";
let tab="overview";
let jobTab="details";
let budgetTab="overview";
let editingContractor=null;
let db=null;
let activeWheel=null;
let wheelScrollTimer=null;
let clearingMode="acres";
let acreageEntryMode="fraction";
let clearingDraft=null;
let customAcreFields={clearAcres:false,brushAcres:false};

/* HELPERS */

function clone(x){return JSON.parse(JSON.stringify(x));}

function load(){
  try{
    const x=JSON.parse(localStorage.getItem(KEY));
    return x&&typeof x==="object"
      ?{...clone(EMPTY),...x}
      :clone(EMPTY);
  }catch{return clone(EMPTY);}
}

function save(){
  try{
    localStorage.setItem(KEY,JSON.stringify(state));
    return true;
  }catch{
    alert("Unable to save browser data. Export a backup and check storage.");
    return false;
  }
}

function id(){
  return typeof crypto!=="undefined"&&crypto.randomUUID
    ?crypto.randomUUID()
    :Date.now().toString(36)+Math.random().toString(36).slice(2);
}

function e(x){
  return String(x??"").replace(/[&<>"']/g,c=>({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  })[c]);
}

function n(x){
  const v=Number(x);
  return Number.isFinite(v)?v:0;
}

function positive(x){return Math.max(0,n(x));}

function usd(x){
  return new Intl.NumberFormat("en-US",{
    style:"currency",currency:"USD"
  }).format(n(x));
}

function fmt(x,d=2){
  return n(x).toLocaleString("en-US",{maximumFractionDigits:d});
}

function acres(sf){return (sf/SQFT_PER_ACRE).toFixed(4);}

function date(){
  const d=new Date();
  return [
    d.getFullYear(),
    String(d.getMonth()+1).padStart(2,"0"),
    String(d.getDate()).padStart(2,"0")
  ].join("-");
}

function dev(){
  return state.developments.find(x=>x.id===state.activeDevelopment);
}

function parcel(){
  return dev()?.parcels.find(x=>x.id===state.activeParcel);
}

function job(){
  return parcel()?.jobs.find(x=>x.id===state.activeJob);
}

function contractor(cid){
  return state.contractors.find(x=>x.id===cid);
}

function jobs(d){return d.parcels.flatMap(p=>p.jobs);}

function land(d){
  return d.parcels.length?n(d.purchasePrice)/d.parcels.length:0;
}

function bidsFor(j){
  return state.bids.filter(b=>b.jobId===j.id);
}

function allFiles(){
  return state.developments.flatMap(d=>[
    ...(d.files||[]),
    ...d.parcels.flatMap(p=>p.jobs.flatMap(j=>j.files||[]))
  ]);
}

function go(p){
  closeWheel();
  page=p;
  window.scrollTo(0,0);
  render();
}

function openDev(x){
  state.activeDevelopment=x;
  state.activeParcel=null;
  state.activeJob=null;
  tab="overview";
  budgetTab="overview";
  save();
  go("development");
}

function openParcel(x){
  state.activeParcel=x;
  state.activeJob=null;
  tab="overview";
  save();
  go("parcel");
}

function openJob(x){
  state.activeJob=x;
  jobTab="details";
  clearingDraft=null;
  customAcreFields={clearAcres:false,brushAcres:false};
  save();
  go("job");
}

function head(title,sub="",action=""){
  return `<div class="head"><div><h1>${e(title)}</h1>
    <div class="sub">${e(sub)}</div></div>${action}</div>`;
}

function btn(label,action,kind=""){
  return `<button type="button" class="btn ${kind}"
    onclick="${action}">${e(label)}</button>`;
}

function stat(label,value,note=""){
  return `<div class="stat"><div class="label">${e(label)}</div>
    <div class="value">${e(value)}</div>
    <div class="meta">${e(note)}</div></div>`;
}

function row(label,value){
  return `<div class="row"><span class="sub">${e(label)}</span>
    <strong>${e(value)}</strong></div>`;
}

function inp(name,label,type="text",value="",extra=""){
  return `<div class="field">
    <label for="${e(name)}">${e(label)}</label>
    <input id="${e(name)}" name="${e(name)}" type="${type}"
      value="${e(value)}" ${extra}>
  </div>`;
}

function area(name,label,value=""){
  return `<div class="field">
    <label for="${e(name)}">${e(label)}</label>
    <textarea id="${e(name)}" name="${e(name)}">${e(value)}</textarea>
  </div>`;
}

function sel(name,label,options,value="",extra=""){
  return `<div class="field">
    <label for="${e(name)}">${e(label)}</label>
    <select id="${e(name)}" name="${e(name)}" ${extra}>
      ${options.map(o=>{
        const v=Array.isArray(o)?o[0]:o;
        const t=Array.isArray(o)?o[1]:o;
        return `<option value="${e(v)}"
          ${String(v)===String(value)?"selected":""}>${e(t)}</option>`;
      }).join("")}
    </select>
  </div>`;
}

function val(f,k){
  return f.elements.namedItem(k)?.value?.trim()||"";
}

function empty(title,description){
  return `<div class="empty"><strong>${e(title)}</strong>
    ${e(description)}</div>`;
}

function badge(j){
  const t={
    approved:["Approved","green"],
    submitted:["Awaiting approval","blue"],
    in_progress:["In progress","blue"],
    ready:["Ready","blue"],
    locked:["Locked",""]
  }[j.status]||["Ready","blue"];
  return `<span class="badge ${t[1]}">${t[0]}</span>`;
}

function validAmount(raw,allowZero=true){
  if(String(raw).trim()==="")return false;
  const v=Number(raw);
  return Number.isFinite(v)&&(allowZero?v>=0:v>0);
}

/* CONTRACTOR PHONE LINKS */

function phoneLinkNumber(phone){
  const raw=String(phone||"").trim();
  const digits=raw.replace(/\D/g,"");
  if(digits.length<7||digits.length>15)return "";
  return (raw.startsWith("+")?"+":"")+digits;
}

function contactButtons(c){
  if(!c)return "";
  const number=phoneLinkNumber(c.phone);
  if(!number)return "";
  return `<div class="actions">
    <a class="btn call small" href="tel:${e(number)}">☎ Call</a>
    <a class="btn text small" href="sms:${e(number)}">✉ Text</a>
  </div>`;
}

function assignedContractorCard(j){
  const c=contractor(j.contractorId);
  if(!c)return `<div class="notice">No contractor assigned yet.</div>`;
  return `<div class="notice">
    <strong>Assigned Contractor: ${e(c.name)}</strong>
    ${c.company?`<div class="meta">${e(c.company)}</div>`:""}
    ${c.phone?`<div class="meta">Phone: ${e(c.phone)}</div>`:""}
    ${c.email?`<div class="meta">Email: ${e(c.email)}</div>`:""}
    ${contactButtons(c)}
  </div>`;
}

/* PROJECT STRUCTURE */

function makeJobs(){
  return TRADES.map((trade,i)=>({
    id:id(),trade,status:i?"locked":"ready",
    contractorId:"",contractorName:"",
    scope:"",notes:"",clearingAreas:[],files:[],approvedAt:""
  }));
}

function makeParcel(i){
  return {
    id:id(),name:`Parcel ${i+1}`,acreage:"",
    notes:"",jobs:makeJobs()
  };
}

/* V25 BUDGET DATA */

function budget(d){
  if(!d.budgetV25||typeof d.budgetV25!=="object"){
    d.budgetV25={
      coverage:"land",target:0,contingency:0,
      shared:[],trades:{},materials:[],payments:[],
      salePrices:{},sellingCosts:{},adjustments:{}
    };
  }
  const b=d.budgetV25;
  b.coverage||="land";
  b.shared||=[];
  b.trades||={};
  b.materials||=[];
  b.payments||=[];
  b.salePrices||={};
  b.sellingCosts||={};
  b.adjustments||={};
  return b;
}

function tradeKey(p,j){return p.id+"::"+j.id;}

function tradeBudget(d,p,j){
  return positive(budget(d).trades[tradeKey(p,j)]);
}

function acceptedBid(j){
  return state.bids.find(b=>
    b.jobId===j.id&&b.acceptedV25===true
  )||null;
}

function tradeForecast(d,p,j){
  const b=budget(d);
  const accepted=acceptedBid(j);
  const base=accepted?positive(accepted.amount):tradeBudget(d,p,j);
  return Math.max(0,base+n(b.adjustments[tradeKey(p,j)]));
}

function materialEstimated(m){
  return positive(m.quantity)*positive(m.estimatedUnitPrice);
}

function materialActual(m){
  if(m.actualUnitPrice===""||
     m.actualUnitPrice===null||
     m.actualUnitPrice===undefined)return null;
  return positive(m.quantity)*positive(m.actualUnitPrice);
}

function materialForecast(m){
  return materialActual(m)??materialEstimated(m);
}

function materialCost(d,parcelId=null){
  return budget(d).materials
    .filter(m=>parcelId===null||m.parcelId===parcelId)
    .reduce((s,m)=>s+materialForecast(m),0);
}

function sharedCost(d){
  return positive(d.purchasePrice)+budget(d).shared.reduce(
    (s,x)=>s+positive(x.amount),0
  );
}

function sharedPerParcel(d){
  return d.parcels.length?sharedCost(d)/d.parcels.length:0;
}

function parcelDirect(d,p){
  return p.jobs.reduce((s,j)=>s+tradeForecast(d,p,j),0)
    +materialCost(d,p.id);
}

function parcelForecast(d,p){
  return sharedPerParcel(d)+parcelDirect(d,p);
}

function developmentForecast(d){
  return sharedCost(d)+
    d.parcels.reduce((s,p)=>s+parcelDirect(d,p),0);
}

function paymentTotal(d,parcelId=null,jobId=null){
  return budget(d).payments.filter(x=>
    (parcelId===null||x.parcelId===parcelId)&&
    (jobId===null||x.jobId===jobId)
  ).reduce((s,x)=>s+positive(x.amount),0);
}

function costToFinish(d){
  return Math.max(0,developmentForecast(d)-paymentTotal(d));
}

function targetTotal(d){
  const b=budget(d);
  return positive(b.target)+positive(b.contingency);
}

function budgetDifference(d){
  return targetTotal(d)-developmentForecast(d);
}

function allocatedBudget(d){
  const b=budget(d);
  return sharedCost(d)+
    d.parcels.reduce((s,p)=>
      s+p.jobs.reduce((t,j)=>t+tradeBudget(d,p,j),0),0
    )+
    b.materials.reduce((s,m)=>s+materialEstimated(m),0);
}

function parcelOptions(d,includeShared=true){
  return [
    ...(includeShared?[["","Shared / development-wide"]]:[]),
    ...d.parcels.map(p=>[p.id,p.name])
  ];
}

function jobOptions(d,parcelId=""){
  const ps=parcelId
    ?d.parcels.filter(p=>p.id===parcelId)
    :d.parcels;
  return [
    ["","No specific trade"],
    ...ps.flatMap(p=>p.jobs.map(j=>[
      j.id,p.name+" · "+j.trade
    ]))
  ];
}

function findJobInDevelopment(d,jobId){
  for(const p of d.parcels){
    const j=p.jobs.find(x=>x.id===jobId);
    if(j)return {p,j};
  }
  return null;
}

function assignmentFromForm(d,f){
  const jobId=val(f,"jobId");
  let parcelId=val(f,"parcelId");
  if(jobId){
    const match=findJobInDevelopment(d,jobId);
    if(!match)return null;
    if(parcelId&&parcelId!==match.p.id)return null;
    parcelId=match.p.id;
  }
  if(parcelId&&!d.parcels.some(p=>p.id===parcelId))return null;
  return {parcelId,jobId};
}

function saveTradeBudget(ev,parcelId,jobId){
  ev.preventDefault();
  const d=dev(),p=d.parcels.find(x=>x.id===parcelId);
  const j=p?.jobs.find(x=>x.id===jobId);
  if(!j)return;

  const f=ev.target;
  if(!validAmount(val(f,"tradeBudget"))||
     !Number.isFinite(Number(val(f,"adjustment"))))
    return alert("Enter valid trade amounts.");

  const b=budget(d),key=tradeKey(p,j);
  b.trades[key]=n(val(f,"tradeBudget"));
  b.adjustments[key]=n(val(f,"adjustment"));
  save();render();
}

function acceptBudgetBid(bidId){
  const bid=state.bids.find(x=>x.id===bidId);
  if(!bid)return;
  if(!confirm(
    "Accept this bid for budgeting? Other bids for this trade " +
    "will remain recorded but will not be counted."
  ))return;

  state.bids.forEach(x=>{
    if(x.jobId===bid.jobId)x.acceptedV25=false;
  });
  bid.acceptedV25=true;
  save();render();
}

function unacceptBudgetBid(bidId){
  const bid=state.bids.find(x=>x.id===bidId);
  if(!bid)return;
  if(!confirm("Remove this bid's accepted status?"))return;
  bid.acceptedV25=false;
  save();render();
}

/* V24 CLEARING MATH */

function getLayout(j){return j.clearingLayout||null;}

function squareLayout(clearAcres,brushAcres){
  const inner=clearAcres*SQFT_PER_ACRE;
  const outer=(clearAcres+brushAcres)*SQFT_PER_ACRE;
  const innerSide=Math.sqrt(inner);
  const outerSide=Math.sqrt(outer);

  return {
    mode:"acres",clearAcres,brushAcres,
    innerLength:innerSide,innerWidth:innerSide,
    outerLength:outerSide,outerWidth:outerSide,
    centered:true
  };
}

function clearingNumbers(x){
  const il=n(x?.innerLength),iw=n(x?.innerWidth);
  const ol=n(x?.outerLength),ow=n(x?.outerWidth);
  const inner=il*iw,outer=ol*ow;
  return {
    il,iw,ol,ow,inner,outer,
    brush:Math.max(0,outer-inner),
    endBand:(ol-il)/2,sideBand:(ow-iw)/2
  };
}

function layoutValid(x){
  if(!x)return false;
  const z=clearingNumbers(x);
  return [z.il,z.iw,z.ol,z.ow].every(v=>
    Number.isFinite(v)&&v>0&&v<=WHEEL_MAX
  )&&z.ol>=z.il&&z.ow>=z.iw&&z.outer>z.inner;
}

function clearingScope(j){
  const x=getLayout(j);
  if(!layoutValid(x))return "";
  const z=clearingNumbers(x);

  const lines=[
    "LAND CLEARING — CONTRACTOR SCOPE OF WORK",
    `Development: ${dev()?.name||""}`,
    `Parcel: ${parcel()?.name||""}`,
    "",
    "1. COMPLETE CLEARING",
    `Area: ${acres(z.inner)} acres (${fmt(z.inner)} square feet).`,
    `Approximate depth: ${fmt(z.il)} feet.`,
    `Approximate width: ${fmt(z.iw)} feet.`,
    "Remove designated trees and underbrush inside this area.",
    "",
    "2. ADDITIONAL UNDERBRUSH ONLY",
    `Area: ${acres(z.brush)} acres (${fmt(z.brush)} square feet).`,
    "This is additional ground outside the complete-clearing area.",
    "Remove underbrush in this surrounding area.",
    "Retain trees unless separately marked for removal.",
    "",
    "3. OVERALL FOOTPRINT",
    `Total: ${acres(z.outer)} acres (${fmt(z.outer)} square feet).`,
    `Approximate outer depth: ${fmt(z.ol)} feet.`,
    `Approximate outer width: ${fmt(z.ow)} feet.`,
    "Do not count the complete-clearing area twice."
  ];

  if(x.centered){
    lines.push(
      "","4. APPROXIMATE UNDERBRUSH BAND",
      `Beyond each end: ${fmt(z.endBand)} feet.`,
      `Beyond each side: ${fmt(z.sideBand)} feet.`
    );
  }else{
    lines.push(
      "","4. POSITION",
      "Position the inner clearing area as marked on site.",
      "Equal offsets are not assumed."
    );
  }

  if(x.mode==="acres"){
    lines.push(
      "","LAYOUT ASSUMPTION",
      "Dimensions are calculated for a centered square layout.",
      "Confirm actual field dimensions before construction."
    );
  }

  if(x.notes)lines.push("","SITE NOTES: "+x.notes);

  lines.push(
    "",
    "Verify boundaries, utilities, access, measurements, debris",
    "disposal, and applicable permits before pricing or starting."
  );

  return lines.join("\n");
}

/* CLEARING PLANNER */

function startClearingDraft(){
  if(clearingDraft)return;
  const x=getLayout(job());

  if(x?.mode==="acres"){
    clearingMode="acres";
    clearingDraft={
      clearAcres:String(x.clearAcres??(
        n(x.innerLength)*n(x.innerWidth)/SQFT_PER_ACRE
      )),
      brushAcres:String(x.brushAcres??(
        Math.max(0,
          n(x.outerLength)*n(x.outerWidth)-
          n(x.innerLength)*n(x.innerWidth)
        )/SQFT_PER_ACRE
      )),
      innerLength:String(x.innerLength),
      innerWidth:String(x.innerWidth),
      outerLength:String(x.outerLength),
      outerWidth:String(x.outerWidth),
      centered:x.centered!==false,notes:x.notes||""
    };
  }else if(x){
    clearingMode="feet";
    const z=clearingNumbers(x);
    clearingDraft={
      clearAcres:String(z.inner/SQFT_PER_ACRE),
      brushAcres:String(z.brush/SQFT_PER_ACRE),
      innerLength:String(z.il),innerWidth:String(z.iw),
      outerLength:String(z.ol),outerWidth:String(z.ow),
      centered:x.centered!==false,notes:x.notes||""
    };
  }else{
    clearingMode="acres";
    clearingDraft={
      clearAcres:"0.25",brushAcres:"0.25",
      innerLength:"0",innerWidth:"0",
      outerLength:"0",outerWidth:"0",
      centered:true,notes:""
    };
  }
}

function readClearingDraft(){
  if(!clearingDraft)return;

  if(clearingMode==="acres"){
    for(const key of ["clearAcres","brushAcres"]){
      const custom=document.getElementById(key+"Custom");
      const el=document.getElementById(key);
      if(custom)clearingDraft[key]=custom.value;
      else if(el)clearingDraft[key]=el.value;
    }
  }else{
    for(const key of [
      "innerLength","innerWidth","outerLength","outerWidth"
    ]){
      const el=document.getElementById(key);
      if(el)clearingDraft[key]=el.value;
    }
    const centered=document.getElementById("centered");
    if(centered)clearingDraft.centered=centered.value==="yes";
  }

  const notes=document.getElementById("layoutNotes");
  if(notes)clearingDraft.notes=notes.value;
}

function changeClearingMode(mode){
  readClearingDraft();

  if(mode==="feet"&&clearingMode==="acres"){
    const c=Number(clearingDraft.clearAcres);
    const b=Number(clearingDraft.brushAcres);
    if(Number.isFinite(c)&&Number.isFinite(b)&&c>0&&b>0){
      const x=squareLayout(c,b);
      clearingDraft.innerLength=String(x.innerLength);
      clearingDraft.innerWidth=String(x.innerWidth);
      clearingDraft.outerLength=String(x.outerLength);
      clearingDraft.outerWidth=String(x.outerWidth);
    }
  }

  if(mode==="acres"&&clearingMode==="feet"){
    const z=clearingNumbers(clearingDraft);
    clearingDraft.clearAcres=String(z.inner/SQFT_PER_ACRE);
    clearingDraft.brushAcres=String(z.brush/SQFT_PER_ACRE);
  }

  clearingMode=mode;
  render();
}

function changeAcreageEntryMode(mode){
  readClearingDraft();
  acreageEntryMode=mode;
  render();
}

function fractionField(key,label){
  const current=String(clearingDraft[key]??"");

  customAcreFields[key]=false;
  clearingDraft[key]=value;
  render();
}

  clearingDraft[key]=value;

function clearingPreviewHTML(x,mode){
  let layout;

  if(mode==="acres"){
    const c=Number(x.clearAcres),b=Number(x.brushAcres);
    if(
      x.clearAcres===""||x.brushAcres===""||
      !Number.isFinite(c)||!Number.isFinite(b)||c<=0||b<=0
    ){
      return `<div class="notice warning">
        Enter a positive acreage for complete clearing and
        additional underbrush.
      </div>`;
    }

    layout=squareLayout(c,b);
    if(!layoutValid(layout)){
      return `<div class="notice warning">
        This square layout exceeds the 2,500-foot measurement
        limit. Enter smaller areas or use a separate site plan.
      </div>`;
    }
  }else{
    const keys=[
      "innerLength","innerWidth","outerLength","outerWidth"
    ];
    const values=keys.map(k=>Number(x[k]));
    if(
      keys.some(k=>x[k]==="")||
      values.some(v=>!Number.isInteger(v)||v<0||v>WHEEL_MAX)
    ){
      return `<div class="notice warning">
        Enter whole-foot measurements from 0 to 2,500.
      </div>`;
    }

    layout={
      mode:"feet",
      innerLength:values[0],innerWidth:values[1],
      outerLength:values[2],outerWidth:values[3],
      centered:x.centered!==false
    };

    if(!layoutValid(layout)){
      return `<div class="notice warning">
        The outer depth and width must contain the inner area
        and create additional underbrush-only ground.
      </div>`;
    }
  }

  const z=clearingNumbers(layout);

  return `
    <div class="measure-result">
      <div>
        <strong style="font-size:13px;color:var(--navy)">
          Complete clearing
        </strong>
        <small>${fmt(z.inner)} square feet</small>
      </div>
      <strong>${acres(z.inner)} ac</strong>
    </div>

    <div class="measure-result">
      <div>
        <strong style="font-size:13px;color:var(--navy)">

function saveClearingLayout(ev){
  ev.preventDefault();

  const j=job();
  let x;

  if(clearingMode==="acres"){
    const c=Number(clearingDraft.clearAcres);
    const b=Number(clearingDraft.brushAcres);
    if(
      clearingDraft.clearAcres===""||
      clearingDraft.brushAcres===""||
      !Number.isFinite(c)||!Number.isFinite(b)||c<=0||b<=0
    )return alert(
      "Enter positive acreages for both clearing categories."
    );
    x=squareLayout(c,b);
  }else{
    const keys=[
      "innerLength","innerWidth","outerLength","outerWidth"
    ];
    if(keys.some(k=>
      clearingDraft[k]===""||
      !Number.isInteger(Number(clearingDraft[k]))
    ))return alert("Enter whole-foot measurements.");

    x={
      mode:"feet",
      innerLength:Number(clearingDraft.innerLength),
      innerWidth:Number(clearingDraft.innerWidth),
      outerLength:Number(clearingDraft.outerLength),
      outerWidth:Number(clearingDraft.outerWidth),
      centered:clearingDraft.centered
    };
  }

  x.notes=clearingDraft.notes||"";

  if(!layoutValid(x)){
    return alert(
      "The measurements must fit within 0–2,500 feet. " +
      "The outer boundary must contain a smaller inner clearing area."
    );

  if(j.scope&&!confirm(
    "Replace the current scope with the new measured clearing scope?"
  ))return;

  j.clearingLayout=x;
  j.scope=clearingScope(j);
  clearingDraft=null;
  save();render();
}

function regenerateScope(){
  const j=job();
  if(!layoutValid(getLayout(j)))return;
  if(j.scope&&!confirm(
    "Replace the current scope with the saved clearing measurements?"
  ))return;
  j.scope=clearingScope(j);
  save();render();
}

/* VERTICAL SCROLL WHEEL — 0 TO 2,500 FT */

function openWheel(fieldId,label){
  const input=document.getElementById(fieldId);
  if(!input)return;
  closeWheel();

  activeWheel={
    fieldId,label,
    selected:Math.max(0,
      Math.min(WHEEL_MAX,Math.round(n(input.value))))
  };

  document.getElementById("wheelRoot").innerHTML=`
    <div class="wheel-backdrop" id="wheelBackdrop">
      <div class="wheel-sheet" role="dialog" aria-modal="true"
        aria-label="${e(label)} number picker">
        <div class="wheel-top">
          <strong>${e(label)} · Feet</strong>
          <button type="button" class="wheel-done"
            onclick="closeWheel()">Done</button>
        </div>

        <div class="wheel-frame">
          <div class="wheel-window" id="wheelWindow"
            aria-label="Scroll vertically to select feet">
            <div class="wheel-spacer"></div>
            ${Array.from({length:WHEEL_MAX+1},(_,i)=>`
              <div class="wheel-option
                ${i===activeWheel.selected?"selected":""}"
                data-feet="${i}"
                onclick="chooseWheelNumber(${i})">
                ${i} ft
              </div>
            `).join("")}
            <div class="wheel-spacer"></div>
          </div>
          <div class="wheel-selection"></div>
        </div>

        <div class="wheel-hint">
          Swipe up or down · 0–2,500 feet
        </div>
      </div>
    </div>
  `;

  const backdrop=document.getElementById("wheelBackdrop");
  backdrop.addEventListener("click",ev=>{
    if(ev.target===backdrop)closeWheel();
  });

  const wheel=document.getElementById("wheelWindow");
  wheel.addEventListener("scroll",()=>{
    if(!activeWheel)return;
    const selected=Math.max(0,
      Math.min(WHEEL_MAX,Math.round(wheel.scrollTop/44)));
    setWheelSelection(selected);
    clearTimeout(wheelScrollTimer);
    wheelScrollTimer=setTimeout(()=>{
      if(activeWheel){
        wheel.scrollTo({
          top:activeWheel.selected*44,
          behavior:"smooth"
        });
      }
    },130);
  },{passive:true});

  requestAnimationFrame(()=>{
    if(activeWheel)wheel.scrollTop=activeWheel.selected*44;
  });
}

function setWheelSelection(number){
  if(!activeWheel)return;
  const selected=Math.max(0,
    Math.min(WHEEL_MAX,Math.round(number)));
  const previous=activeWheel.selected;
  activeWheel.selected=selected;

  const input=document.getElementById(activeWheel.fieldId);
  if(input){
    input.value=String(selected);
    previewClearing();
  }

  const wheel=document.getElementById("wheelWindow");
  if(wheel&&previous!==selected){
    wheel.querySelector(`[data-feet="${previous}"]`)
      ?.classList.remove("selected");
    wheel.querySelector(`[data-feet="${selected}"]`)
      ?.classList.add("selected");
  }
}

function chooseWheelNumber(number){
  if(!activeWheel)return;
  setWheelSelection(number);
  document.getElementById("wheelWindow")?.scrollTo({
    top:activeWheel.selected*44,
    behavior:"smooth"
  });
}

function closeWheel(){
  clearTimeout(wheelScrollTimer);
  activeWheel=null;
  const root=document.getElementById("wheelRoot");
  if(root)root.innerHTML="";
}

          ?"Photo requirements met."
          :"Upload at least three before, three during, and three after photos before approval."}
      </div>

      <div class="actions">
        <button class="btn secondary"
          ${j.status==="locked"?"disabled":""}
          onclick="changeStatus('in_progress')">
          Mark In Progress
        </button>
        <button class="btn secondary"
          ${j.status==="locked"?"disabled":""}
          onclick="changeStatus('submitted')">
          Submit for Approval
        </button>
        <button class="btn"
          ${j.status==="locked"||!ready?"disabled":""}
          onclick="approve()">
          Approve & Unlock Next Stage
        </button>
      </div>
    `}

    <p class="help">
      This is a local owner approval record,
      not a verified electronic signature.
    </p>
  </div>`;
}

function changeStatus(s){
  const j=job();
  if(j.status==="locked"||j.status==="approved")return;
  j.status=s;
  save();render();
}

function approve(){
  const j=job(),p=parcel();
  if(j.status==="locked"||j.status==="approved")return;

  if(["before","during","after"].some(
    k=>(j.files||[]).filter(f=>f.category===k).length<3
  ))return alert("Upload all required photos first.");

  if(!confirm(
    `Approve ${j.trade} and unlock the next stage?`
  ))return;

  j.status="approved";
  j.approvedAt=date();

  const next=p.jobs[
    p.jobs.findIndex(x=>x.id===j.id)+1
  ];
  if(next&&next.status==="locked")next.status="ready";

  save();render();
}

function deleteContractor(cid){
  const c=contractor(cid);
  if(!c)return;

  const assigned=state.developments.flatMap(d=>
    d.parcels.flatMap(p=>
      p.jobs.filter(j=>j.contractorId===cid)
    )
  ).length;

  const bc=state.bids.filter(b=>b.contractorId===cid).length;

  if(!confirm(
    `Delete "${c.name}"?\n\n`+
    `${assigned} stage assignment(s) will be cleared.\n`+
    `${bc} recorded bid(s) will remain under this contractor's name.\n\n`+
    "This cannot be undone."
  ))return;

  state.developments.forEach(d=>
    d.parcels.forEach(p=>
      p.jobs.forEach(j=>{
        if(j.contractorId===cid){

          j.contractorName="";
        }
      })

  );

  state.contractors=state.contractors.filter(x=>x.id!==cid);
  save();render();
}

function ask(ev){
  ev.preventDefault();
  const q=val(ev.target,"question");
  if(!q)return;

  const s=q.toLowerCase();
  let answer;

  if(
    s.includes("budget")||
    s.includes("profit")||
    s.includes("payment")||
    s.includes("material")||
    s.includes("cost to finish")
  ){
    answer=state.developments.length
      ?state.developments.map(d=>
        `${d.name}: target ${usd(targetTotal(d))}, `+
        `projected final cost ${usd(developmentForecast(d))}, `+
        `paid ${usd(paymentTotal(d))}, `+
        `projected cost to finish ${usd(costToFinish(d))}.`
      ).join("\n")
      :"Create a development to start budgeting.";
  }else if(
    s.includes("clear")||
    s.includes("underbrush")||
    s.includes("acre")||
    s.includes("scope")||
    s.includes("feet")
  ){
    answer=
      "In Land Clearing, choose Plan by Acres to select fractions " +
      "or enter decimals. A7 calculates square footage, estimated " +
      "square dimensions, and the surrounding underbrush band. " +
      "Additional underbrush acreage is separate from completely " +
      "cleared acreage. You can also enter feet or use the " +
      "vertical 0–2,500 ft number wheels.";
  }else if(
    s.includes("call")||
    s.includes("text")||
    s.includes("phone")
  ){
    answer=
      "Open Contractors and save a phone number. Call and Text " +
      "buttons will appear in the directory and assigned stages. " +
      "You choose whether to place the call or send the message.";
  }else if(s.includes("contractor")){
    answer=state.contractors.length
      ?state.contractors.map(c=>
        `${c.name}: ${(c.trades||[]).join(", ")}`
      ).join("\n")
      :"No contractors saved yet.";
  }else if(s.includes("bid")){
    answer=
      `You have ${state.bids.length} bids received. Their submitted `+
      `amounts total ${usd(
        state.bids.reduce((a,b)=>a+n(b.amount),0)
      )}. Competing proposals are not committed costs.`;
  }else if(
    s.includes("land")||
    s.includes("parcel")||
    s.includes("property")
  ){
    answer=state.developments.length
      ?state.developments.map(d=>
        `${d.name}: ${d.parcels.length} parcels, `+
        `${usd(d.purchasePrice)} full purchase price, `+
        `${usd(land(d))} allocated per parcel.`
      ).join("\n")
      :"Create a development to begin.";
  }else{
    answer=
      "I can summarize your developments, contractors, bids, " +
      "budgets, payments, and measured land clearing scopes. " +
      "Live AI and supplier searches require a connected service.";
  }

  state.messages.push(
    {role:"user",text:q},
    {role:"assistant",text:answer}
  );
  save();render();
}

/* INDEXEDDB FILE STORAGE */

function openDB(){
  return new Promise((resolve,reject)=>{
    const r=indexedDB.open(DB,1);

    r.onupgradeneeded=()=>{
      if(!r.result.objectStoreNames.contains("files")){
        r.result.createObjectStore("files");
      }
    };

    r.onsuccess=()=>{
      db=r.result;
      resolve(db);
    };

    r.onerror=()=>reject(r.error);
  });
}

async function filePut(k,v){
  const d=db||await openDB();
  return new Promise((ok,no)=>{
    const t=d.transaction("files","readwrite");
    t.objectStore("files").put(v,k);
    t.oncomplete=ok;
    t.onerror=()=>no(t.error);
  });
}

async function fileGet(k){
  const d=db||await openDB();
  return new Promise((ok,no)=>{
    const r=d.transaction("files","readonly")
      .objectStore("files").get(k);
    r.onsuccess=()=>ok(r.result);
    r.onerror=()=>no(r.error);
  });
}

async function fileDelete(k){
  const d=db||await openDB();
  return new Promise((ok,no)=>{
    const t=d.transaction("files","readwrite");
    t.objectStore("files").delete(k);
    t.oncomplete=ok;
    t.onerror=()=>no(t.error);
  });
}

function uploader(type,owner,category){
  const documentLike=[
    "document","receipt","invoice"
  ].includes(category);

  const label={
    document:"Document / PDF",
    receipt:"Receipt",
    invoice:"Invoice"
  }[category]||
    category[0].toUpperCase()+category.slice(1)+" Photos";

  return `<div class="field">
    <label>${e(label)}</label>
    <input type="file"
      accept="${documentLike
        ?".pdf,image/*,.doc,.docx"
        :"image/*"}"
      ${documentLike?"":"multiple"}
      onchange="upload(event,'${type}','${owner}','${category}')">
  </div>`;
}

async function upload(ev,type,ownerId,category){
  const owner=type==="development"
    ?state.developments.find(d=>d.id===ownerId)
    :state.developments.flatMap(d=>
      d.parcels.flatMap(p=>p.jobs)
    ).find(j=>j.id===ownerId);

  if(!owner)return;
  owner.files||=[];

  try{
    for(const f of [...ev.target.files]){
      const k=id();
      await filePut(k,f);
      owner.files.push({
        id:k,name:f.name,type:f.type,size:f.size,
        category,date:date()
      });
    }
    save();render();
  }catch(err){
    alert("Upload failed: "+err.message);
  }
}

function filesHTML(fs){
  return fs.length?fs.map(f=>`
    <div class="file">
      <div>
        <strong>${e(f.name)}</strong>
        <div class="meta">${e(f.category)} · ${e(f.date)}</div>
      </div>
      <div class="actions">
        ${btn("View",`viewFile('${f.id}')`,"secondary small")}
        ${btn("Delete",`removeFile('${f.id}')`,"danger small")}
      </div>
    </div>
  `).join("")
  :`<p class="sub">No files uploaded yet.</p>`;
}

async function viewFile(k){
  try{
    const blob=await fileGet(k);
    if(!blob)return alert("File not found in this browser.");

    const url=URL.createObjectURL(blob);
    const a=document.createElement("a");
    a.href=url;
    a.target="_blank";
    a.rel="noopener";
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),60000);
  }catch(err){
    alert("Unable to open file: "+err.message);
  }
}

async function removeFile(k){
  if(!confirm("Delete this uploaded file?"))return;

  try{
    await fileDelete(k);

    state.developments.forEach(d=>{
      d.files=(d.files||[]).filter(f=>f.id!==k);
      d.parcels.forEach(p=>
        p.jobs.forEach(j=>
          j.files=(j.files||[]).filter(f=>f.id!==k)
        )
      );

      if(d.budgetV25){
        d.budgetV25.payments.forEach(p=>{
          if(p.fileId===k)p.fileId="";
        });
      }
    });

    save();render();
  }catch(err){
    alert("Delete failed: "+err.message);
  }
}

/* FULL JSON BACKUP */

function blobData(blob){
  return new Promise((ok,no)=>{
    const r=new FileReader();
    r.onload=()=>ok(r.result);
    r.onerror=()=>no(r.error);
    r.readAsDataURL(blob);
  });
}

function dataBlob(s){
  const [h,b]=s.split(",");
  const mime=h.match(/data:([^;]+)/)?.[1]||
    "application/octet-stream";
  const raw=atob(b);
  const a=new Uint8Array(raw.length);
  for(let i=0;i<raw.length;i++)a[i]=raw.charCodeAt(i);
  return new Blob([a],{type:mime});
}

async function exportBackup(){
  try{
    const files={};

    for(const f of allFiles()){
      const blob=await fileGet(f.id);
      if(blob)files[f.id]=await blobData(blob);
    }

    const backup={
      format:"a7-v25",
      exportedAt:new Date().toISOString(),
      state,files
    };

    const url=URL.createObjectURL(
      new Blob([JSON.stringify(backup)],{
        type:"application/json"
      })
    );

    const a=document.createElement("a");
    a.href=url;
    a.download=`A7-Superintendent-V25-Backup-${date()}.json`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),60000);
  }catch(err){
    alert("Backup failed: "+err.message);
  }
}

async function importBackup(ev){
  const f=ev.target.files?.[0];
  if(!f)return;

  let backup;

  try{
    backup=JSON.parse(await f.text());

    if(
      !["a7-v21","a7-v22","a7-v23","a7-v24","a7-v25"]
        .includes(backup.format)||
      !Array.isArray(backup.state?.developments)||
      !Array.isArray(backup.state?.contractors)||
      !Array.isArray(backup.state?.bids)
    )throw Error("Invalid V21–V25 backup");
  }catch(err){
    return alert("Cannot read backup: "+err.message);
  }

  if(!confirm(
    "Replace ALL current A7 data in this browser with this backup? " +
    "Export your current backup first."
  ))return;

  try{
    const d=db||await openDB();

    await new Promise((ok,no)=>{
      const t=d.transaction("files","readwrite");
      t.objectStore("files").clear();
      t.oncomplete=ok;
      t.onerror=()=>no(t.error);
    });

    for(const [k,v] of Object.entries(backup.files||{})){
      await filePut(k,dataBlob(v));
    }

    state={...clone(EMPTY),...backup.state};
    save();go("dashboard");
    alert("Backup imported.");
  }catch(err){
    alert("Import failed: "+err.message);
  }
}
